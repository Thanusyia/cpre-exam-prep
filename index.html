const RECAP_DATA={"t1":{"cards":[{"id":"t1-recap-0","expand_id":"exp-t1-0","title":"The 4 Core RE Activities","body":"<b>Elicit &rarr; Document &rarr; Validate &rarr; Manage.<\/b> These four are the pillars of RE. <em>Formalizing<\/em> is <b>not<\/b> a core activity.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 230\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"230\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st10_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st10_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st10_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st10_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><rect x=\"188\" y=\"8\" width=\"124\" height=\"46\" rx=\"6\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"250\" y=\"26\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">1 · ELICIT<\/text><text x=\"250\" y=\"42\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Gather needs<\/text><rect x=\"358\" y=\"92\" width=\"124\" height=\"46\" rx=\"6\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"420\" y=\"110\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">2 · DOCUMENT<\/text><text x=\"420\" y=\"126\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Specify<\/text><rect x=\"188\" y=\"176\" width=\"124\" height=\"46\" rx=\"6\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"250\" y=\"194\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">3 · VALIDATE<\/text><text x=\"250\" y=\"210\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Confirm<\/text><rect x=\"8\" y=\"92\" width=\"124\" height=\"46\" rx=\"6\" fill=\"#56d36422\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"70\" y=\"110\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">4 · MANAGE<\/text><text x=\"70\" y=\"126\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Control<\/text><circle cx=\"250\" cy=\"113\" r=\"34\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"250\" y=\"110\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"14\" font-weight=\"700\" font-family=\"sans-serif\">RE<\/text><text x=\"250\" y=\"125\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Cycle<\/text><line x1=\"312\" y1=\"31\" x2=\"360\" y2=\"98\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st10_a0)\" stroke-dasharray=\"5,3\"/><line x1=\"358\" y1=\"140\" x2=\"316\" y2=\"178\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st10_a0)\" stroke-dasharray=\"5,3\"/><line x1=\"188\" y1=\"200\" x2=\"134\" y2=\"144\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st10_a0)\" stroke-dasharray=\"5,3\"/><line x1=\"70\" y1=\"94\" x2=\"188\" y2=\"36\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st10_a0)\" stroke-dasharray=\"5,3\"/><text x=\"250\" y=\"222\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">These four activities are continuous and overlapping, not strictly sequential<\/text><\/svg><\/div><p><b>Elicitation<\/b> turns implicit stakeholder desires into explicit requirements &mdash; seeking, capturing, and consolidating from available sources. <b>Documentation<\/b> records those requirements in appropriate work products using natural language, templates, or models. <b>Validation<\/b> confirms that documented requirements actually match the stakeholders&apos; true needs &mdash; the right requirements, not just requirements written right. <b>Management<\/b> handles storing, changing, and tracing requirements across their life cycle.<\/p><p><b>Worked example:<\/b> A checkpoint-kiosk project at an airport begins with interviews and workshops (<em>elicit<\/em>), captures outputs in user stories and a context diagram (<em>document<\/em>), runs a walkthrough with operations staff to confirm nothing is missed (<em>validate<\/em>), then version-controls and traces requirements to test cases (<em>manage<\/em>). None of these steps is called &ldquo;formalizing&rdquo; &mdash; natural language is an accepted representation throughout.<\/p><p><b>Glossary key terms:<\/b> <em>Elaboration<\/em> = umbrella term for elicitation + negotiation + validation. <em>Requirements Engineering<\/em> = systematic/disciplined approach to specification <b>and<\/b> management.<\/p>"},{"id":"t1-recap-1","expand_id":"exp-t1-1","title":"3 Kinds of Requirements","body":"<b>Functional<\/b> (result/behavior a function provides) &middot; <b>Quality<\/b> (quality concern not covered by functional) &middot; <b>Constraints<\/b> (limit solution space beyond functional/quality needs).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 185\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"185\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st11_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st11_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st11_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st11_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><rect x=\"175\" y=\"8\" width=\"150\" height=\"40\" rx=\"6\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"250\" y=\"24\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">REQUIREMENTS<\/text><text x=\"250\" y=\"40\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">(All 3 types)<\/text><line x1=\"250\" y1=\"48\" x2=\"75\" y2=\"85\" stroke=\"#30363d\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><rect x=\"0\" y=\"85\" width=\"150\" height=\"60\" rx=\"6\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"75\" y=\"103\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">Functional<\/text><text x=\"75\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">What it does<\/text><line x1=\"250\" y1=\"48\" x2=\"250\" y2=\"85\" stroke=\"#30363d\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><rect x=\"175\" y=\"85\" width=\"150\" height=\"60\" rx=\"6\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"250\" y=\"103\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">Quality<\/text><text x=\"250\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">How well<\/text><line x1=\"250\" y1=\"48\" x2=\"425\" y2=\"85\" stroke=\"#30363d\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><rect x=\"350\" y=\"85\" width=\"150\" height=\"60\" rx=\"6\" fill=\"#d2a8ff22\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"425\" y=\"103\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">Constraints<\/text><text x=\"425\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Boundaries<\/text><text x=\"75\" y=\"153\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">e.g. Use cases<\/text><text x=\"75\" y=\"167\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">e.g. Business rules<\/text><text x=\"250\" y=\"153\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">e.g. Performance<\/text><text x=\"250\" y=\"167\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">e.g. Security<\/text><text x=\"425\" y=\"153\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">e.g. Legal regs<\/text><text x=\"425\" y=\"167\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">e.g. Budget cap<\/text><\/svg><\/div><p>The popular rule &ldquo;<em>what<\/em> the system shall do = functional, <em>how<\/em> = quality&rdquo; often leads to misclassifications. The correct test is: <b>what concern does the requirement address?<\/b><\/p><ul><li><b>Functional requirement<\/b> &mdash; a result, behavior, or interaction. Example: &ldquo;The system shall display an entry form with name/surname fields.&rdquo; Even if phrased with lots of &lsquo;how&rsquo; detail (font, field width), it is still functional.<\/li><li><b>Quality requirement<\/b> &mdash; a quality concern: performance, security, reliability, usability, availability. Example: &ldquo;Response time &le; 2 s in 90% of cases.&rdquo;<\/li><li><b>Constraint<\/b> &mdash; restricts the solution space but is neither functional nor a quality property. Example: &ldquo;The system must use Subversion for configuration management.&rdquo;<\/li><\/ul><p>Constraints split into: Technical / Legal / Organisational / Cultural / Environmental / Physical.<\/p><p><b>Non-functional requirement<\/b> = quality requirement <b>or<\/b> constraint (Glossary: NFR is umbrella for both).<\/p>"},{"id":"t1-recap-2","expand_id":"exp-t1-2","title":"Why RE Matters","body":"RE <b>minimises risk of failure<\/b>, eases intellectual complexity, provides estimation basis, and is a prerequisite for proper testing. Poor RE &rarr; expensive late rework.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 206\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"206\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Cost of Fixing a Defect by Phase<\/text><line x1=\"70\" y1=\"30\" x2=\"70\" y2=\"165\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"165\" x2=\"490\" y2=\"165\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><rect x=\"84\" y=\"153\" width=\"52\" height=\"12\" rx=\"3\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"110\" y=\"147\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">1×<\/text><text x=\"110\" y=\"180\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">RE<\/text><rect x=\"169\" y=\"135\" width=\"52\" height=\"30\" rx=\"3\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"195\" y=\"129\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">3×<\/text><text x=\"195\" y=\"180\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Design<\/text><rect x=\"254\" y=\"105\" width=\"52\" height=\"60\" rx=\"3\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"280\" y=\"99\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">10×<\/text><text x=\"280\" y=\"180\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Code<\/text><rect x=\"339\" y=\"69\" width=\"52\" height=\"96\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"365\" y=\"63\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">40×<\/text><text x=\"365\" y=\"180\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Test<\/text><rect x=\"424\" y=\"37\" width=\"52\" height=\"128\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"450\" y=\"31\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">200×<\/text><text x=\"450\" y=\"180\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Prod<\/text><text x=\"250\" y=\"198\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Fix defects early! RE errors caught in production cost 200× more.<\/text><\/svg><\/div><p>The handbook identifies four core value propositions of adequate RE:<\/p><ol><li>Early detection/correction of wrong or missing requirements is far cheaper than rework after deployment &mdash; defects detected late can cost 1&ndash;2 orders of magnitude more.<\/li><li>RE eases intellectual complexity by systematically capturing and structuring the problem space.<\/li><li>A proper requirements baseline is the foundation for realistic effort and cost estimation.<\/li><li>Testing requires requirements as a reference &mdash; without them you cannot define acceptance criteria.<\/li><\/ol><p>Typical symptoms of inadequate RE: schedule pressure &rarr; rush to implementation; communication breakdown between stakeholders and developers; self-evident assumption trap; insufficient RE education.<\/p>"},{"id":"t1-recap-3","expand_id":"exp-t1-3","title":"Stakeholder, System, and Context","body":"<b>Stakeholder<\/b> = person/org who influences requirements <em>or<\/em> is impacted by the system. <b>System<\/b> = umbrella term (products, services, devices). <b>Context<\/b> = relevant part of environment.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 242\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"242\" fill=\"#161b22\" rx=\"8\"/><ellipse cx=\"250\" cy=\"118\" rx=\"235\" ry=\"100\" fill=\"#d2a8ff10\" stroke=\"#d2a8ff\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"/><ellipse cx=\"250\" cy=\"118\" rx=\"180\" ry=\"78\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><ellipse cx=\"250\" cy=\"118\" rx=\"80\" ry=\"42\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"250\" y=\"28\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Application Domain<\/text><text x=\"250\" y=\"39\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">(outside RE responsibility)<\/text><text x=\"250\" y=\"58\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">System Context<\/text><text x=\"250\" y=\"70\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">actors &amp; interfaces<\/text><text x=\"250\" y=\"114\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" font-family=\"sans-serif\">SYSTEM<\/text><text x=\"250\" y=\"130\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">what we build<\/text><rect x=\"95\" y=\"96\" width=\"80\" height=\"44\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"135\" y=\"114\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Human Actor<\/text><text x=\"135\" y=\"128\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">(user)<\/text><rect x=\"325\" y=\"96\" width=\"86\" height=\"44\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"368\" y=\"114\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Neighbour Sys<\/text><text x=\"368\" y=\"128\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">(context actor)<\/text><text x=\"250\" y=\"234\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Context boundary = what RE must understand. Domain = background knowledge only.<\/text><\/svg><\/div><p><b>Stakeholder (Glossary definition):<\/b> &ldquo;A person or organization who influences a system&apos;s requirements or who is impacted by that system.&rdquo; Influence can be indirect (e.g., following manager instructions). Users are always stakeholders; not all stakeholders are users.<\/p><p><b>System<\/b> is deliberately broad &mdash; includes software products, services, apps, cyber-physical systems (software + hardware), socio-technical systems (software + hardware + people + organisation). RE applies to all of these.<\/p><p><b>Context<\/b> = the part of the system&apos;s environment relevant for understanding the system and its requirements (not the entire world). The context boundary separates relevant from irrelevant environment. The system boundary separates the system from its context.<\/p><p><b>Scope<\/b> = range of things that <em>can be shaped and designed<\/em> during development &mdash; not the same as system boundary (in-scope components may be inside the context; out-of-scope components may be inside the system boundary).<\/p>"},{"id":"t1-recap-4","expand_id":"exp-t1-4","title":"The RE Role","body":"Mediator, communicator, facilitator, and quality steward. NOT a unilateral decision-maker. RE is a <b>role<\/b>, not a job title &mdash; business analysts, POs, system engineers may all act in this role.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 130\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"130\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st14_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st14_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st14_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st14_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><rect x=\"10\" y=\"30\" width=\"120\" height=\"66\" rx=\"6\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"70\" y=\"60\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Stakeholders<\/text><text x=\"70\" y=\"76\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Needs & Goals<\/text><rect x=\"185\" y=\"20\" width=\"130\" height=\"86\" rx=\"6\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"250\" y=\"52\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirements<\/text><text x=\"250\" y=\"67\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Engineer<\/text><text x=\"250\" y=\"83\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Mediates · Clarifies<\/text><text x=\"250\" y=\"97\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Documents · Validates<\/text><rect x=\"370\" y=\"30\" width=\"120\" height=\"66\" rx=\"6\" fill=\"#56d36422\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"430\" y=\"60\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Dev Team<\/text><text x=\"430\" y=\"76\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Implementation<\/text><line x1=\"132\" y1=\"63\" x2=\"183\" y2=\"63\" stroke=\"#ffa657\" stroke-width=\"1.5\" marker-end=\"url(#st14_aY)\"/><line x1=\"317\" y1=\"63\" x2=\"368\" y2=\"63\" stroke=\"#56d364\" stroke-width=\"1.5\" marker-end=\"url(#st14_aB)\"/><line x1=\"183\" y1=\"70\" x2=\"132\" y2=\"70\" stroke=\"#8b949e\" stroke-width=\"1\" marker-end=\"url(#st14_a0)\" stroke-dasharray=\"5,2\"/><text x=\"250\" y=\"122\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">RE bridges the communication gap — a key source of project failure if neglected.<\/text><\/svg><\/div><p>People act in the RE role when they: elicit, document, validate, and/or manage requirements; have in-depth knowledge to define and select RE practices; bridge problem-solution gap.<\/p><p>Job functions that frequently include RE: business analyst, application specialist, product owner, systems engineer, developer (especially in agile). Even designers, testers, architects, and CTOs benefit from RE knowledge.<\/p><p>Beyond technical/analytical skills, a Requirements Engineer needs <b>soft skills<\/b>: ability to listen, moderate, negotiate, and mediate; empathy for stakeholders; openness to others&apos; needs and ideas.<\/p>"},{"id":"t1-recap-5","expand_id":"exp-t1-5","title":"System vs Stakeholder vs User Requirements","body":"<b>System<\/b> = how the system shall work at its interface with the environment. <b>Stakeholder<\/b> = desires/needs from their perspective. <b>User<\/b> = subset of stakeholder requirements (users only).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 155\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"155\" fill=\"#161b22\" rx=\"8\"/><text x=\"12\" y=\"15\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Level<\/text><text x=\"185\" y=\"15\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Who writes it<\/text><text x=\"300\" y=\"15\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Who reads it<\/text><text x=\"425\" y=\"15\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Example<\/text><rect x=\"5\" y=\"24\" width=\"490\" height=\"34\" rx=\"4\" fill=\"#d2a8ff15\" stroke=\"#d2a8ff\" stroke-width=\"1\"/><text x=\"12\" y=\"46\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Stakeholder Req.<\/text><text x=\"185\" y=\"46\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">Stakeholders<\/text><text x=\"300\" y=\"46\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">PM / RE team<\/text><text x=\"425\" y=\"46\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">System shall allow use<\/text><rect x=\"5\" y=\"62\" width=\"490\" height=\"34\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"12\" y=\"84\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">System Req.<\/text><text x=\"185\" y=\"84\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">RE team<\/text><text x=\"300\" y=\"84\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">Architects / Dev<\/text><text x=\"425\" y=\"84\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">System shall validate<\/text><rect x=\"5\" y=\"100\" width=\"490\" height=\"34\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"12\" y=\"122\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">User Req.<\/text><text x=\"185\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">RE team<\/text><text x=\"300\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">End users<\/text><text x=\"425\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-family=\"sans-serif\">I want to book a seat<\/text><text x=\"250\" y=\"148\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-family=\"sans-serif\">Higher level = WHY; Lower level = HOW<\/text><\/svg><\/div><p>Requirement forms by perspective (aligned with ISO 29148):<\/p><ul><li><b>Business requirements<\/b> &mdash; business goals/objectives of an organisation to be achieved by employing a system.<\/li><li><b>Stakeholder requirements<\/b> &mdash; what stakeholders desire; written from stakeholder perspective.<\/li><li><b>User requirements<\/b> &mdash; subset of stakeholder requirements covering user desires and needs.<\/li><li><b>System requirements<\/b> &mdash; how the system shall behave at its boundary; this is RE&apos;s primary concern.<\/li><li><b>Domain requirements<\/b> &mdash; domain properties in the context that are required to hold (e.g., gearbox constraint on parking engagement).<\/li><\/ul>"}]},"t2":{"cards":[{"id":"t2-recap-0","expand_id":"exp-t2-0","title":"All 9 Principles at a Glance","body":"1 Value orientation &middot; 2 Stakeholders &middot; 3 Shared understanding &middot; 4 Context &middot; 5 Problem-req-solution &middot; 6 Validation &middot; 7 Evolution &middot; 8 Innovation &middot; 9 Systematic work","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 270\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"270\" fill=\"#161b22\" rx=\"8\"/><rect x=\"10\" y=\"10\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"86\" y=\"32\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P1<\/text><text x=\"86\" y=\"52\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Value Orientation<\/text><text x=\"86\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Align to goals<\/text><rect x=\"170\" y=\"10\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"246\" y=\"32\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P2<\/text><text x=\"246\" y=\"52\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Stakeholders<\/text><text x=\"246\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Include the right people<\/text><rect x=\"330\" y=\"10\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"406\" y=\"32\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P3<\/text><text x=\"406\" y=\"52\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Shared Understanding<\/text><text x=\"406\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Common language<\/text><rect x=\"10\" y=\"90\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"86\" y=\"112\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P4<\/text><text x=\"86\" y=\"132\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Context<\/text><text x=\"86\" y=\"148\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Know the system boundary<\/text><rect x=\"170\" y=\"90\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#d2a8ff18\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"246\" y=\"112\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P5<\/text><text x=\"246\" y=\"132\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Problem→Req→Sol<\/text><text x=\"246\" y=\"148\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Don’t skip steps<\/text><rect x=\"330\" y=\"90\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#ff7b7218\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"406\" y=\"112\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P6<\/text><text x=\"406\" y=\"132\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Validation<\/text><text x=\"406\" y=\"148\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Check against real needs<\/text><rect x=\"10\" y=\"170\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"86\" y=\"192\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P7<\/text><text x=\"86\" y=\"212\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Evolution<\/text><text x=\"86\" y=\"228\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Manage change<\/text><rect x=\"170\" y=\"170\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"246\" y=\"192\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P8<\/text><text x=\"246\" y=\"212\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Innovation<\/text><text x=\"246\" y=\"228\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Consider alternatives<\/text><rect x=\"330\" y=\"170\" width=\"152\" height=\"72\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"406\" y=\"192\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"12\" font-weight=\"800\" font-family=\"sans-serif\">P9<\/text><text x=\"406\" y=\"212\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">Systematic Work<\/text><text x=\"406\" y=\"228\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Use processes &amp; tools<\/text><\/svg><\/div><p>These principles are from Table 2.1 of the handbook and form the foundation of all subsequent chapters. They are not mutually exclusive &mdash; multiple principles apply simultaneously in any RE activity.<\/p><p><b>What is NOT a principle:<\/b> &ldquo;Regular retrospectives&rdquo; (agile practice), &ldquo;object-oriented design&rdquo;, &ldquo;waterfall process&rdquo;, &ldquo;code reviews&rdquo; &mdash; if an exam option sounds like a specific agile ceremony or development practice, it is almost certainly not an RE principle.<\/p>"},{"id":"t2-recap-1","expand_id":"exp-t2-1","title":"P1: Value Orientation","body":"Requirements are a <b>means to an end<\/b>, not an end in itself. Value = Benefit &minus; Cost. RE effort must be proportionate to risk.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 206\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"206\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st21_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st21_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><\/defs><rect x=\"175\" y=\"8\" width=\"150\" height=\"40\" rx=\"6\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"250\" y=\"23\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Business Goals<\/text><text x=\"250\" y=\"37\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">(why we build it)<\/text><line x1=\"250\" y1=\"48\" x2=\"250\" y2=\"76\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#st21_aG)\"/><rect x=\"100\" y=\"78\" width=\"300\" height=\"40\" rx=\"6\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"250\" y=\"94\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Stakeholder Goals<\/text><text x=\"250\" y=\"108\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">(what they need)<\/text><line x1=\"250\" y1=\"118\" x2=\"250\" y2=\"144\" stroke=\"#79c0ff\" stroke-width=\"1.5\" marker-end=\"url(#st21_aB)\"/><rect x=\"100\" y=\"146\" width=\"300\" height=\"36\" rx=\"6\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"250\" y=\"161\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirements<\/text><text x=\"250\" y=\"175\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">(derived from the goals above)<\/text><text x=\"250\" y=\"198\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">P1 Value Orientation: every requirement must trace to a goal that delivers value<\/text><\/svg><\/div><p>The benefit of a requirement = degree it contributes to building a successful system + reduction of risk of failure/rework. The cost = eliciting, validating, documenting, managing it.<\/p><p><b>Key insight:<\/b> The economic effects of RE are mostly <em>indirect<\/em> &mdash; RE saves costs during implementation and operation that would otherwise be spent on rework. But the costs of RE are immediate and visible, while the benefits are future and indirect. This creates short-term budget pressure to cut RE investment.<\/p><p><b>Rules of thumb:<\/b> The optimal amount of RE depends on the specific situation. The effort invested should be inversely proportional to the risk you are willing to take.<\/p><p>Criticality of a requirement is assessed by: importance of the stakeholder(s) stating it + impact of missing it + effort to specify + distinctiveness + degree of shared understanding + feedback cycle length.<\/p>"},{"id":"t2-recap-2","expand_id":"exp-t2-2","title":"P2: Stakeholders","body":"Classify as <b>Critical / Major / Minor<\/b> by degree of influence on system success. Not considering a critical stakeholder will likely make the system fail.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 192\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"192\" fill=\"#161b22\" rx=\"8\"/><circle cx=\"80\" cy=\"58\" r=\"36\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"80\" y=\"54\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Direct<\/text><text x=\"80\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7\" font-weight=\"normal\" font-family=\"sans-serif\">Users, ops, support<\/text><line x1=\"80\" y1=\"95\" x2=\"160\" y2=\"127\" stroke=\"#ffa65766\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><circle cx=\"200\" cy=\"58\" r=\"36\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"200\" y=\"54\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Indirect<\/text><text x=\"200\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7\" font-weight=\"normal\" font-family=\"sans-serif\">Regulators, sponsors<\/text><line x1=\"200\" y1=\"95\" x2=\"200\" y2=\"127\" stroke=\"#3fb95066\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><circle cx=\"320\" cy=\"58\" r=\"36\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"320\" y=\"54\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">System<\/text><text x=\"320\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7\" font-weight=\"normal\" font-family=\"sans-serif\">Devs, architects<\/text><line x1=\"320\" y1=\"95\" x2=\"320\" y2=\"127\" stroke=\"#79c0ff66\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><circle cx=\"440\" cy=\"58\" r=\"36\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"440\" y=\"54\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Other<\/text><text x=\"440\" y=\"68\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7\" font-weight=\"normal\" font-family=\"sans-serif\">Competitors, society<\/text><line x1=\"440\" y1=\"95\" x2=\"340\" y2=\"127\" stroke=\"#56d36466\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><rect x=\"140\" y=\"128\" width=\"220\" height=\"38\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"250\" y=\"143\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">RE Team<\/text><text x=\"250\" y=\"158\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Identifies &amp; engages all groups<\/text><text x=\"250\" y=\"184\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">Key risk: missing stakeholders = missing requirements<\/text><\/svg><\/div><p>Every stakeholder has a <b>role<\/b> (user, client, customer, operator, regulator, developer in agile). A stakeholder may have multiple roles simultaneously.<\/p><p><b>Critical:<\/b> omitting these stakeholders &rarr; severe problems, system failure or uselessness. <b>Major:<\/b> omitting &rarr; adverse impact on success, but not failure. <b>Minor:<\/b> omitting &rarr; no or minor influence.<\/p><p>For stakeholder groups with too many individuals or when individuals are unknown: use <b>personas<\/b> (fictitious characters representing groups with similar characteristics).<\/p><p>It is insufficient to consider only end users and customers. Other stakeholders (regulators, operators, security officers, competitors) carry critical requirements that are easily missed.<\/p>"},{"id":"t2-recap-3","expand_id":"exp-t2-3","title":"P3: Shared Understanding","body":"<b>Explicit<\/b> (documented/agreed) + <b>implicit<\/b> (common background). Both forms can be false. RE creates, fosters, <em>and secures<\/em> shared understanding.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 195\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"200\" fill=\"#161b22\" rx=\"8\"/><circle cx=\"190\" cy=\"95\" r=\"82\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><circle cx=\"310\" cy=\"95\" r=\"82\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"135\" y=\"62\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">EXPLICIT<\/text><text x=\"135\" y=\"76\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">Documented<\/text><text x=\"135\" y=\"90\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Approved specs<\/text><text x=\"135\" y=\"104\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Glossary terms<\/text><text x=\"365\" y=\"62\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">IMPLICIT<\/text><text x=\"365\" y=\"76\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">Unstated<\/text><text x=\"365\" y=\"90\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Assumptions<\/text><text x=\"365\" y=\"104\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Domain norms<\/text><text x=\"250\" y=\"80\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">SHARED<\/text><text x=\"250\" y=\"96\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Goal<\/text><text x=\"250\" y=\"110\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Make implicit<\/text><text x=\"250\" y=\"122\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">explicit!<\/text><text x=\"250\" y=\"165\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">RE creates shared, EXPLICIT understanding via specs, glossaries, reviews<\/text><text x=\"250\" y=\"180\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">Glossary is critical — one term, one meaning, no synonyms<\/text><\/svg><\/div><p><b>Enablers of shared understanding:<\/b> domain knowledge, domain-specific standards, previous successful collaboration, existence of reference systems, shared culture/values, informed mutual trust.<\/p><p><b>Obstacles:<\/b> geographic distance, supplier-customer mutual distrust, outsourcing, regulatory constraints, large/diverse teams, high turnover.<\/p><p><b>Rule:<\/b> The fewer enablers and more obstacles, the more requirements must be specified and validated explicitly. The more enablers and fewer obstacles, the more you can rely on implicit shared understanding (agile context).<\/p><p>Primary means for assessing explicit shared understanding: thorough validation (Principle 6). For implicit: short feedback loops (Ch. 5).<\/p>"},{"id":"t2-recap-4","expand_id":"exp-t2-4","title":"P4: Context","body":"<b>System boundary<\/b> = system vs context. <b>Context boundary<\/b> = relevant vs irrelevant environment. RE must deal with domain requirements and domain assumptions in context.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 218\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"218\" fill=\"#161b22\" rx=\"8\"/><ellipse cx=\"250\" cy=\"105\" rx=\"235\" ry=\"88\" fill=\"#d2a8ff10\" stroke=\"#d2a8ff\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"/><ellipse cx=\"250\" cy=\"105\" rx=\"175\" ry=\"60\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><ellipse cx=\"250\" cy=\"105\" rx=\"75\" ry=\"36\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"250\" y=\"36\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Application Domain (background only)<\/text><text x=\"250\" y=\"58\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">System Context<\/text><text x=\"250\" y=\"101\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">SYSTEM<\/text><text x=\"250\" y=\"115\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">(in scope)<\/text><rect x=\"100\" y=\"85\" width=\"76\" height=\"40\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"138\" y=\"101\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Human<\/text><text x=\"138\" y=\"114\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Actor<\/text><rect x=\"330\" y=\"85\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"373\" y=\"101\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Neighbour<\/text><text x=\"373\" y=\"114\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">System<\/text><text x=\"250\" y=\"209\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">P4: Define the context boundary explicitly before eliciting requirements.<\/text><\/svg><\/div><p><b>Context (RE definition):<\/b> The part of a system&apos;s environment being relevant for understanding the system and its requirements.<\/p><p><b>Context boundary:<\/b> Separates relevant environment from irrelevant environment (things that do not influence the system).<\/p><p><b>System boundary:<\/b> Separates the system from its surrounding context. This is where external interfaces are defined.<\/p><p><b>Domain requirements<\/b> = domain properties in the context that are <em>required<\/em> to hold. Example: air traffic system requires that radar correctly identifies aircraft (a context requirement the ATS cannot control).<\/p><p><b>Domain assumptions<\/b> = assumptions about real-world phenomena in context. Example: radar is not jammed; aircraft fly above minimum altitude. If these fail, system requirements cannot be met regardless of implementation quality.<\/p><p>RE must also consider: how context changes impact requirements; how to map real-world context requirements to system requirements; which context assumptions must hold for the system to work.<\/p>"},{"id":"t2-recap-5","expand_id":"exp-t2-5","title":"P5: Problem-Requirement-Solution","body":"The three are <b>inevitably intertwined<\/b>. Strictly separating RE from design is rarely possible. Still, Requirements Engineers strive to separate concerns when thinking/documenting.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 130\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"130\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st25_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st25_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st25_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st25_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><rect x=\"28\" y=\"35\" width=\"110\" height=\"56\" rx=\"8\" fill=\"#ff7b7222\" stroke=\"#ff7b72\" stroke-width=\"2\"/><text x=\"83\" y=\"59\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">PROBLEM<\/text><text x=\"83\" y=\"75\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Analyse the real issue<\/text><rect x=\"190\" y=\"25\" width=\"120\" height=\"76\" rx=\"8\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"250\" y=\"49\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">REQUIREMENT<\/text><text x=\"250\" y=\"65\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">What must be provided<\/text><rect x=\"362\" y=\"35\" width=\"110\" height=\"56\" rx=\"8\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"417\" y=\"59\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">SOLUTION<\/text><text x=\"417\" y=\"75\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">How to fulfil it<\/text><line x1=\"140\" y1=\"63\" x2=\"188\" y2=\"63\" stroke=\"#ffa657\" stroke-width=\"2\" marker-end=\"url(#st25_aY)\"/><line x1=\"312\" y1=\"63\" x2=\"360\" y2=\"63\" stroke=\"#3fb950\" stroke-width=\"2\" marker-end=\"url(#st25_aG)\"/><line x1=\"188\" y1=\"80\" x2=\"140\" y2=\"80\" stroke=\"#ff7b7266\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><text x=\"250\" y=\"115\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"600\" font-family=\"sans-serif\">P5: Requirements sit between Problem and Solution — never conflate them!<\/text><\/svg><\/div><p>Problems, requirements, and solutions do not necessarily occur in order. For innovative systems, solution ideas create user needs that become requirements.<\/p><p><b>Intertwinement types:<\/b><\/p><ul><li><b>Hierarchical<\/b> &mdash; high-level requirements lead to design decisions, which inform lower-level requirements.<\/li><li><b>Technical feasibility<\/b> &mdash; non-feasible requirements may only be identified when exploring solutions.<\/li><li><b>Validation<\/b> &mdash; prototypes (partial solutions) validate requirements.<\/li><li><b>Solution bias<\/b> &mdash; stakeholders envisage different solutions, leading to conflicting requirements.<\/li><\/ul><p>Strict waterfall (separate RE phase before any design) does not work well because of this intertwinement. Iterative processes handle it better.<\/p>"},{"id":"t2-recap-6","expand_id":"exp-t2-6","title":"P6: Validation","body":"<b>Non-validated requirements are useless.<\/b> Validation = confirming that documented requirements match stakeholders&apos; needs (the <em>right<\/em> requirements).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 142\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"142\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"16\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10.5\" font-weight=\"700\" font-family=\"sans-serif\">P6 Validation Checklist — Are we building the RIGHT thing?<\/text><rect x=\"8\" y=\"26\" width=\"156\" height=\"38\" rx=\"5\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"24\" y=\"50\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">✓<\/text><text x=\"40\" y=\"50\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Consistent with goals?<\/text><rect x=\"172\" y=\"26\" width=\"156\" height=\"38\" rx=\"5\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"188\" y=\"50\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">✓<\/text><text x=\"204\" y=\"50\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Correct &amp; complete?<\/text><rect x=\"336\" y=\"26\" width=\"156\" height=\"38\" rx=\"5\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"352\" y=\"50\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">✓<\/text><text x=\"368\" y=\"50\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Verifiable / testable?<\/text><rect x=\"8\" y=\"70\" width=\"156\" height=\"38\" rx=\"5\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"24\" y=\"94\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">✓<\/text><text x=\"40\" y=\"94\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Free from solutions?<\/text><rect x=\"172\" y=\"70\" width=\"156\" height=\"38\" rx=\"5\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"188\" y=\"94\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">⚠<\/text><text x=\"204\" y=\"94\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Missing req spotted?<\/text><rect x=\"336\" y=\"70\" width=\"156\" height=\"38\" rx=\"5\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"352\" y=\"94\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"12\" font-weight=\"700\" font-family=\"sans-serif\">✓<\/text><text x=\"368\" y=\"94\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Ambiguity resolved?<\/text><text x=\"250\" y=\"134\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Validation ≠ Verification. Validation = right thing. Verification = built right.<\/text><\/svg><\/div><p>Validation checks: agreement among stakeholders; adequate coverage of desires/needs by requirements; reasonable domain assumptions.<\/p><p><b>Validation vs Verification:<\/b><\/p><ul><li><b>Validation<\/b> = right requirements specified? (match stakeholder needs)<\/li><li><b>Verification<\/b> = requirements documented correctly? (meet quality criteria)<\/li><\/ul><p>Validation is a core RE activity &mdash; there is no specification without validation. Performing validation only at the end of development is too risky and too expensive to fix.<\/p>"},{"id":"t2-recap-7","expand_id":"exp-t2-7","title":"P7: Evolution","body":"Changing requirements are <b>normal<\/b>, not an accident. Requirements Engineers must both permit change and keep requirements stable enough for systematic development.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 135\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"135\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st27_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st27_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st27_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st27_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirements Change — P7: Manage Evolution Proactively<\/text><line x1=\"30\" y1=\"65\" x2=\"470\" y2=\"65\" stroke=\"#8b949e\" stroke-width=\"2\"/><circle cx=\"80\" cy=\"65\" r=\"8\" fill=\"#3fb95033\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"80\" y=\"90\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Baseline<\/text><text x=\"80\" y=\"102\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">v1.0<\/text><circle cx=\"180\" cy=\"65\" r=\"8\" fill=\"#ffa65733\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"180\" y=\"90\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Change<\/text><text x=\"180\" y=\"102\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">request<\/text><circle cx=\"260\" cy=\"65\" r=\"8\" fill=\"#79c0ff33\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"260\" y=\"90\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Impact<\/text><text x=\"260\" y=\"102\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">analysis<\/text><circle cx=\"350\" cy=\"65\" r=\"8\" fill=\"#3fb95033\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"350\" y=\"90\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Updated<\/text><text x=\"350\" y=\"102\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">baseline<\/text><circle cx=\"440\" cy=\"65\" r=\"8\" fill=\"#56d36433\" stroke=\"#56d364\" stroke-width=\"2\"/><text x=\"440\" y=\"90\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Re-validated<\/text><line x1=\"180\" y1=\"52\" x2=\"180\" y2=\"36\" stroke=\"#ffa657\" stroke-width=\"1.5\" marker-end=\"url(#st27_aY)\"/><text x=\"180\" y=\"30\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">External trigger<\/text><text x=\"250\" y=\"128\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">Every change must follow impact analysis → update traces → re-validate<\/text><\/svg><\/div><p>Causes of requirement changes: changed business processes, competitor actions, client priority changes, technology changes, user feedback, error detection in requirements or domain assumptions.<\/p><p>The tension: must permit change (ignoring it is futile) vs. must keep stability (daily changes make systematic development impossible). Resolution: managed change process (Ch. 6.7).<\/p><p><b>Handbook warning:<\/b> &ldquo;Requirements Engineers need to manage the evolution of requirements. Otherwise, the evolution will manage them.&rdquo;<\/p>"},{"id":"t2-recap-8","expand_id":"exp-t2-8","title":"P8: Innovation","body":"Good RE goes beyond what stakeholders tell you. Requirements Engineers are <b>innovation-aware<\/b> &mdash; they strive to make stakeholders happy/excited, not just satisfied.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 153.9\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"153.9\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">P8: Innovation — Question assumptions, explore alternatives<\/text><rect x=\"14\" y=\"30\" width=\"150\" height=\"100\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"89\" y=\"68.0\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">As-Is Analysis<\/text><text x=\"89\" y=\"83.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Understand current state<\/text><text x=\"89\" y=\"98.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">before innovating<\/text><rect x=\"176\" y=\"30\" width=\"150\" height=\"100\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"251\" y=\"68.0\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Creative Techs<\/text><text x=\"251\" y=\"83.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Brainstorming,<\/text><text x=\"251\" y=\"98.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Analogy, Lateral thinking<\/text><rect x=\"338\" y=\"30\" width=\"150\" height=\"100\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"413\" y=\"68.0\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Alternatives<\/text><text x=\"413\" y=\"83.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Always evaluate<\/text><text x=\"413\" y=\"98.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">≥2 solutions<\/text><text x=\"250\" y=\"147.9\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Innovation without RE = guessing. RE channels creativity into validated needs.<\/text><\/svg><\/div><p>A Requirements Engineer who just records what stakeholders say misses the opportunity to do things better. Kano&apos;s model (Ch. 4) links directly here: focusing only on satisfiers misses delighters.<\/p><p><b>Example from handbook:<\/b> Insurance agents request a zoom button for an oversized report. A good RE engineer asks questions, discovers they&apos;re moving to tablets, and proposes two-finger gestures + column collapsing &mdash; solving the underlying problem innovatively rather than adding a workaround.<\/p>"},{"id":"t2-recap-9","expand_id":"exp-t2-9","title":"P9: Systematic and Disciplined Work","body":"RE is a <b>discipline<\/b>, not an art. Configure a suitable process; select appropriate practices; do not reuse past approaches without reflection. No one-size-fits-all.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 145\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"145\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"16\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">P9: Systematic RE — Process + Tools + Standards<\/text><rect x=\"10\" y=\"30\" width=\"115\" height=\"90\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"67\" y=\"52\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">PROCESS<\/text><text x=\"67\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Defined activities,<\/text><text x=\"67\" y=\"88\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">roles, artefacts<\/text><rect x=\"132\" y=\"30\" width=\"115\" height=\"90\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"189\" y=\"52\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">NOTATION<\/text><text x=\"189\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Agreed language<\/text><text x=\"189\" y=\"88\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">for specs & models<\/text><rect x=\"254\" y=\"30\" width=\"115\" height=\"90\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"311\" y=\"52\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">TOOLS<\/text><text x=\"311\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">RM tools, glossary,<\/text><text x=\"311\" y=\"88\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">version control<\/text><rect x=\"376\" y=\"30\" width=\"115\" height=\"90\" rx=\"6\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"433\" y=\"52\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">GUIDELINES<\/text><text x=\"433\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Best practices,<\/text><text x=\"433\" y=\"88\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">checklists, templates<\/text><text x=\"250\" y=\"138\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Ad hoc RE = inconsistent quality. Systematic RE = repeatable results.<\/text><\/svg><\/div><p>Systematic and disciplined RE means: configuring a well-suited RE process; selecting best-fit practices and work products from available options; not always using the same process; not reusing past practices without reflection.<\/p><p><b>Handbook note:<\/b> &ldquo;Agility and flexibility are not valid excuses for an unsystematic, ad hoc style of work in RE.&rdquo; Even highly agile projects need systematic RE practices (e.g., systematically fostering shared understanding).<\/p>"}]},"t3":{"cards":[{"id":"t3-recap-0","expand_id":"exp-t3-0","title":"Work Products","body":"<b>Any<\/b> recorded intermediate or final result generated in an RE work process. User stories, diagrams, prototypes, use cases all count &mdash; not just final fixed documents.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 160\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"160\" fill=\"#161b22\" rx=\"8\"/><rect x=\"8\" y=\"10\" width=\"484\" height=\"30\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"16\" y=\"30\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">▪ Requirements Specification<\/text><text x=\"200\" y=\"30\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">The primary artefact — list of all requirements<\/text><rect x=\"8\" y=\"46\" width=\"484\" height=\"30\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"16\" y=\"66\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">▪ Requirements Model<\/text><text x=\"200\" y=\"66\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Visual representation — UML, use cases<\/text><rect x=\"8\" y=\"82\" width=\"484\" height=\"30\" rx=\"4\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"16\" y=\"102\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">▪ Glossary<\/text><text x=\"200\" y=\"102\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Defined terms used in the project<\/text><rect x=\"8\" y=\"118\" width=\"484\" height=\"30\" rx=\"4\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1\"/><text x=\"16\" y=\"138\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">▪ Meeting Protocols<\/text><text x=\"200\" y=\"138\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Decisions and discussion records<\/text><text x=\"250\" y=\"158\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">All work products must be maintained and version-controlled<\/text><\/svg><\/div><p><b>Glossary definition:<\/b> &ldquo;A recorded, intermediate or final result generated in a work process.&rdquo; Synonym: artifact.<\/p><p><b>Work product lifespan categories:<\/b><\/p><ul><li><b>Temporary<\/b> &mdash; created for communication, discarded after use (e.g., workshop sketch). No metadata kept.<\/li><li><b>Evolving<\/b> &mdash; grows over multiple iterations (e.g., growing user story backlog). Needs owner, status, revision history.<\/li><li><b>Durable<\/b> &mdash; baselined or released (e.g., requirements spec in a contract). Full metadata + formal change process required.<\/li><\/ul><p>A temporary work product may become evolving; an evolving work product becomes durable when baselined.<\/p><p><b>Key work products (Table 3.1):<\/b> Individual requirement, user story, use case, graphic model, task description, external interface description, epic, feature, system requirements specification, product/sprint backlog, story map, vision, glossary, prototype.<\/p>"},{"id":"t3-recap-1","expand_id":"exp-t3-1","title":"3 Documentation Forms","body":"<b>Natural language<\/b> (expressive, flexible, but ambiguous) &middot; <b>Templates<\/b> (phrase, form, document) &middot; <b>Models<\/b> (diagrams). Combine text + models for full coverage.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 205\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"200\" fill=\"#161b22\" rx=\"8\"/><rect x=\"10\" y=\"5\" width=\"155\" height=\"188\" rx=\"6\" fill=\"#3fb95012\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"87\" y=\"22\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">NATURAL<\/text><text x=\"87\" y=\"36\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">LANGUAGE<\/text><text x=\"87\" y=\"73.0\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Sentences & paragraphs<\/text><rect x=\"16\" y=\"62\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"87\" y=\"99.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Universal<\/text><rect x=\"16\" y=\"92\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"87\" y=\"108\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Flexible<\/text><rect x=\"16\" y=\"122\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"87\" y=\"138\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Easy to read<\/text><rect x=\"16\" y=\"152\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"87\" y=\"168\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Ambiguous risk<\/text><rect x=\"173\" y=\"5\" width=\"155\" height=\"188\" rx=\"6\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"250\" y=\"22\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">SEMI-FORMAL<\/text><text x=\"250\" y=\"73.0\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Templates & models<\/text><rect x=\"179\" y=\"62\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"250\" y=\"99.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">UML diagrams<\/text><rect x=\"179\" y=\"92\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"250\" y=\"108\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Use case tables<\/text><rect x=\"179\" y=\"122\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"250\" y=\"138\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">More precise<\/text><rect x=\"179\" y=\"152\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"250\" y=\"168\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Tool-supported<\/text><rect x=\"336\" y=\"5\" width=\"155\" height=\"188\" rx=\"6\" fill=\"#ffa65712\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"413\" y=\"22\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">FORMAL<\/text><text x=\"413\" y=\"73.0\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Mathematical notation<\/text><rect x=\"342\" y=\"62\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"413\" y=\"99.0\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Z, Alloy, OCL<\/text><rect x=\"342\" y=\"92\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"413\" y=\"108\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Unambiguous<\/text><rect x=\"342\" y=\"122\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"413\" y=\"138\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Hard to read<\/text><rect x=\"342\" y=\"152\" width=\"143\" height=\"24\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"413\" y=\"168\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Expert only<\/text><line x1=\"10\" y1=\"192\" x2=\"490\" y2=\"192\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"10\" y=\"200\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Informal<\/text><text x=\"490\" y=\"200\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Formal<\/text><text x=\"250\" y=\"200\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Most projects blend NL + semi-formal<\/text><\/svg><\/div><p><b>Natural language:<\/b> Extremely expressive, no training needed to read. But imprecise semantics, ambiguities/omissions hard to find in written text vs spoken. Must follow proven rules and avoid known pitfalls.<\/p><p><b>NL pitfalls to avoid:<\/b> incomplete descriptions (unfilled verb placeholders); unspecific nouns (&ldquo;the data&rdquo;, &ldquo;the user&rdquo;); incomplete conditions (missing else clauses); incomplete comparisons (no reference object).<\/p><p><b>NL caution items:<\/b> passive voice (hides actor); universal quantifiers (all/always/never &mdash; hides edge cases, typically the most severe issue); nominalizations (e.g., &ldquo;authentication&rdquo; &rarr; may hide an unspecified authentication process requirement).<\/p><p><b>Models:<\/b> Advantages: easier to understand relationships, focused on one aspect, restricted syntax reduces a
