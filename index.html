s":["Innovation","Stakeholders","Validation","Systematic and disciplined work"],"correct":[0],"exp":"\"More of the same is not enough\" - blind replication misses the chance to innovate and to drop features that no longer create value."},{"id":"R6-t2-14","type":"K","pts":2,"q":"Decide true or false about the nine FL3 principles as a set.","stmts":["There are exactly nine principles in the FL3 syllabus","The principles apply only to agile projects","\"Shared understanding\" and \"Context\" are two of the nine principles","The principles are independent of any specific RE technique"],"correct":[true,false,true,true],"exp":"Nine principles, technique-agnostic, applicable to any development paradigm. Shared understanding (P3) and Context (P4) are among them."},{"id":"R6-t2-15","type":"A","pts":1,"q":"Late in a project, the team discovers they documented many detailed requirements for a reporting module nobody plans to use. Which principle was neglected? (1 answer)","opts":["Value orientation","Evolution","Shared understanding","Context"],"correct":[0],"exp":"Effort was spent on requirements that deliver no value - a direct violation of Principle 1."}],"t3":[{"id":"A3310","official":true,"type":"A","pts":1,"q":"Which statement regarding work products is NOT correct? (1 answer)","opts":["Any recorded information created during RE is a work product.","Recorded artifacts describing gathered info as intermediate/final results are work products.","User stories, activity diagrams, use cases and prototypes are work products.","Only final requirements documents describing a fixed set of requirements are work products."],"correct":[3],"exp":"D is too narrow — intermediate artifacts (user stories, diagrams, prototypes) are also work products, not only final fixed documents."},{"id":"A3311","official":true,"type":"A","pts":1,"q":"Which concept CANNOT be found in UML class diagrams? (1 answer)","opts":["Associations","States","Multiplicities","Attributes"],"correct":[1],"exp":"States belong to state machine diagrams. Class diagrams contain classes, attributes, associations, and multiplicities."},{"id":"P0416","official":true,"type":"P","pts":2,"need":2,"q":"Choose the two best combinations of role and its criterion for the requirements. (2 answers)","opts":["For the testers, it must be possible to realize the requirements.","For the developers, it must be possible to change the requirements easily.","For all people involved, the requirements in a work product have to be consistent.","For the project manager, the requirements have to be necessary.","For the maintenance staff, it must be possible to prioritize the requirements."],"correct":[2,3],"exp":"C — consistency benefits everyone working with the document. D — the PM needs requirements to be necessary (scope control). A pairs testers with the wrong criterion (testability/verifiability would fit, not 'realize'), B and E are mismatched role/criterion pairs."},{"id":"P0417","official":true,"type":"P","pts":2,"need":2,"q":"Terminology is inconsistent and the contact described expected interactions as flows of user actions and system reactions. Which two approaches best fit? (2 answers)","opts":["Creating a statechart","Establishing a glossary","Eliciting and documenting the quality requirements","Creating a use case diagram and specifying the use cases","Creating and testing prototypes"],"correct":[1,3],"exp":"A glossary fixes inconsistent terminology; use cases capture interaction flows of actions and reactions. Statecharts, quality requirements, and prototypes do not directly address these two stated problems."},{"id":"K0418","official":true,"type":"K","pts":2,"q":"Which statements on choosing notations for documenting functional requirements apply / do not apply?","stmts":["Stakeholders should be able to read the notation used for a work product.","Diagrams have to be applied in projects with object-oriented development.","To ensure optimal communication, a notation aligned to the type of requirement should be used.","Graphical notations are well suited for describing system requirements."],"correct":[true,false,true,false],"exp":"A Applies — readability by stakeholders matters. B Does not — diagrams are not obligatory just because development is OO. C Applies — fit notation to requirement type. D Does not — graphical notations are not universally well-suited for all system requirements (text is often needed)."},{"id":"K3423","official":true,"type":"K","pts":2,"q":"IREB quality criteria for work products — true or false?","stmts":["A specification is non-redundant if each requirement is documented once and does not overlap with others.","A use case diagram might be inconsistent with an activity diagram even if both are non-redundant.","A requirements specification is consistent if no single requirement contradicts other requirements.","A use case specification is conformant if it contains all relevant requirements for the final product."],"correct":[true,true,true,false],"exp":"A, B, C are correct definitions. D is false — that describes completeness, not conformance; conformance means adherence to agreed format/standards."},{"id":"P0510","official":true,"type":"P","pts":2,"need":2,"q":"Two best arguments for introducing a phrase template (e.g. sentence template)? (2 answers)","opts":["Phrase templates help document well-structured requirements via a predefined syntactic structure.","Requirements per a phrase template do not contain incomplete relationships.","Learning to write per a phrase template does not require much time.","Using a phrase template basically delivers a greater degree of information content.","Requirements per a phrase template ensure that quality criteria are met."],"correct":[0,4],"exp":"A correct — phrase templates provide a predefined syntactic structure that guides authors. E correct — requirements written to a validated phrase template satisfy the structural quality criteria encoded in that template. B incorrect — a template cannot guarantee complete relationships; content must still be supplied. C incorrect — learning a phrase template does take meaningful effort. D incorrect — templates constrain form but do not automatically increase information content."},{"id":"A0508","official":true,"type":"A","pts":1,"q":"'The system Alpha should display all data sets in all submenus.' Most severe issue? (1 answer)","opts":["The requirement is written in the passive voice.","Universal quantifiers have been used.","The requirement has incomplete conditions.","Nominalizations have been used."],"correct":[1],"exp":"'all data sets in all submenus' are universal quantifiers — the most severe issue, as they often hide unverified assumptions and edge cases."},{"id":"K3520","official":true,"type":"K","pts":2,"q":"Working with template-based work products — true or false?","stmts":["Templates provide a blueprint for structuring single requirements and whole specifications.","Template-based products for single requirements can help prevent incomplete natural-language formulation.","Template-based work products are inherently better in content than freely formulated requirements.","Templates are obligatory for all authors of a requirements specification."],"correct":[true,true,false,false],"exp":"A, B True. C False — templates improve structure, not inherently content quality. D False — templates are recommended, not obligatory."},{"id":"A3521","official":true,"type":"A","pts":1,"q":"Requirements R1–R3 describe operational states and transitions of a fleet-tracking system. Which diagram best supports this? (1 answer)","opts":["State diagram","Class diagram","Context diagram","Use case diagram"],"correct":[0],"exp":"Requirements describe states (in operation, lost-signal) and transitions — a state diagram is the natural fit."},{"id":"K0619","official":true,"type":"K","pts":2,"q":"Class diagram: Actor [1..10] stars-in [0..*] Film, Film [1..3] directed-by [1] Director. Do the statements match?","stmts":["Three directors may direct a film collaboratively.","A film with only one actor may be submitted.","A director may direct two films submitted.","An actor may star in any number of films.","A film must have ten actors starring in it."],"correct":[false,true,true,true,false],"exp":"A) False - Film directed-by [1] Director means exactly ONE director per film; three directors is impossible. B) True - Actor multiplicity on Film side is [1..10], minimum is 1, so a film with exactly one actor IS valid. C) True - Director directs Film with [1..3] cardinality; directing two films falls within range. D) True - Actor stars-in Film with [0..*] on the Film side, meaning an actor can star in zero to many films. E) False - [1..10] is a range; 'must have ten actors' would require multiplicity [10]. (Handbook: UML multiplicity notation - Glossary: Cardinality = min and max number of objects in a relationship.)"},{"id":"A0620","official":true,"type":"A","pts":1,"q":"What is NOT depicted in a use case diagram? (1 answer)","opts":["The process steps of an application","The actors of an application","The boundary between an application and its environment","An application's functionality"],"correct":[0],"exp":"Use case diagrams show actors, system boundary, and use cases (functionality) — but NOT the internal process steps (that's an activity diagram)."},{"id":"K3605","official":true,"type":"K","pts":2,"q":"State diagram for password authorization (states: not entitled, application in progress, entitled, blocked). Correctly modeled or not?","stmts":["Users in state blocked can be unblocked by resetting the user's password.","If abuse for a user in state entitled is noticed, the user's password is blocked.","If the validity period for a user in state entitled has expired, the password is deleted and the user is set to not entitled.","If an application request is approved, the user gets an approval mail."],"correct":[false,true,true,false],"exp":"A — no transition out of 'blocked' via password reset is shown → incorrect/not modeled. B — abuse noticed /block password (entitled→blocked) is modeled. C — validity period expired /delete password (entitled→not entitled) is modeled. D — 'application approved /create password' is the action, not an approval mail → not modeled."},{"id":"K0643","official":true,"type":"K","pts":2,"q":"Activity diagram of a measurement (fork after Initialize memory into Initialize measuring device and a branch with Initialize network connection + Load certificates → Register at server; join → Collect → Process & transfer → wait/resend loop → Deactivate). Do the statements match?","stmts":["Initialize measuring device must happen prior to Register at server.","Register at server happens as soon as Load certificates is ready.","Initialize network connection and Load certificates must finish at the same time.","Deactivate measuring device is executed as soon as Data receipt confirmed is true."],"correct":[false,false,true,true],"exp":"A No — the two are on parallel branches, no ordering between device init and register. B No — Register at server needs BOTH network connection and certificates (join), not just certificates. C Yes — both are on a parallel fork that joins before Register at server, so both must complete. D Yes — the [Data receipt confirmed] guard leads to Deactivate."},{"id":"P0623","official":true,"type":"P","pts":2,"need":2,"q":"Two substantial advantages of graphical models over plain natural-language text? (2 answers)","opts":["Models often focus on specific aspects and reduce cognitive load for understanding.","Models allow complete description of all requirements for a planned system.","Models can be checked more easily and have restricted syntax reducing ambiguity/omissions.","Models use a repository, therefore better for managing requirements.","With proper tools, source code can be generated, saving testing effort."],"correct":[0,2],"exp":"A and C are genuine advantages (focus/abstraction and reduced ambiguity via restricted syntax). B overclaims completeness, D is about tooling not models, E is false (code-gen does not remove the need for testing)."},{"id":"K0624","official":true,"type":"K","pts":2,"q":"Navigation activity diagram (fork: Enter destination ∥ Determine GPS coordinates; then ask dynamic; [Avoid congestions]→Query traffic; merge→Calculate route→Display route). True or false?","stmts":["A route can be calculated without querying traffic information.","A route can be calculated after querying traffic information.","The system can ask for the desire to calculate the route dynamically without first determining GPS coordinates.","The order of Enter destination and Determine GPS coordinates is arbitrary."],"correct":[true,true,false,true],"exp":"A True — the [Do not avoid congestions] path skips traffic query. B True — the [Avoid congestions] path queries traffic then calculates. C False — Determine GPS coordinates precedes the dynamic-route decision. D True — they are on a parallel fork, so order is arbitrary."},{"id":"P0626","official":true,"type":"P","pts":2,"need":2,"q":"Documenting enrollment steps with a model-based approach — which two diagrams best suit? (2 answers)","opts":["BPMN diagram","Laus-Ohl diagram","Activity diagram","Class diagram","Use case diagram"],"correct":[0,2],"exp":"Enrollment is a process/flow of steps — BPMN and activity diagrams model control flow. 'Laus-Ohl diagram' is fictitious; class and use case diagrams do not capture step sequences."},{"id":"A0627","official":true,"type":"A","pts":1,"q":"What is described in the function and flow aspect of a system? (1 answer)","opts":["Portability of the system","Reaction of the system to an internal state transition","Structure of input and output data","Transformation of input data into output data"],"correct":[3],"exp":"The function/flow aspect concerns how inputs are transformed into outputs. State reactions = behaviour aspect; data structure = data/structure aspect; portability = quality."},{"id":"G3-01","type":"A","pts":1,"q":"Which UML diagram is best for showing the system boundary, actors, and the functions the system offers? (1 answer)","opts":["Use case diagram","Class diagram","State diagram","Sequence diagram"],"correct":[0],"exp":"Use case diagrams show actors, boundary, and use cases (functions)."},{"id":"G3-02","type":"P","pts":2,"need":2,"q":"Which two are IREB quality criteria for a requirements specification? (2 answers)","opts":["Consistency","Profitability","Completeness","Marketability","Popularity"],"correct":[0,2],"exp":"Consistency and completeness are recognised quality criteria; the others are not RE quality criteria."},{"id":"G3-03","type":"K","pts":2,"q":"Decide true/false about natural-language requirements.","stmts":["Passive voice can hide the actor responsible for an action.","Universal quantifiers ('all', 'every') are always harmless.","Nominalizations can obscure process details.","A glossary helps reduce ambiguous terminology."],"correct":[true,false,true,true],"exp":"Universal quantifiers often hide unexamined edge cases — not harmless. The rest are correct linguistic risks/mitigations."},{"id":"G3-04","type":"A","pts":1,"q":"A sentence/phrase template (e.g. MASTeR/Rupp) primarily improves which property of a requirement? (1 answer)","opts":["Syntactic structure and completeness of the sentence","The system's runtime performance","The project's budget","The number of stakeholders"],"correct":[0],"exp":"Templates enforce a syntactic skeleton that prompts for the parts of a complete requirement sentence."},{"id":"G3-05","type":"K","pts":2,"q":"Decide true/false about models in RE.","stmts":["An activity diagram shows control flow and concurrency.","A class diagram shows dynamic state transitions.","A context diagram shows the system and its external interfaces.","Models can use forks and joins to express parallelism."],"correct":[true,false,true,true],"exp":"State transitions are shown in state diagrams, not class diagrams. The rest are correct."},{"id":"G3-06","type":"A","pts":1,"q":"Which is the best reason to combine textual and model-based documentation? (1 answer)","opts":["Each compensates for the other's weaknesses (precision vs. detail/nuance).","To maximise page count.","Models are always inferior to text.","Text is always inferior to models."],"correct":[0],"exp":"Models give structure/abstraction; text captures nuance — combining them yields better coverage."},{"id":"G3-07","type":"P","pts":2,"need":2,"q":"Which two elements appear in a UML class diagram? (2 answers)","opts":["Attributes","States","Associations","Guards","Swimlanes"],"correct":[0,2],"exp":"Attributes and associations are class-diagram elements. States/guards belong to state diagrams; swimlanes to activity diagrams."},{"id":"G3-08","type":"A","pts":1,"q":"'Verifiability' as a quality criterion means a requirement: (1 answer)","opts":["Can be checked to determine whether the system satisfies it.","Is written in passive voice.","Contains a universal quantifier.","Is stored in a tool."],"correct":[0],"exp":"A verifiable requirement permits an objective test/check of fulfilment."},{"id":"N3-01","type":"A","pts":1,"q":"A Requirements Engineer needs to capture who may do what in a system. Which notation is MOST suitable? (1 answer)","opts":["Use case diagram","State diagram","Activity diagram","Class diagram"],"correct":[0],"exp":"Use case diagrams show actors (who) and use cases (what), making them ideal for capturing system functionality from a user perspective and system-actor boundaries."},{"id":"N3-02","type":"K","pts":2,"q":"Decide true or false about natural language requirements.","stmts":["Natural language is the most universally understood notation for requirements.","Natural language requirements are immune to ambiguity.","Using active voice and naming the subject reduces ambiguity in natural language requirements.","Universal quantifiers such as 'always' and 'never' should be used carefully as they can create unintended obligations."],"correct":[true,false,true,true],"exp":"A True — NL is accessible to all stakeholders. B False — NL is inherently prone to ambiguity, incompleteness, and inconsistency. C True — active voice + named subject clarifies responsibility. D True — universal quantifiers create absolute obligations that may be impossible to satisfy."},{"id":"N3-03","type":"P","pts":2,"need":2,"q":"Which two notations are best suited for describing the dynamic behaviour (sequences of actions over time) of a system? (2 answers)","opts":["Activity diagram","Class diagram","Sequence diagram","Entity-relationship diagram","Context diagram"],"correct":[0,2],"exp":"Activity diagrams (flows/actions over time) and sequence diagrams (interaction between actors/objects over time) both model dynamic behaviour. Class/ER diagrams model structure; context diagrams show system boundaries."},{"id":"N3-04","type":"A","pts":1,"q":"Which quality criterion is violated if the same requirement appears in two different sections of a specification with slightly different wording? (1 answer)","opts":["Non-redundancy","Completeness","Consistency","Conformance"],"correct":[0],"exp":"Non-redundancy means each requirement is documented exactly once and does not overlap with others. Duplicate (even slightly differing) entries violate non-redundancy — and may also violate consistency."},{"id":"N3-05","type":"K","pts":2,"q":"Decide true or false about use case specifications.","stmts":["A use case specification typically includes a main success scenario and alternative flows.","Preconditions and postconditions are standard components of a use case specification.","A use case diagram alone fully specifies behaviour for implementation.","Actors in a use case diagram can be human users or external systems."],"correct":[true,true,false,true],"exp":"A and B are standard use case specification content. C False — the diagram only provides an overview; textual use case specs are needed for implementation. D True — actors represent any external entity that interacts with the system."},{"id":"N3-06","type":"A","pts":1,"q":"A state diagram is MOST appropriate when a requirement depends on: (1 answer)","opts":["The current state of a system object and events that trigger transitions.","The number of users accessing the system simultaneously.","The hierarchical structure of data objects.","The sequence of actions performed by multiple actors."],"correct":[0],"exp":"State diagrams model objects that have distinct states and transition between them based on events/conditions — exactly what R1-R3 in the fleet management example demonstrate."},{"id":"N3-07","type":"P","pts":2,"need":2,"q":"Which two quality criteria apply to an INDIVIDUAL requirement (not a specification as a whole)? (2 answers)","opts":["Unambiguous","Verifiable","Complete (as a set of requirements)","Consistent (across all requirements)","Non-redundant (as a document)"],"correct":[0,1],"exp":"Unambiguity and verifiability are criteria for a SINGLE requirement. Completeness, consistency, and non-redundancy are criteria for the SPECIFICATION as a whole."},{"id":"N3-08","type":"A","pts":1,"q":"In RE documentation, the 'data and object aspect' is concerned with: (1 answer)","opts":["The structure of data entities and their relationships.","The sequence of steps carried out by the system.","The states an object can occupy.","The interfaces to external systems."],"correct":[0],"exp":"The data/object aspect covers the structure of information — entities, attributes, and relationships — typically modelled with class diagrams or ER diagrams."},{"id":"N3-09","type":"K","pts":2,"q":"Decide true or false about prototypes in RE.","stmts":["A prototype is a work product that can be used to validate requirements.","Only software prototypes are valid RE artefacts; paper prototypes are not.","Prototyping can help elicit requirements that stakeholders find hard to articulate.","Disposable prototypes are built to be thrown away after validation."],"correct":[true,false,true,true],"exp":"A True — prototypes validate requirements by demonstrating behaviour. B False — paper/low-fidelity prototypes are valid and commonly used. C True — showing rather than describing surfaces tacit requirements. D True — disposable (throwaway) prototypes are one recognised category."},{"id":"N3-10","type":"A","pts":1,"q":"Which is the MOST severe wording problem in: \"The system should possibly try to handle errors gracefully.\" (1 answer)","opts":["Weak modal verbs and vagueness ('should possibly try') make the requirement unverifiable.","The subject is unspecified.","The requirement uses passive voice.","The requirement contains a universal quantifier."],"correct":[0],"exp":"'Should possibly try' stacks weak modals creating total ambiguity — it cannot be tested. An unverifiable requirement violates the most fundamental quality criterion. The subject ('the system') IS specified."},{"id":"GA-t3-01","type":"A","pts":1,"q":"Which modal verb in requirements documents indicates a mandatory requirement?","opts":["May","Should","Shall","Could"],"correct":[2],"exp":"'Shall' (or 'must') indicates a mandatory requirement. 'Should' is desirable, 'May'/'Could' are optional. Aligns with RFC 2119 and IEEE 29148 conventions. [K1]"},{"id":"GA-t3-02","type":"A","pts":1,"q":"What is the purpose of a glossary in a requirements specification?","opts":["To list all requirements alphabetically","To define domain-specific terms and ensure consistent terminology","To document project team contacts","To list all approved design patterns"],"correct":[1],"exp":"A glossary defines key terms, abbreviations, and acronyms to prevent misunderstanding and ensure all stakeholders share a common vocabulary. [K1]"},{"id":"GA-t3-03","type":"A","pts":1,"q":"A user story follows which format?","opts":["Given [context], When [action], Then [outcome]","As a [role], I want [capability] so that [benefit]","The system shall [function] when [condition]","Subject: [actor]; Verb: [action]; Object: [data]"],"correct":[1],"exp":"The standard user story format is 'As a [role], I want [capability] so that [benefit]'. Given/When/Then is for acceptance criteria (BDD). [K1]"},{"id":"GA-t3-04","type":"A","pts":1,"q":"Which attribute is essential for every individual requirement in a specification?","opts":["A diagram illustrating the requirement","A unique identifier","A test script proving it works","A stakeholder signature"],"correct":[1],"exp":"Every requirement must have a unique identifier (ID) to enable reference, traceability, and change management. [K1]"},{"id":"GA-t3-05","type":"A","pts":1,"q":"The requirements specification document serves primarily as:","opts":["A project status report for management","A contractual and communication baseline between stakeholders, developers, and testers","A technical architecture blueprint","An implementation guide for developers"],"correct":[1],"exp":"The SRS is a shared agreement on what must be built, serving as the basis for design, testing, and acceptance. [K2]"},{"id":"GA-t3-06","type":"A","pts":1,"q":"What is a requirement boilerplate and why is it used?","opts":["A special font style required by IEEE standards","A structured sentence template that ensures requirements are complete and consistently formatted","A checklist of approvals needed before documenting requirements","A shortcut for writing requirements without review"],"correct":[1],"exp":"A boilerplate is a sentence template (e.g., 'The [actor] shall [verb] [object] [condition]') that guides consistent, complete natural language requirement writing. [K2]"},{"id":"GP-t3-01","type":"P","pts":1,"need":2,"q":"Which TWO of the following are required attributes that should be associated with requirements in a formal specification?","opts":["Unique identifier (ID)","Author's date of birth","Priority level","The card color used in a workshop"],"correct":[0,2],"exp":"Standard requirement attributes include: ID (essential), priority, status, version, source, rationale. Personal details are irrelevant. [K1]"},{"id":"GP-t3-02","type":"P","pts":1,"need":2,"q":"Which TWO of the following are typical contents of a System Requirements Specification (SRS)?","opts":["Functional requirements of the system","A complete project budget breakdown","Quality requirements (non-functional requirements)","The hiring plan for the development team"],"correct":[0,2],"exp":"An SRS contains functional requirements, quality requirements, constraints, and supporting information. Budget/hiring are project management artifacts. [K1]"},{"id":"GP-t3-03","type":"P","pts":1,"need":2,"q":"Which TWO of the following characteristics indicate a well-formed natural language requirement?","opts":["Uses 'shall' to indicate mandatory behavior","Uses subjective terms like 'fast', 'friendly', 'easy'","Is testable with a specific, measurable criterion","Is written as a long paragraph combining multiple conditions"],"correct":[0,2],"exp":"Good NL requirements use modal verbs (shall) and are testable/measurable. Subjective terms and compound sentences are common defects. [K2]"},{"id":"R6-t3-01","type":"A","pts":1,"q":"Two departments use the word \"client\" - one means a customer, the other a software process. Which glossary problem is this, and what helps? (1 answer)","opts":["A synonym; forbid the word entirely","A homonym; define the meanings and disambiguate the term in the glossary","An acronym; spell it out once","A redundancy; delete one definition"],"correct":[1],"exp":"One term with two meanings is a homonym. The glossary must capture both meanings and prescribe unambiguous usage."},{"id":"R6-t3-02","type":"K","pts":2,"q":"Decide true or false about the project glossary.","stmts":["The glossary should be maintained continuously, not written once and frozen","Only technical IT terms belong in the glossary","A responsible owner/maintainer should be assigned for the glossary","Synonyms and forbidden terms can be listed to steer consistent wording"],"correct":[true,false,true,true],"exp":"Glossaries live with the project, include domain terms and abbreviations, need an owner, and may prescribe preferred/forbidden synonyms."},{"id":"R6-t3-03","type":"A","pts":1,"q":"What is the main benefit of using a standardized document structure (reference structure) for a requirements specification? (1 answer)","opts":["It guarantees the requirements are correct","Readers can find information faster and gaps become visible","It removes the need for a glossary","It makes reviews unnecessary"],"correct":[1],"exp":"Standard structures aid navigation and completeness checking - they do not by themselves make content correct."},{"id":"R6-t3-04","type":"P","pts":2,"q":"Which TWO are advantages of documenting requirements with a fixed sentence (phrase) template? (2 answers)","opts":["Uniform sentence structure reduces ambiguity","Missing parts (e.g. condition, actor) become easy to spot","It guarantees stakeholder agreement","It eliminates the need for quality criteria","It works only for quality requirements"],"need":2,"correct":[0,1],"exp":"Templates enforce structure, which reduces ambiguity and makes omissions visible. Agreement and quality assurance still require validation."},{"id":"R6-t3-05","type":"A","pts":1,"q":"In requirements documents using prescribed verb conventions, the verb \"shall\" typically marks: (1 answer)","opts":["A legally binding mandatory requirement","A desirable but optional wish","A statement about the system environment","A future activity of the project team"],"correct":[0],"exp":"\"Shall\" marks mandatory requirements; \"should\" marks desired/optional ones; \"will\" often documents facts about the environment."},{"id":"R6-t3-06","type":"K","pts":2,"q":"Decide true or false about typical natural-language defects.","stmts":["Passive voice (\"the data is deleted\") can hide who performs the action","Universal quantifiers like \"always\" or \"all\" should be checked - do they really hold without exception?","Nominalizations (\"the authorization\") can hide an entire process that needs detailing","Ambiguity in requirements is usually inserted deliberately"],"correct":[true,true,true,false],"exp":"Passive voice, unchecked quantifiers and nominalizations are classic transformation effects that hide information. Ambiguity is rarely deliberate - it slips in unnoticed."},{"id":"R6-t3-07","type":"A","pts":1,"q":"Which element belongs in a fully dressed use case description? (1 answer)","opts":["Database table layout","Preconditions and main success scenario","Class inheritance hierarchy","Project budget"],"correct":[1],"exp":"Use case templates contain name, goal, actors, preconditions, main scenario, alternative/exception flows, postconditions - not design or project data."},{"id":"R6-t3-08","type":"P","pts":2,"q":"Which TWO situations favour MODEL-BASED documentation over plain prose? (2 answers)","opts":["Complex state-dependent behaviour must be specified precisely","Many interrelated structural elements (entities, relationships) must be captured","The audience refuses to read anything but contracts","No tool support of any kind is available","Requirements consist of three simple business rules"],"need":2,"correct":[0,1],"exp":"Diagrams excel where structure or behaviour is complex and interconnected; trivial content or contract-only audiences do not call for models."},{"id":"R6-t3-09","type":"A","pts":1,"q":"The \"structure and data\" aspect of requirements modeling answers which question? (1 answer)","opts":["Which states can the system be in?","Which static entities exist and how are they related?","Which user goals exist?","How is the project organised?"],"correct":[1],"exp":"Structure/data models (e.g. class or ER diagrams) capture static entities, attributes and relationships. States belong to behaviour modeling."},{"id":"R6-t3-10","type":"K","pts":2,"q":"Decide true or false about quality criteria for requirements DOCUMENTS (specifications).","stmts":["Consistency means the document contains no contradicting requirements","Completeness includes covering all relevant requirement types, not just functions","Modifiability is irrelevant once the document is approved","A clear structure supports traceability between related content"],"correct":[true,true,false,true],"exp":"Documents must stay modifiable across the life cycle - approval does not end change. The other statements reflect IREB document-level criteria."},{"id":"R6-t3-11","type":"A","pts":1,"q":"\"The system shall quickly display the search results.\" The PRIMARY defect of this requirement is: (1 answer)","opts":["It is redundant","It is not verifiable because \"quickly\" is unquantified","It uses passive voice","It is a constraint disguised as a function"],"correct":[1],"exp":"Without a measurable target (\"within 1 s for 95% of queries\"), no test can objectively pass or fail it - verifiability is violated."},{"id":"R6-t3-12","type":"P","pts":2,"q":"Which TWO techniques directly improve the precision of natural-language requirements? (2 answers)","opts":["Using an agreed glossary for all domain terms","Writing requirements according to a sentence template","Increasing the font size","Replacing all text with source code","Removing all examples"],"need":2,"correct":[0,1],"exp":"Glossaries fix terminology; templates fix sentence structure. Both attack ambiguity at its roots."},{"id":"R6-t3-13","type":"A","pts":1,"q":"Which notation is MOST suitable for specifying that a device passes through the states Off, Standby, Active with defined transitions? (1 answer)","opts":["Class diagram","State machine diagram","Use case diagram","Organisation chart"],"correct":[1],"exp":"State machines specify states, events and transitions precisely - exactly this need."},{"id":"R6-t3-14","type":"K","pts":2,"q":"Decide true or false about user stories.","stmts":["A common template is: As a <role>, I want <goal>, so that <benefit>","A user story makes every further conversation about the need unnecessary","Acceptance criteria concretise when a story is fulfilled","User stories may serve as containers/pointers to more detailed requirements"],"correct":[true,false,true,true],"exp":"Stories are intentionally lightweight placeholders for conversation, sharpened by acceptance criteria, and can link to detail. They do not replace communication."},{"id":"R6-t3-15","type":"A","pts":1,"q":"Besides developers, which group typically derives its work products DIRECTLY from the requirements specification? (1 answer)","opts":["Testers, who derive test cases from the requirements","Facility management","The marketing photography team","Payroll accounting"],"correct":[0],"exp":"Requirements are the basis for system test design - a key reason verifiability and traceability matter."}],"t4":[{"id":"A3409","official":true,"type":"A","pts":1,"q":"You notice an inconsistency in stakeholder statements about menu function arrangement. Best way to deal with it? (1 answer)","opts":["Discuss with an available stakeholder, get a clear statement and record their advice.","Invite all involved stakeholders to a meeting and reach an agreement.","Solve it yourself based on your UI experience to save time.","Forward to the product owner and let them decide based on risk evaluation."],"correct":[1],"exp":"An inconsistency among stakeholders is a conflict — the best resolution is to bring the involved stakeholders together to reach agreement, not to decide unilaterally or defer."},{"id":"P0309","official":true,"type":"P","pts":1,"need":2,"q":"Two statements best characterising the relationship between a Requirements Engineer and a stakeholder in the role of tester? (2 answers)","opts":["The Requirements Engineer provides input for the stakeholder's work.","The Requirements Engineer's results are managed by the stakeholder.","The stakeholder can contribute to ensure the quality of the RE's work.","The stakeholder supervises the RE's work.","There is no relationship between the RE's work and the stakeholder role."],"correct":[0,2],"exp":"A — requirements feed the tester's test design. C — testers help validate/QA requirements (e.g. testability review). B, D, E misrepresent the relationship."},{"id":"A0312","official":true,"type":"A","pts":1,"q":"Kano: dissatisfiers (basic factors) are hard to elicit. Most effective elicitation technique for them? (1 answer)","opts":["Prototyping","Questionnaire","Field observation","Brainstorming"],"correct":[2],"exp":"Basic factors are taken for granted and rarely voiced, so observing users in their real environment (field observation) surfaces them best."},{"id":"P0313","official":true,"type":"P","pts":2,"need":2,"q":"Two most important aspects when choosing suitable elicitation techniques? (2 answers)","opts":["The availability of the involved people.","The preferences of the requirements engineer.","The category of requirements based on Kano classification.","The complexity of the required tools.","The habitual use of a technique."],"correct":[0,2],"exp":"Technique choice depends on who is available and on the requirement category (Kano) being sought. RE preference, tool complexity, and habit are not primary selection criteria."},{"id":"A3410","official":true,"type":"A","pts":1,"q":"Which technique is NOT suitable for resolving requirements conflicts? (1 answer)","opts":["Overruling","Definition of variants","Compromise","Sampling"],"correct":[3],"exp":"Conflict-resolution techniques include agreement, compromise, voting, overruling, definition of variants, etc. 'Sampling' is an elicitation/observation idea, not a conflict-resolution technique."},{"id":"A0720","official":true,"type":"A","pts":1,"q":"One stakeholder wants a female-only voice; another calls it discriminatory and wants a male voice too. Conflict type? (1 answer)","opts":["Relationship conflict","Interest conflict","Structural conflict","Value conflict"],"correct":[3],"exp":"The disagreement is rooted in differing values/beliefs (fairness, discrimination) → value conflict."},{"id":"A0721","official":true,"type":"A","pts":2,"q":"Validating system requirements of a safety-critical braking component — most suitable technique? (1 answer)","opts":["A/B testing","Prototype","Walkthrough","Inspection"],"correct":[3],"exp":"For safety-critical requirements, a formal, rigorous review — inspection — is most appropriate (highest formality/defect-detection). Walkthroughs are less formal; prototypes/A-B testing don't suit upfront safety validation."},{"id":"P3411","official":true,"type":"P","pts":2,"need":2,"q":"Two most important attributes in a stakeholder list? (2 answers)","opts":["Their function/role","Their personal preferences","Their boss","Their relevance","Their previous projects"],"correct":[0,3],"exp":"Role/function and relevance (importance/influence) are the key attributes for prioritising stakeholder engagement."},{"id":"P0314","official":true,"type":"P","pts":1,"need":2,"q":"Two key advantages of using questionnaires for requirements elicitation? (2 answers)","opts":["Questionnaires allow a high number of participants.","Questionnaires allow statistically relevant statements on requirements.","Questionnaires allow the participants' understanding to be validated.","Questionnaires allow obtaining the most insights on delighters (excitement factors).","Questionnaires allow addressing the needs of individual stakeholders easily."],"correct":[0,1],"exp":"Questionnaires scale to many respondents and yield statistically meaningful data. They cannot validate understanding interactively, are weak for delighters, and are not tailored to individuals."},{"id":"K0324","official":true,"type":"K","pts":2,"q":"Elicitation technique classification — true or false?","stmts":["An interview is a gathering technique.","An analogy technique is a gathering technique.","System archeology is an observation technique.","Apprenticing is an observation technique."],"correct":[true,false,false,true],"exp":"A True — interviews are gathering/communication techniques. B False — analogy is a creativity technique, not a gathering one. C False — system archaeology analyses existing artefacts/documents; it is a document-based gathering technique, NOT an observation technique. D True — apprenticing is an observation technique where the RE shadows a practitioner."},{"id":"G4-01","type":"P","pts":2,"need":2,"q":"Which two are gathering (survey) elicitation techniques? (2 answers)","opts":["Interview","Questionnaire","Brainstorming","Prototyping","Analogy technique"],"correct":[0,1],"exp":"Interviews and questionnaires are gathering techniques. Brainstorming/analogy are creativity techniques; prototyping is a support/elicitation aid."},{"id":"G4-02","type":"A","pts":1,"q":"In the Kano model, a 'delighter' (excitement factor) is best described as: (1 answer)","opts":["A feature that, if present, greatly increases satisfaction but is not missed if absent.","A feature whose absence causes strong dissatisfaction.","A feature where satisfaction scales linearly with fulfilment.","A constraint imposed by law."],"correct":[0],"exp":"Delighters surprise and please when present; their absence is not penalised. Absence-penalised = basic factors; linear = performance factors."},{"id":"G4-03","type":"K","pts":2,"q":"Decide true/false about elicitation techniques.","stmts":["Prototyping helps elicit requirements through tangible feedback.","Observation techniques require users to write requirements themselves.","Workshops can accelerate consensus building.","Creativity techniques are useless for innovative products."],"correct":[true,false,true,false],"exp":"Observation does not require users to author requirements; creativity techniques are valuable for innovation. The rest are correct."},{"id":"G4-04","type":"A","pts":1,"q":"Which conflict-resolution technique creates separate solution variants for incompatible demands? (1 answer)","opts":["Definition of variants","Overruling","Consensus","Voting"],"correct":[0],"exp":"Definition of variants resolves a conflict by offering different configurations/variants for the differing parties."},{"id":"G4-05","type":"P","pts":2,"need":2,"q":"Which two are recognised conflict types in RE? (2 answers)","opts":["Schedule conflict","Value conflict","Syntax conflict","Interest conflict","Compile conflict"],"correct":[1,3],"exp":"The six IREB conflict types are subject matter, data, interest, value, relationship, and structural. Of the options, only value and interest conflicts are recognised types."},{"id":"G4-06","type":"A","pts":1,"q":"The first step in a structured conflict resolution is usually to: (1 answer)","opts":["Identify and analyse the conflict and its parties.","Immediately overrule the weaker stakeholder.","Ignore it until development.","Delete one of the requirements."],"correct":[0],"exp":"Conflict management starts with identification and analysis before selecting a resolution technique."},{"id":"G4-07","type":"K","pts":2,"q":"Decide true/false about stakeholders.","stmts":["A stakeholder is anyone with a justified interest in the system.","Only paying customers are stakeholders.","Regulators can be stakeholders.","Identifying stakeholders early reduces the risk of missing requirements."],"correct":[true,false,true,true],"exp":"Stakeholders include users, regulators, operators, etc. — not just paying customers."},{"id":"G4-08","type":"A","pts":1,"q":"Which technique is most appropriate to validate requirements with low formality and quick stakeholder feedback? (1 answer)","opts":["Walkthrough","Formal inspection","Mathematical proof","Audit"],"correct":[0],"exp":"A walkthrough is informal and fast; inspection is the most formal review technique."},{"id":"G4-09","type":"P","pts":2,"need":2,"q":"Which two help validate requirements? (2 answers)","opts":["Reviews","Prototyping","Random guessing","Ignoring stakeholders","Deleting the spec"],"correct":[0,1],"exp":"Reviews and prototypes are standard validation aids."},{"id":"G4-10","type":"A","pts":1,"q":"Negotiation in RE primarily aims to: (1 answer)","opts":["Reach agreement among stakeholders on conflicting requirements.","Reduce the number of stakeholders.","Avoid documenting decisions.","Eliminate all quality requirements."],"correct":[0],"exp":"Negotiation resolves conflicts and builds agreement on the requirement set."},{"id":"N4-01","type":"A","pts":1,"q":"Which elicitation technique is classified as a CREATIVITY technique? (1 answer)","opts":["Brainstorming","Interviews","Field observation","System archaeology"],"correct":[0],"exp":"Brainstorming is a creativity technique — it generates novel ideas. Interviews and field observation are communication/observation techniques; system archaeology is document-based."},{"id":"N4-02","type":"K","pts":2,"q":"Decide true or false about the Kano model applied to RE.","stmts":["Dissatisfiers (basic factors) cause strong dissatisfaction if absent but are taken for granted if present.","Satisfiers (performance factors) show a linear relationship between fulfilment and satisfaction.","Delighters (excitement factors) are typically known to stakeholders and easily elicited via questionnaires.","The Kano category of a feature can change over time as user expectations evolve."],"correct":[true,true,false,true],"exp":"A and B are correct Kano definitions. C False — delighters are UNKNOWN to stakeholders and cannot be elicited by asking directly; observation and creative techniques are better. D True — yesterday's delighters become tomorrow's dissatisfiers."},{"id":"N4-03","type":"P","pts":2,"need":2,"q":"Which two elicitation techniques are particularly effective for surfacing TACIT knowledge that stakeholders cannot easily articulate? (2 answers)","opts":["Field observation","Questionnaire","Apprenticing","Structured interview","Document analysis"],"correct":[0,2],"exp":"Field observation and apprenticing place the RE in the working environment where tacit/implicit knowledge is demonstrated in action. Questionnaires, structured interviews, and document analysis all require stakeholders to articulate knowledge explicitly."},{"id":"N4-04","type":"A","pts":1,"q":"During requirements negotiation, two stakeholders have directly opposing needs for the same feature. The RE team cannot find a compromise. Which conflict-resolution technique allows BOTH variants to exist in the system? (1 answer)","opts":["Definition of variants","Overruling","Compromise","Mediation"],"correct":[0],"exp":"Defining variants preserves both requirements as system variants or configurations. Overruling imposes one view; compromise alters both; mediation is a process, not a resolution outcome."},{"id":"N4-05","type":"K","pts":2,"q":"Decide true or false about requirements validation.","stmts":["Validation checks that requirements reflect the stakeholders' actual needs.","A walkthrough is led by the author of the requirements document.","An inspection follows a formal, defined process with trained reviewers and defect checklists.","Validation can be performed only after the system is built."],"correct":[true,true,true,false],"exp":"A True — validation = right requirements (vs verification = requirements written correctly). B True — walkthroughs are author-led, informal reviews. C True — inspections are the most rigorous review technique. D False — validation is conducted early, on requirements artefacts, before development."},{"id":"N4-06","type":"A","pts":1,"q":"A stakeholder insists on a feature that conflicts with the project budget constraint. This is BEST classified as: (1 answer)","opts":["A structural conflict","A value conflict","An interest conflict","A relationship conflict"],"correct":[0],"exp":"A structural conflict arises from organisational constraints (budgets, resources, authority, time) that structurally prevent both needs from being satisfied. Value conflicts are about differing beliefs; interest conflicts about competing goals."},{"id":"N4-07","type":"P","pts":2,"need":2,"q":"Which two factors are most important when selecting a requirements VALIDATION technique? (2 answers)","opts":["The criticality and risk of the requirements being validated.","The colour of the document template.","The availability and expertise of the reviewers.","The font size used in the specification.","Whether the RE prefers verbal or written communication."],"correct":[0,2],"exp":"Criticality/risk (a safety-critical system demands inspection over walkthrough) and reviewer availability/expertise are the primary selection factors. Aesthetics and personal preferences are irrelevant."},{"id":"N4-08","type":"A","pts":1,"q":"Which statement best describes the difference between a 'goal' and a 'requirement' in RE? (1 answer)","opts":["A goal is a high-level intention; a requirement is a specific, verifiable condition the system must satisfy.","Goals and requirements are synonymous.","Requirements are only written for software; goals apply to hardware.","A goal is always a quality requirement."],"correct":[0],"exp":"Goals (intentions/objectives) are refined into specific, verifiable requirements. They operate at different levels of abstraction and are not synonymous."},{"id":"N4-09","type":"K","pts":2,"q":"Decide true or false about stakeholder analysis.","stmts":["A stakeholder list should capture each stakeholder's role and their relevance to the project.","All stakeholders have equal influence on requirements.","Stakeholder analysis can identify requirement sources.","Opponents of a project (negative stakeholders) should be excluded from the stakeholder list."],"correct":[true,false,true,false],"exp":"A True — role and relevance are the two most important attributes. B False — stakeholders differ in authority, expertise, and influence. C True — identifying stakeholders identifies sources. D False — negative stakeholders must be managed and should appear in the list."},{"id":"N4-10","type":"A","pts":1,"q":"Which validation technique is MOST appropriate for a safety-critical embedded system where the cost of defects is extremely high? (1 answer)","opts":["Formal inspection with a trained review team and defect checklist.","A/B testing with end users.","Informal author walkthrough.","Prototype demonstration."],"correct":[0],"exp":"Formal inspection is the most rigorous technique (statistically proven highest defect-detection rate) and is appropriate when stakes are highest. A/B testing requires a deployed system; walkthroughs are informal; prototypes validate concepts but not formal specifications."},{"id":"GA-t4-01","type":"A","pts":1,"q":"Which elicitation technique category is best suited when stakeholders cannot articulate their needs clearly?","opts":["Document analysis","Questionnaires","Observation and ethnography","Formal reviews"],"correct":[2],"exp":"Observation techniques (contextual inquiry, ethnography) reveal implicit and tacit requirements that stakeholders cannot easily articulate in interviews. [K3]"},{"id":"GA-t4-02","type":"A","pts":1,"q":"A structured interview in RE is characterized by:","opts":["Open-ended questions with no predefined agenda","A fixed set of predetermined questions asked to all interviewees","Group discussion among stakeholders","Silent observation of users at work"],"correct":[1],"exp":"In a structured interview, all questions are defined in advance, enabling consistent comparison across multiple stakeholders. [K1]"},{"id":"GA-t4-03","type":"A","pts":1,"q":"Brainstorming as an elicitation technique is most appropriate for:","opts":["Eliciting detailed performance requirements","Generating a wide range of creative ideas without initial criticism","Analyzing existing documentation for embedded requirements","Conducting formal reviews of draft requirements"],"correct":[1],"exp":"Brainstorming encourages unconstrained idea generation. Criticism is suspended to maximize creative output. Ideal for exploring the solution space. [K2]"},{"id":"GA-t4-04","type":"A","pts":1,"q":"The '6-3-5 method' is a variant of which elicitation technique?","opts":["Structured interview","Observation","Brainwriting (written brainstorming)","Prototyping"],"correct":[2],"exp":"The 6-3-5 method (6 participants write 3 ideas, passing papers 5 times) is structured brainwriting that avoids dominant personalities suppressing ideas. [K1]"},{"id":"GA-t4-05","type":"A","pts":1,"q":"Document analysis as an elicitation source is most useful when:","opts":["No existing documentation is available","Eliciting requirements for a completely new domain with no prior systems","Extracting requirements from existing specifications, contracts, or legacy documentation","Running a workshop with many stakeholders"],"correct":[2],"exp":"Document analysis extracts requirements from existing artifacts: manuals, contracts, regulations, existing specs. Especially valuable for replacement systems. [K2]"},{"id":"GA-t4-06","type":"A","pts":1,"q":"What is the main advantage of workshop-based elicitation over individual interviews?","opts":["Workshops need no preparation","Workshops enable conflict resolution and stakeholder consensus in real time","Workshops require no facilitator","Workshops automatically produce documentation"],"correct":[1],"exp":"Workshops (JAD sessions) allow multiple stakeholders to discuss and resolve conflicts immediately, producing consensus. Interviews require separate reconciliation. [K2]"},{"id":"GA-t4-07","type":"A","pts":1,"q":"Which type of prototype is intended to be discarded after fulfilling its validation purpose?","opts":["Evolutionary prototype","Horizontal prototype","Throwaway prototype","Vertical prototype"],"correct":[2],"exp":"A throwaway (exploratory) prototype is built quickly to validate concepts, then discarded. An evolutionary prototype is refined into the final system. [K1]"},{"id":"GA-t4-08","type":"A","pts":1,"q":"Questionnaires are particularly effective when:","opts":["Detailed contextual information is needed from a few stakeholders","Requirements need group consensus","Large numbers of geographically dispersed stakeholders must be reached cost-effectively","The domain is completely unknown and exploratory"],"correct":[2],"exp":"Questionnaires scale efficiently to many respondents across locations, though they provide limited depth. [K2]"},{"id":"GA-t4-09","type":"A","pts":1,"q":"'System archaeology' in RE refers to:","opts":["Using archaeological metaphors to explain complex systems","Extracting requirements by studying and reverse-engineering legacy systems","Applying historical research methods to requirements","Documenting all requirement change history"],"correct":[1],"exp":"System archaeology reverse-engineers requirements from an existing system by studying its behavior, documentation, and code. [K1]"},{"id":"GK-t4-01","type":"K","pts":2,"q":"For each statement about elicitation techniques, indicate True or False:","stmts":["Observation techniques can reveal implicit requirements that stakeholders cannot articulate","Brainstorming requires criticism during the session to be effective","Prototyping is an interaction-based elicitation technique","Structured interviews use predefined questions while unstructured use open-ended questions"],"correct":[true,false,true,true],"exp":"A) True — reveals tacit knowledge. B) False — brainstorming suspends criticism. C) True. D) True — key distinction between interview types. [K2]"},{"id":"GK-t4-02","type":"K","pts":2,"q":"For each statement about prototyping in RE, indicate True or False:","stmts":["An evolutionary prototype becomes part of the final delivered system","A horizontal prototype covers many system features at low depth","Paper prototyping is a high-fidelity prototyping technique","Prototyping helps validate requirements through hands-on stakeholder interaction"],"correct":[true,true,false,true],"exp":"A) True. B) True — breadth over depth. C) False — paper is low-fidelity. D) True — hands-on validation is the primary benefit. [K2]"},{"id":"GK-t4-03","type":"K","pts":2,"q":"For each statement about creativity-based elicitation techniques, indicate True or False:","stmts":["The 6-3-5 method is a form of brainstorming done in writing","Mind mapping can be used to organize brainstormed ideas","The analogy technique applies solutions from similar domains to the current problem","Creativity techniques always require large groups to work"],"correct":[true,true,true,false],"exp":"A) True. B) True. C) True. D) False — some creativity techniques work with small groups or individuals. [K2]"},{"id":"GP-t4-01","type":"P","pts":1,"need":2,"q":"Which TWO of the following are artifact-based elicitation techniques?","opts":["Document analysis","Stakeholder interview","System archaeology","Brainstorming workshop"],"correct":[0,2],"exp":"Artifact-based techniques extract requirements from existing artifacts. Document analysis and system archaeology are artifact-based. Interviews and workshops are interaction-based. [K1]"},{"id":"GP-t4-02","type":"P","pts":1,"need":2,"q":"Which TWO of the following are valid reasons to use prototyping in RE?","opts":["To validate user interface requirements with stakeholders","To avoid eliciting requirements from stakeholders","To discover implicit requirements through stakeholder interaction with a working model","To create the final production-ready software"],"correct":[0,2],"exp":"Prototyping validates UI requirements and reveals implicit requirements through hands-on use. It supplements, not replaces, stakeholder elicitation. [K2]"},{"id":"GP-t4-03","type":"P","pts":1,"need":2,"q":"Which TWO of the following are interaction-based elicitation techniques?","opts":["Stakeholder interview","Document analysis","Workshop / focus group","System archaeology"],"correct":[0,2],"exp":"Interaction-based techniques involve direct engagement with people: interviews and workshops. Document analysis and system archaeology are artifact-based. [K1]"},{"id":"R6-t4-01","type":"A","pts":1,"q":"Stakeholders from two countries need the same system to follow their differing national legislation. According to IREB this is a: (1 answer)","opts":["Data conflict","Subject matter conflict","Relationship conflict","Structural conflict"],"correct":[1],"exp":"Differing factual needs (e.g. different legal environments) constitute a subject matter conflict; the underlying facts cannot simply be changed."},{"id":"R6-t4-02","type":"K","pts":2,"q":"Decide true or false about the IREB conflict types.","stmts":["IREB distinguishes six conflict types: subject matter, data, interest, value, relationship, and structural","Relationship and structural conflicts are usually directly requirements-related and best solved by the Requirements Engineer alone","A structural conflict involves imbalance of power or competition over limited resources","A data conflict can arise when parties interpret the same data differently"],"correct":[true,false,true,true],"exp":"Six types (A). Relationship and structural conflicts are often NOT requirements-related; escalation is frequently needed (B false). C and D match the handbook definitions."},{"id":"R6-t4-03","type":"A","pts":1,"q":"Two managers block each other over a requirement; deadline pressure is high and one party refuses a vote. Which resolution technique fits BEST? (1 answer)","opts":["Agreement","Overruling by a decision maker with higher authority","Ignoring the conflict","Definition of variants"],"correct":[1],"exp":"When agreement/compromise fail and voting is refused under time pressure, transferring the decision to a higher authority (overruling) is the IREB-recommended option, especially for interest/structural conflicts."},{"id":"R6-t4-04","type":"P","pts":2,"q":"Which TWO resolution techniques does IREB consider well suited for SUBJECT MATTER conflicts? (2 answers)","opts":["Compromise","Voting","Exchanging the project sponsor","Deleting both requirements","Escalating to the press"],"need":2,"correct":[0,1],"exp":"The handbook names compromise and voting (and definition of variants) as suitable for subject matter conflicts."},{"id":"R6-t4-05","type":"A","pts":1,"q":"According to the Kano model, how does the classification of a feature typically evolve over time? (1 answer)","opts":["Delighters tend to become satisfiers and eventually dissatisfiers (expected basics)","Dissatisfiers become delighters","Classifications never change","Satisfiers disappear from the market"],"correct":[0],"exp":"Yesterday's delighter (e.g. smartphone GPS) becomes expected: classifications erode toward must-be over time."},{"id":"R6-t4-06","type":"K","pts":2,"q":"Decide true or false about the Kano model categories.","stmts":["Dissatisfiers are self-evident, often unstated requirements whose absence causes dissatisfaction","Satisfiers are consciously demanded - more fulfilment yields proportionally more satisfaction","Delighters are explicitly demanded by customers in interviews","A delighter's absence causes massive dissatisfaction"],"correct":[true,true,false,false],"exp":"Dissatisfiers: unconscious/expected. Satisfiers: conscious, linear. Delighters are NOT articulated (that is what makes them delighters) and their absence causes no dissatisfaction."},{"id":"R6-t4-07","type":"A","pts":1,"q":"A completely new, innovative system without a predecessor is planned. Which elicitation technique category does IREB recommend emphasising? (1 answer)","opts":["Gathering techniques only","Design and idea-generating techniques","Document study of the old manuals","System archaeology"],"correct":[1],"exp":"With no existing system or sources to gather from, design and idea-generating (creativity, prototyping, scenarios) techniques drive elicitation."},{"id":"R6-t4-08","type":"P","pts":2,"q":"Which TWO are GATHERING elicitation techniques in the IREB sense? (2 answers)","opts":["Structured interview","Document study (analysing existing specifications, laws, manuals)","Brainstorming","Design thinking","Storyboarding a future product"],"need":2,"correct":[0,1],"exp":"Interviews and document study gather existing knowledge. Brainstorming, design thinking and storyboards generate new ideas."},{"id":"R6-t4-09","type":"A","pts":1,"q":"Requirements were documented and reviewed for wording, but the affected business department never confirmed them. Which validation aspect is missing? (1 answer)","opts":["Content","Documentation","Agreement","Traceability"],"correct":[2],"exp":"The three validation aspects are content, documentation and agreement. Stakeholder confirmation/sign-off is the agreement aspect."},{"id":"R6-t4-10","type":"K","pts":2,"q":"Decide true or false about principles of good requirements validation.","stmts":["The right stakeholders must be involved in validation","Separating defect detection from defect correction is good practice","Validation should happen exactly once, at the end of RE","Repeated validation can be necessary when requirements or context change"],"correct":[true,true,false,true],"exp":"Involve the right people, separate finding from fixing, and validate repeatedly as things evolve. One-shot end-of-phase validation contradicts FL3 guidance."},{"id":"R6-t4-11","type":"A","pts":1,"q":"What chiefly distinguishes an INSPECTION from a WALKTHROUGH as validation techniques? (1 answer)","opts":["Inspections follow a defined formal process with roles and recorded findings; walkthroughs are informal author-led sessions","Walkthroughs require certified moderators; inspections do not","Inspections are only for source code","There is no difference"],"correct":[0],"exp":"Formality is the axis: inspection = formal roles/entry-exit criteria/metrics; walkthrough = lightweight, author-guided."},{"id":"R6-t4-12","type":"P","pts":2,"q":"Which TWO statements about using prototypes for validation are correct? (2 answers)","opts":["Stakeholders can experience proposed requirements instead of reading them","Prototypes can uncover implicit requirements that interviews missed","A prototype always becomes the production system","Prototyping is the cheapest possible technique in every situation","Prototypes make reviews of quality requirements unnecessary"],"need":2,"correct":[0,1],"exp":"Hands-on interaction validates and elicits implicit needs. Throwaway prototypes exist; prototyping costs effort and complements, not replaces, reviews."},{"id":"R6-t4-13","type":"A","pts":1,"q":"For which conflict type does IREB note that AGREEMENT (full mutual understanding) is the common resolution path? (1 answer)","opts":["Data conflict","Structural conflict","Relationship conflict","Value conflict"],"correct":[0],"exp":"Data conflicts stem from inconsistent data or interpretations - persistent communication toward agreement is the typical cure."},{"id":"R6-t4-14","type":"K","pts":2,"q":"Decide true or false about requirement sources.","stmts":["Stakeholders, documents, and existing systems are the three main kinds of requirement sources","Laws and standards can be requirement sources even though they are not people","A predecessor system cannot serve as a requirement source","Ignoring a requirement source risks an incomplete requirements set"],"correct":[true,true,false,true],"exp":"IREB names stakeholders, documents and (existing) systems as source kinds; predecessors are valuable sources; missed sources mean missed requirements."},{"id":"R6-t4-15","type":"A","pts":1,"q":"Warehouse workers cannot explain their picking process, but perform it expertly. Which elicitation approach fits BEST? (1 answer)","opts":["Questionnaire with closed questions","Field observation / apprenticing with the workers","Studying the org chart","A press release analysis"],"correct":[1],"exp":"Tacit, embodied knowledge is best elicited by observation techniques (field observation, apprenticing), not by asking for verbal accounts."}],"t5":[{"id":"P3504","official":true,"type":"P","pts":2,"need":2,"q":"Two major facets most important when configuring an RE process? (2 answers)","opts":["The time facet: linear vs. iterative","The budget facet: tight vs. large","The purpose facet: prescriptive vs. explorative","The methodology facet: structure-based vs. process-based","The interaction facet: team-driven vs. individual-driven"],"correct":[0,2],"exp":"The FL3 process facets are time (linear/iterative) and purpose (prescriptive/explorative), plus a target/market facet. Budget, methodology and interaction as listed are not the defining process facets."},{"id":"A3505","official":true,"type":"A","pts":1,"q":"Which combination of process facets is NOT a recognised typical pattern? (1 answer)","opts":["Product-oriented RE process (iterative, explorative, market oriented)","Human-oriented RE process (linear, process-based, individual)","Participatory RE process (iterative, explorative, customer specific)","Contractual RE process (linear, prescriptive, customer specific)"],"correct":[1],"exp":"Product-oriented, participatory, and contractual are recognised typical facet combinations. 'Human-oriented' is not a standard FL3 pattern."},{"id":"G5-01","type":"A","pts":1,"q":"The 'time' facet of an RE process distinguishes between: (1 answer)","opts":["Linear and iterative approaches","Cheap and expensive approaches","Manual and automated approaches","Local and remote teams"],"correct":[0],"exp":"The time facet contrasts linear vs. iterative requirement development."},{"id":"G5-02","type":"A","pts":1,"q":"The 'purpose' facet distinguishes between: (1 answer)","opts":["Prescriptive and explorative approaches","Big and small teams","Agile and waterfall only","Internal and external stakeholders"],"correct":[0],"exp":"The purpose facet contrasts prescriptive (known requirements) vs. explorative (requirements discovered over time)."},{"id":"G5-03","type":"K","pts":2,"q":"Decide true/false about RE process configuration.","stmts":["Influencing factors should be analysed before configuring the process.","One process fits all projects equally well.","Context determines suitable facet combinations.","An explorative purpose suits highly uncertain requirements."],"correct":[true,false,true,true],"exp":"There is no one-size-fits-all RE process; configuration depends on context/influencing factors."},{"id":"G5-04","type":"A","pts":1,"q":"A contractual RE process is typically: (1 answer)","opts":["Linear, prescriptive, customer specific","Iterative, explorative, market oriented","Agile and undocumented","Free of any specification"],"correct":[0],"exp":"Contractual settings need upfront, prescriptive, customer-specific specifications — typically linear."},{"id":"G5-05","type":"P","pts":2,"need":2,"q":"Which two influencing factors affect RE process choice? (2 answers)","opts":["Degree of requirements uncertainty","Contractual/regulatory context","Office wall colour","Programming language popularity","Lunch schedule"],"correct":[0,1],"exp":"Uncertainty and contractual/regulatory context are genuine influencing factors."},{"id":"G5-06","type":"A","pts":1,"q":"In an explorative, iterative process, requirements are best: (1 answer)","opts":["Refined progressively as understanding grows","Frozen completely before any work","Never documented","Decided solely by the RE alone"],"correct":[0],"exp":"Explorative/iterative processes refine requirements over successive iterations."},{"id":"G5-07","type":"K","pts":2,"q":"Decide true/false about iterative RE.","stmts":["Feedback from each iteration informs the next.","Iterative RE forbids any early documentation.","Iterative RE suits volatile or unclear requirements.","Linear RE is always superior to iterative RE."],"correct":[true,false,true,false],"exp":"Iterative RE uses feedback and suits volatility; it neither forbids documentation nor is linear always superior."},{"id":"G5-08","type":"A","pts":1,"q":"A product-oriented RE process is typically described as: (1 answer)","opts":["Iterative, explorative, market oriented","Linear, prescriptive, customer specific","Always individual-driven","Documentation-free"],"correct":[0],"exp":"Product-oriented RE (e.g. for market products) is iterative, explorative, and market oriented."},{"id":"G5-09","type":"A","pts":1,"q":"Why configure the RE process per project rather than reuse a fixed one? (1 answer)","opts":["Because project context (uncertainty, contract, criticality) varies.","Because tools demand it.","Because stakeholders dislike consistency.","Because configuration is mandatory by law."],"correct":[0],"exp":"Context variation across projects drives tailored process configuration."},{"id":"G5-10","type":"P","pts":2,"need":2,"q":"Which two are valid RE process facet dimensions in FL3? (2 answers)","opts":["Time (linear/iterative)","Purpose (prescriptive/explorative)","Salary (high/low)","Weather (sunny/rainy)","Font (serif/sans)"],"correct":[0,1],"exp":"Time and purpose are valid facet dimensions; the others are nonsense distractors."},{"id":"G5-11","type":"A","pts":1,"q":"A participatory RE process is typically characterised as: (1 answer)","opts":["Iterative, explorative, customer specific","Linear, prescriptive, market oriented","Documentation-free and ad hoc","Individual-only with no stakeholders"],"correct":[0],"exp":"Participatory processes are iterative, explorative, and customer specific."},{"id":"G5-12","type":"K","pts":2,"q":"Decide true/false about process facets.","stmts":["A prescriptive purpose suits well-understood, stable requirements.","An explorative purpose suits uncertain requirements.","Linear time means requirements are developed in fixed sequential phases.","Iterative time forbids revisiting earlier requirements."],"correct":[true,true,true,false],"exp":"Iterative time explicitly allows revisiting requirements — so D is false; the rest are correct."},{"id":"G5-13","type":"A","pts":1,"q":"Which factor would push an RE process toward 'explorative'? (1 answer)","opts":["High requirement uncertainty / novelty","A fixed legal contract specifying everything","A fully known, stable domain","Zero stakeholder involvement"],"correct":[0],"exp":"Novelty and uncertainty favour exploration; fixed/stable contexts favour prescriptive."},{"id":"G5-14","type":"P","pts":2,"need":2,"q":"Which two outcomes result from correctly configuring an RE process? (2 answers)","opts":["Better fit to project context.","More appropriate balance of upfront vs. iterative effort.","Guaranteed zero defects.","Elimination of all stakeholders.","No need for documentation ever."],"correct":[0,1],"exp":"Configuration improves contextual fit and effort balance; it does not guarantee zero defects or remove stakeholders/docs."},{"id":"G5-15","type":"A","pts":1,"q":"In FL3, why is there no single 'best' RE process? (1 answer)","opts":["Because the optimal process depends on context and influencing factors.","Because all processes are identical.","Because processes are irrelevant.","Because tools decide everything."],"correct":[0],"exp":"Process suitability is context-dependent; configuration tailors it to influencing factors."},{"id":"G5-16","type":"K","pts":2,"q":"Decide true/false about combining facets.","stmts":["Certain facet combinations recur as typical patterns in practice.","Any random combination is equally effective.","Contractual settings often pair linear time with prescriptive purpose.","Market-product settings often pair iterative time with explorative purpose."],"correct":[true,false,true,true],"exp":"Typical patterns recur; not all combinations are equally effective. Contractual=linear/prescriptive, product=iterative/explorative are typical."},{"id":"N5-01","type":"A","pts":1,"q":"Which RE process configuration is typically used for a bespoke, safety-critical system developed under a fixed-price contract? (1 answer)","opts":["Contractual RE process (linear, prescriptive, customer-specific).","Product-oriented RE process (iterative, explorative, market-oriented).","Participatory RE process (iterative, explorative, customer-specific).","Human-oriented RE process."],"correct":[0],"exp":"Contractual RE is linear (defined upfront), prescriptive (strict requirements baseline), and customer-specific. This matches fixed-price, safety-critical bespoke contracts."},{"id":"N5-02","type":"K","pts":2,"q":"Decide true or false about the purpose facet of RE process configuration.","stmts":["A prescriptive RE process aims to define requirements in full before implementation begins.","An explorative RE process suits domains where requirements cannot be fully known upfront.","A prescriptive process is always better than an explorative one.","Agile projects typically use an explorative RE process."],"correct":[true,true,false,true],"exp":"A and B correctly describe prescriptive vs explorative. C False — suitability depends on project context. D True — agile's iterative nature is aligned with explorative RE."},{"id":"N5-03","type":"P","pts":2,"need":2,"q":"Which two influencing factors most affect the choice between a linear and an iterative RE process? (2 answers)","opts":["Stability and clarity of requirements at project start.","The font used in the requirements document.","The degree of customer involvement available throughout the project.","The number of meeting rooms available.","The team's favourite IDE."],"correct":[0,2],"exp":"Requirements stability (known upfront → linear; unclear → iterative) and customer availability (continuous involvement enables iteration) are the primary influencing factors."},{"id":"N5-04","type":"A","pts":1,"q":"A startup building a new consumer app with no clear market product-fit uses which RE process archetype? (1 answer)","opts":["Product-oriented RE (iterative, explorative, market-oriented).","Contractual RE (linear, prescriptive, customer-specific).","Participatory RE (iterative, explorative, customer-specific).","Human-oriented RE."],"correct":[0],"exp":"Product-oriented RE suits market-driven, explorative contexts where the 'right' product is discovered through iteration rather than specified upfront."},{"id":"N5-05","type":"K","pts":2,"q":"Decide true or false about RE process facets.","stmts":["The three main process facets are: time (linear/iterative), purpose (prescriptive/explorative), and interaction (customer-specific/market-oriented).","A single project may combine facets from different ends of the spectrum.","Process facets are fixed by regulation and cannot be adapted to project context.","Identifying influencing factors (e.g. domain stability, contract type) helps select appropriate facets."],"correct":[true,true,false,true],"exp":"A True — the three facets per IREB FL3. B True — hybrid configurations exist. C False — facets are chosen based on context. D True — factor analysis drives configuration."},{"id":"N5-06","type":"A","pts":1,"q":"In an iterative RE process, requirements elicited in early iterations are BEST described as: (1 answer)","opts":["Provisional and subject to refinement in subsequent iterations.","Final and immutable once documented.","Irrelevant until the last iteration.","Only relevant to the project manager."],"correct":[0],"exp":"Iterative RE acknowledges that early requirements are incomplete or approximate; they are refined as understanding deepens through feedback loops."},{"id":"N5-07","type":"P","pts":2,"need":2,"q":"Which two statements correctly describe a 'participatory RE process'? (2 answers)","opts":["It involves intensive collaboration with end users throughout development.","It is iterative and explorative.","Requirements are fully defined before any user involvement.","It is used when the customer population is broad and diverse.","It forbids the use of prototypes."],"correct":[0,1],"exp":"Participatory RE is defined as iterative, explorative, and customer-specific with high user involvement. C and E contradict this; D describes product-oriented RE."},{"id":"N5-08","type":"A","pts":1,"q":"Which influencing factor would push an RE process TOWARDS a prescriptive (rather than explorative) configuration? (1 answer)","opts":["A legally binding contract with precisely defined deliverables.","A novel domain where requirements are largely unknown.","Frequent stakeholder feedback is available.","The project is developing an entirely new product category."],"correct":[0],"exp":"A fixed-contract with defined deliverables demands prescriptive (upfront, defined) requirements. Novel domains, frequent feedback, and new product categories all favour explorative approaches."},{"id":"N5-09","type":"K","pts":2,"q":"Decide true or false about RE in agile projects.","stmts":["In agile projects, RE activities occur throughout the project, not only at the start.","User stories are one common way to document requirements in agile projects.","Agile projects eliminate the need for any RE artefacts.","The product backlog is a form of requirements repository in agile development."],"correct":[true,true,false,true],"exp":"A and B are correct. C False — RE artefacts (backlog, user stories, acceptance criteria) are central to agile. D True — the product backlog holds and prioritises requirements."},{"id":"N5-10","type":"A","pts":1,"q":"Which statement correctly distinguishes 'market-oriented' from 'customer-specific' RE? (1 answer)","opts":["Market-oriented RE targets a broad user population; customer-specific RE targets a defined commissioning customer.","Market-oriented RE is always linear; customer-specific is always iterative.","Customer-specific RE never involves elicitation.","Market-oriented RE produces no requirements documents."],"correct":[0],"exp":"Market-oriented RE (e.g. shrink-wrap software) targets broad markets; customer-specific RE (e.g. bespoke systems) targets one or few defined customers. The distinction is about who drives the requirements, not about the time or purpose facet."},{"id":"GA-t5-01","type":"A","pts":1,"q":"In the IREB framework, the 'problem space' refers to:","opts":["The set of all known software bugs","The domain of stakeholder needs and problems that the system mu
