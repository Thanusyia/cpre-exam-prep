mbiguity, supports automated analysis. Disadvantages: keeping multiple models consistent is hard; models focus primarily on functional requirements; not everything expressible in a model. Models should always be accompanied by natural language.<\/p>"},{"id":"t3-recap-2","expand_id":"exp-t3-2","title":"Phrase Templates (ISO 29148 & EARS)","body":"<b>ISO 29148:<\/b> [Condition] Subject shall Action [Restriction]. <b>EARS:<\/b> WHEN/WHILE/WHERE/IF-THEN variants for event-driven, state-driven, optional. <b>User story:<\/b> As a &lt;role&gt; I want &lt;req&gt; so that &lt;benefit&gt;.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 163.9\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"163.9\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Phrase Templates — Structured Natural Language<\/text><rect x=\"8\" y=\"26\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"40.7\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">&lt;SUBJECT&gt; shall &lt;PREDICATE&gt;<\/text><text x=\"490\" y=\"40.7\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">→ Core capability/function<\/text><rect x=\"8\" y=\"56\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"70.7\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">&lt;SUBJECT&gt; shall be able to &lt;ACTIVITY&gt;<\/text><text x=\"490\" y=\"70.7\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">→ User-facing feature<\/text><rect x=\"8\" y=\"86\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"100.7\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">&lt;SUBJECT&gt; shall NOT &lt;PREDICATE&gt;<\/text><text x=\"490\" y=\"100.7\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">→ Prohibition/constraint<\/text><rect x=\"8\" y=\"116\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"130.7\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">IF &lt;COND&gt; THEN &lt;SUBJECT&gt; shall &lt;PRED&gt;<\/text><text x=\"490\" y=\"130.7\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">→ Conditional req<\/text><text x=\"250\" y=\"157.9\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Templates reduce ambiguity by enforcing subject/predicate structure<\/text><\/svg><\/div><p><b>ISO 29148 template:<\/b> [&lt;Condition&gt;] &lt;Subject&gt; shall &lt;Action&gt; &lt;Objects&gt; [&lt;Restriction&gt;]<\/p><p>Auxiliary verb conventions: <b>shall<\/b> = mandatory; <b>should<\/b> = desired but not mandatory; <b>may<\/b> = suggestion; <b>will<\/b> = factual statement (not a requirement).<\/p><p><b>EARS templates (Mavin et al.):<\/b><\/p><ul><li>Ubiquitous: &ldquo;The &lt;system&gt; shall &lt;response&gt;&rdquo;<\/li><li>Event-driven: &ldquo;WHEN &lt;trigger&gt; the &lt;system&gt; shall &lt;response&gt;&rdquo;<\/li><li>Unwanted behavior: &ldquo;IF &lt;trigger&gt;, THEN the &lt;system&gt; shall &lt;response&gt;&rdquo;<\/li><li>State-driven: &ldquo;WHILE &lt;state&gt; the &lt;system&gt; shall &lt;response&gt;&rdquo;<\/li><li>Optional features: &ldquo;WHERE &lt;feature included&gt; the &lt;system&gt; shall &lt;response&gt;&rdquo;<\/li><\/ul><p><b>User story (Cohn):<\/b> As a &lt;role&gt; I want &lt;requirement&gt; so that &lt;benefit&gt;. The benefit part is now standard practice. Every user story should be accompanied by acceptance criteria.<\/p><p><b>Benefits of templates:<\/b> Provide structure, prompt for complete information, low learning effort. <b>Limitations:<\/b> Do NOT guarantee completeness, do not improve content quality inherently, are not mandatory.<\/p>"},{"id":"t3-recap-3","expand_id":"exp-t3-3","title":"Form Templates","body":"<b>Use cases<\/b> (Cockburn): Name / Precondition / Success end condition / Primary actor / Trigger / Normal flow / Alternate flows. <b>Quality requirements<\/b> (Gilb): Goal / Scale / Meter / Min / OK / Desired.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"165\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Form Template — Structured Requirement Record<\/text><rect x=\"8\" y=\"22\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"40\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">ID:<\/text><text x=\"100\" y=\"40\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">REQ-042<\/text><rect x=\"256\" y=\"22\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"40\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Description:<\/text><text x=\"365\" y=\"40\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">The system shall...<\/text><rect x=\"8\" y=\"56\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"74\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Source:<\/text><text x=\"100\" y=\"74\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Stakeholder: J. Smith<\/text><rect x=\"256\" y=\"56\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"74\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Priority:<\/text><text x=\"365\" y=\"74\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">HIGH<\/text><rect x=\"8\" y=\"90\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"108\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Status:<\/text><text x=\"100\" y=\"108\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Approved<\/text><rect x=\"256\" y=\"90\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"108\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"7.5\" font-weight=\"700\" font-family=\"sans-serif\">Acceptance Criteria:<\/text><text x=\"365\" y=\"108\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Test case TC-17<\/text><rect x=\"8\" y=\"124\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"142\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Dependencies:<\/text><text x=\"100\" y=\"142\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">REQ-010, REQ-011<\/text><rect x=\"256\" y=\"124\" width=\"240\" height=\"28\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"142\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Change History:<\/text><text x=\"365\" y=\"142\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">v1.0 → v1.2<\/text><text x=\"250\" y=\"162\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Form templates ensure every requirement has traceability and acceptance criteria<\/text><\/svg><\/div><p><b>Use case form template fields (Table 3.2):<\/b> Name (active verb phrase), Precondition, Success end condition, Failed end condition, Primary actor, Other actors, Trigger, Normal flow (steps), Alternate flows, Extensions, Related information.<\/p><p><b>Measurable quality requirement template (Table 3.3):<\/b> ID, Goal (qualitative statement), Scale (how to measure), Meter (measurement procedure), Minimum (lowest acceptable), OK range, Desired (best case).<\/p><p><b>Worked example &mdash; reservation system response time:<\/b> Goal: &ldquo;Confirm room reservations immediately&rdquo;. Scale: Elapsed time in seconds. Meter: Timestamp from Reserve button click to confirmation display. Minimum: &lt;5s in 95% of cases. OK: 0.5&ndash;3s in &gt;98% of cases. Desired: &lt;0.5s in 100% of cases.<\/p>"},{"id":"t3-recap-4","expand_id":"exp-t3-4","title":"Modeling Aspects & UML Quick Map","body":"<b>Structure/data<\/b>: class, ER. <b>Function/flow<\/b>: activity, BPMN, use case. <b>State/behavior<\/b>: state machine, statechart. Context models show system boundary + actors.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 215\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"215\" fill=\"#161b22\" rx=\"8\"/><circle cx=\"250\" cy=\"110\" r=\"42\" fill=\"#21262d\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"250\" y=\"107\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" font-family=\"sans-serif\">RE<\/text><text x=\"250\" y=\"122\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Model<\/text><rect x=\"180\" y=\"0\" width=\"140\" height=\"40\" rx=\"5\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"250\" y=\"16\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">FUNCTIONAL<\/text><text x=\"250\" y=\"32\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Use Cases · Activity Diagrams<\/text><line x1=\"250.0\" y1=\"66.0\" x2=\"250.0\" y2=\"74.0\" stroke=\"#3fb95066\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><rect x=\"360\" y=\"82\" width=\"140\" height=\"40\" rx=\"5\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"430\" y=\"98\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">BEHAVIORAL<\/text><text x=\"430\" y=\"109\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">State Machines ·<\/text><text x=\"430\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Sequence Diagrams<\/text><line x1=\"293.93225554103816\" y1=\"107.55931913660899\" x2=\"374.0862202204969\" y2=\"103.10632109886129\" stroke=\"#79c0ff66\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><rect x=\"290\" y=\"174\" width=\"140\" height=\"40\" rx=\"5\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"360\" y=\"190\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">STRUCTURAL<\/text><text x=\"360\" y=\"206\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Class Diagrams · ER Diagrams<\/text><line x1=\"285.27681800634497\" y1=\"136.2972643320026\" x2=\"315.1022316282882\" y2=\"158.53075448654215\" stroke=\"#ffa65766\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><rect x=\"70\" y=\"174\" width=\"140\" height=\"40\" rx=\"5\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"140\" y=\"190\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">INTERFACE<\/text><text x=\"140\" y=\"206\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Context Diagrams · Protocols<\/text><line x1=\"214.72318199365503\" y1=\"136.2972643320026\" x2=\"184.89776837171178\" y2=\"158.53075448654215\" stroke=\"#56d36466\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><rect x=\"0\" y=\"82\" width=\"140\" height=\"40\" rx=\"5\" fill=\"#d2a8ff18\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"70\" y=\"98\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">CONSTRAINT<\/text><text x=\"70\" y=\"114\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Rules · OCL · Tables<\/text><line x1=\"206.06774445896184\" y1=\"107.55931913660899\" x2=\"125.91377977950309\" y2=\"103.10632109886129\" stroke=\"#d2a8ff66\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><\/svg><\/div><p><b>Three major modeling aspects (functional requirements):<\/b><\/p><ul><li><b>Structure and data<\/b> &mdash; static structure, persistent data. Models: class diagram, ER diagram, object model.<\/li><li><b>Function and flow<\/b> &mdash; transformation of inputs to outputs, sequence of actions, control/data flow. Models: activity diagram, BPMN, use case diagram (from actor perspective), DFD.<\/li><li><b>State and behavior<\/b> &mdash; state-dependent reactions to events, life cycle of objects. Models: state machine diagram, statechart.<\/li><\/ul><p><b>Critical exam distinctions:<\/b><\/p><ul><li>Class diagrams contain: classes, attributes, associations, multiplicities. <b>NOT states.<\/b><\/li><li>State machine diagrams = states + transitions triggered by events. NOT used for showing data structure.<\/li><li>Use case diagrams show: actors, system boundary, use cases (functions). <b>NOT internal process steps.<\/b><\/li><li>Activity diagrams / BPMN show: sequential/parallel steps, control flow, forks/joins. Best for &ldquo;enrollment steps&rdquo;, &ldquo;process documentation&rdquo; scenarios.<\/li><\/ul><p><b>Glossary:<\/b> Statechart = state machine with hierarchical/orthogonal decomposition (superset of state machine). State-transition diagram = synonym for state machine diagram.<\/p><p><b>Context model:<\/b> Shows the system in its context &mdash; external actors and interfaces at system boundary. Alexander&apos;s onion model relates to stakeholder layers, not the context model itself.<\/p><p><b>Descriptive vs prescriptive modeling:<\/b> Descriptive = models existing reality (as-is). Prescriptive = models future reality to be created (to-be).<\/p>"},{"id":"t3-recap-5","expand_id":"exp-t3-5","title":"Quality Criteria for Single Requirements","body":"<b>Adequate<\/b> &middot; <b>Necessary<\/b> &middot; <b>Unambiguous<\/b> &middot; <b>Complete<\/b> (self-contained) &middot; <b>Understandable<\/b> &middot; <b>Verifiable<\/b>. Adequate and Understandable are most important.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 205\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"200\" fill=\"#161b22\" rx=\"8\"/><rect x=\"8\" y=\"5\" width=\"235\" height=\"188\" rx=\"6\" fill=\"#3fb95012\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"125\" y=\"22\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">SINGLE REQUIREMENT<\/text><text x=\"24\" y=\"46\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"46\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Unambiguous<\/text><text x=\"24\" y=\"66\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"66\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Verifiable<\/text><text x=\"24\" y=\"86\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"86\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Understandable<\/text><text x=\"24\" y=\"106\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"106\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Consistent<\/text><text x=\"24\" y=\"126\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"126\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Correct<\/text><text x=\"24\" y=\"146\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"146\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Traceable<\/text><text x=\"24\" y=\"166\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"36\" y=\"166\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Atomic<\/text><rect x=\"257\" y=\"5\" width=\"235\" height=\"188\" rx=\"6\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"375\" y=\"22\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">SPECIFICATION (SET)<\/text><text x=\"273\" y=\"46\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"46\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Complete<\/text><text x=\"273\" y=\"66\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"66\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Consistent<\/text><text x=\"273\" y=\"86\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"86\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Non-redundant<\/text><text x=\"273\" y=\"106\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"106\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Unambiguous<\/text><text x=\"273\" y=\"126\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"126\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Traceable<\/text><text x=\"273\" y=\"146\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"146\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Prioritised<\/text><text x=\"273\" y=\"166\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"285\" y=\"166\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"10\" font-weight=\"normal\" font-family=\"sans-serif\">Verifiable<\/text><text x=\"250\" y=\"198\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Completeness & non-redundancy apply to the SET, not individual requirements<\/text><\/svg><\/div><p><b>Adequate<\/b> (preferred over &ldquo;correct&rdquo;) &mdash; the requirement expresses stakeholders&apos; true and agreed desires/needs. There is no formal procedure for validating correctness against desires in minds, so &ldquo;adequate&rdquo; is more precise.<\/p><p><b>Necessary<\/b> &mdash; part of relevant system scope; contributes to at least one stakeholder goal.<\/p><p><b>Unambiguous<\/b> &mdash; everyone involved interprets it the same way.<\/p><p><b>Complete<\/b> (per single requirement) &mdash; self-contained; no parts necessary for understanding are missing.<\/p><p><b>Understandable<\/b> &mdash; comprehensible to target audience.<\/p><p><b>Verifiable<\/b> &mdash; fulfillment by implemented system can be checked indisputably.<\/p><p><b>Adequate and understandable are the most important.<\/b> Without them, a requirement is useless or even detrimental regardless of other criteria. Verifiability matters most in formal acceptance contexts.<\/p>"},{"id":"t3-recap-6","expand_id":"exp-t3-6","title":"Quality Criteria for Work Products","body":"<b>Consistent<\/b> (no contradictions) &middot; <b>Non-redundant<\/b> (each req once) &middot; <b>Complete<\/b> (all known relevant reqs) &middot; <b>Modifiable<\/b> &middot; <b>Traceable<\/b> &middot; <b>Conformant<\/b> (to format/standards).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"190\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Quality Criteria for Requirements Work Products<\/text><rect x=\"8\" y=\"28\" width=\"238\" height=\"44\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"18\" y=\"45\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Complete<\/text><text x=\"18\" y=\"61\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">All system behaviour described; no TBDs<\/text><rect x=\"254\" y=\"28\" width=\"238\" height=\"44\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"264\" y=\"45\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Consistent<\/text><text x=\"264\" y=\"61\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">No contradictions between requirements<\/text><rect x=\"8\" y=\"80\" width=\"238\" height=\"44\" rx=\"4\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"18\" y=\"97\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Non-redundant<\/text><text x=\"18\" y=\"113\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Each requirement stated exactly once<\/text><rect x=\"254\" y=\"80\" width=\"238\" height=\"44\" rx=\"4\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1\"/><text x=\"264\" y=\"97\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Traceable<\/text><text x=\"264\" y=\"113\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Each req linked to source and test<\/text><rect x=\"8\" y=\"132\" width=\"238\" height=\"44\" rx=\"4\" fill=\"#d2a8ff15\" stroke=\"#d2a8ff\" stroke-width=\"1\"/><text x=\"18\" y=\"149\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Modifiable<\/text><text x=\"18\" y=\"165\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Easy to change without inconsistency<\/text><rect x=\"254\" y=\"132\" width=\"238\" height=\"44\" rx=\"4\" fill=\"#ff7b7215\" stroke=\"#ff7b72\" stroke-width=\"1\"/><text x=\"264\" y=\"149\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Unambiguous<\/text><text x=\"264\" y=\"165\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">One interpretation only<\/text><\/svg><\/div><p><b>Consistent<\/b> &mdash; no two requirements in the work product (or across work products) contradict each other.<\/p><p><b>Non-redundant<\/b> &mdash; each requirement documented only once, no overlap.<\/p><p><b>Complete<\/b> (per work product) &mdash; contains all known requirements (functional, quality, constraints) relevant in its scope.<\/p><p><b>Modifiable<\/b> &mdash; structured so it can be modified without degrading quality.<\/p><p><b>Traceable<\/b> &mdash; requirements can be traced back to origins, forward to implementation/test, and to related requirements.<\/p><p><b>Conformant<\/b> &mdash; adheres to mandatory structuring/formatting instructions. <b>NOT the same as completeness.<\/b><\/p><p><b>Exam trap:<\/b> &ldquo;A specification is conformant if it contains all relevant requirements&rdquo; &rarr; FALSE. That describes completeness. Conformance = adherence to agreed format/standards.<\/p>"},{"id":"t3-recap-7","expand_id":"exp-t3-7","title":"Prototypes in RE","body":"<b>Exploratory<\/b> (throwaway, clarify/validate reqs) &middot; <b>Experimental<\/b> (NOT used in RE, technical feasibility) &middot; <b>Evolutionary<\/b> (pilot system, grows into final). Fidelity: wireframe &lt; mock-up &lt; native.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 162\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"160\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"15\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Prototypes — Making Requirements Tangible<\/text><rect x=\"10\" y=\"22\" width=\"115\" height=\"124\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"67\" y=\"40\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Mockup<\/text><text x=\"67\" y=\"54\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">(Paper/UI)<\/text><text x=\"67\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Low effort<\/text><text x=\"67\" y=\"90\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Fast feedback<\/text><text x=\"67\" y=\"108\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Throw-away<\/text><rect x=\"132\" y=\"22\" width=\"115\" height=\"124\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"189\" y=\"40\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Clickable<\/text><text x=\"189\" y=\"54\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Prototype<\/text><text x=\"189\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Medium fidelity<\/text><text x=\"189\" y=\"90\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">User testing<\/text><text x=\"189\" y=\"108\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Throw-away<\/text><rect x=\"254\" y=\"22\" width=\"115\" height=\"124\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"311\" y=\"40\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Pilot System<\/text><text x=\"311\" y=\"54\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">(Vertical)<\/text><text x=\"311\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">High effort<\/text><text x=\"311\" y=\"90\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Real data<\/text><text x=\"311\" y=\"108\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">May evolve<\/text><rect x=\"376\" y=\"22\" width=\"115\" height=\"124\" rx=\"6\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"433\" y=\"40\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">Storyboard<\/text><text x=\"433\" y=\"54\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">/ Animation<\/text><text x=\"433\" y=\"72\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Linear flow<\/text><text x=\"433\" y=\"90\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Concept test<\/text><text x=\"433\" y=\"108\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Throw-away<\/text><text x=\"250\" y=\"157\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Prototypes validate understanding — they are NOT the requirements themselves<\/text><\/svg><\/div><p><b>Exploratory prototype:<\/b> Used in RE. Throwaway &mdash; discarded after use. Purpose: create shared understanding, clarify requirements, validate requirements. Also used for specification by example.<\/p><p><b>Experimental prototype (breadboard):<\/b> NOT used in RE. Purpose: explore technical design feasibility.<\/p><p><b>Evolutionary prototype:<\/b> Pilot system that forms the core of the final system. Agile development uses evolutionary prototyping.<\/p><p><b>Fidelity levels:<\/b><\/p><ul><li><b>Wireframe<\/b> (low fidelity) &mdash; paper or simple sketch. Quick to build and modify. Doesn&apos;t look polished.<\/li><li><b>Mock-up<\/b> (medium fidelity) &mdash; real screens, click flows, no real functionality. Validates UI. Built with prototyping tools.<\/li><li><b>Native prototype<\/b> (high fidelity) &mdash; implements critical parts; stakeholders can use it to check real behavior.<\/li><\/ul><p>RE primarily uses exploratory prototypes for elicitation and validation. The cost-value tradeoff: expensive to build, but reduces risk of wrong requirements.<\/p>"},{"id":"t3-recap-8","expand_id":"exp-t3-8","title":"Glossary Best Practices","body":"A good glossary defines all domain terms, abbreviations, acronyms. Synonyms = marked as such. Homonyms = avoided or marked. Mandatory to use, centrally maintained, stakeholder-agreed.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 162\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"160\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"37.0\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Glossary — Foundation of Shared Understanding<\/text><rect x=\"8\" y=\"24\" width=\"484\" height=\"110\" rx=\"6\" fill=\"#3fb95010\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"16\" y=\"64.0\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Term<\/text><text x=\"130\" y=\"64.0\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Definition<\/text><text x=\"330\" y=\"64.0\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Synonyms (banned)<\/text><line x1=\"8\" y1=\"48\" x2=\"492\" y2=\"48\" stroke=\"#30363d\" stroke-width=\"1\"/><rect x=\"8\" y=\"55\" width=\"484\" height=\"20\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"91.0\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Customer<\/text><text x=\"130\" y=\"91.0\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">The person who pays for the system<\/text><text x=\"330\" y=\"91.0\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Client, buyer → use Customer<\/text><text x=\"16\" y=\"115.0\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">User<\/text><text x=\"130\" y=\"115.0\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">The person who operates the system<\/text><text x=\"330\" y=\"115.0\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">End-user, operator → use User<\/text><rect x=\"8\" y=\"103\" width=\"484\" height=\"20\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"139.0\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Shall<\/text><text x=\"130\" y=\"139.0\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Mandatory requirement<\/text><text x=\"330\" y=\"139.0\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Must, will, should → use Shall<\/text><text x=\"250\" y=\"152\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">One term = one definition. Ban synonyms. Use consistently throughout all artefacts.<\/text><\/svg><\/div><p>Glossaries are a core means of establishing shared understanding (Principle 3). Key rules:<\/p><ul><li><b>Creation/maintenance:<\/b> Centrally managed, one person/small group responsible, stakeholders involved in defining terms.<\/li><li><b>Usage:<\/b> Mandatory. Work products checked for proper glossary usage. Everyone must have read access.<\/li><li>For organisations with multiple related systems: create an enterprise-level glossary for consistent terminology across projects.<\/li><\/ul><p><b>Glossary (Glinz definition):<\/b> A collection of definitions of terms relevant in some domain. Also contains cross-references, synonyms, homonyms, acronyms, abbreviations.<\/p><p><b>Synonym<\/b> = different terms denoting the same thing (mark as synonyms, don&apos;t treat as different concepts). <b>Homonym<\/b> = identical terms with different meanings (avoid or mark explicitly).<\/p>"}]},"t4":{"cards":[{"id":"t4-recap-0","expand_id":"exp-t4-0","title":"3 Sources of Requirements","body":"<b>Stakeholders<\/b> (main source) &middot; <b>Documents<\/b> (internal/external) &middot; <b>Other systems<\/b> (similar/interfacing). Source identification is iterative &mdash; not a one-time activity.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 162\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"160\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st40_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st40_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st40_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st40_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><rect x=\"158\" y=\"100\" width=\"184\" height=\"50\" rx=\"6\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"250\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirements<\/text><text x=\"250\" y=\"138\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Elicitation<\/text><circle cx=\"70\" cy=\"55\" r=\"40\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"70\" y=\"51\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">STAKEHOLDERS<\/text><text x=\"70\" y=\"65\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Interviews, surveys,<\/text><text x=\"70\" y=\"77\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">observation, workshops<\/text><line x1=\"109.64205096737274\" y1=\"68.87471783858045\" x2=\"195.256215330771\" y2=\"98.83967536576984\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st40_a0)\"/><circle cx=\"250\" cy=\"30\" r=\"40\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"250\" y=\"26\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">DOCUMENTS<\/text><text x=\"250\" y=\"40\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Existing specs,<\/text><text x=\"250\" y=\"52\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">laws, regulations<\/text><line x1=\"250.0\" y1=\"72.0\" x2=\"250.0\" y2=\"60.0\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st40_a0)\"/><circle cx=\"430\" cy=\"55\" r=\"40\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"430\" y=\"51\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">SYSTEMS<\/text><text x=\"430\" y=\"65\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Existing systems,<\/text><text x=\"430\" y=\"77\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">legacy analysis<\/text><line x1=\"390.3579490326273\" y1=\"68.87471783858045\" x2=\"304.743784669229\" y2=\"98.83967536576984\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st40_a0)\"/><text x=\"250\" y=\"158\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Sources are NOT exclusive — triangulate across all three for completeness<\/text><\/svg><\/div><p>Identifying sources is the first activity in every RE effort. It is an iterative, recursive process &mdash; new sources are found throughout the project.<\/p><p><b>Stakeholders:<\/b> Always primary. Missing a relevant stakeholder leads to poor or missing requirements and risks project failure. Use Alexander&apos;s onion model to find them: business system layer, containing system layer, wider environment layer. Snowball principle: more stakeholders found &rarr; easier to find more.<\/p><p><b>Documents:<\/b> Legal/regulatory documents, process descriptions, competitor marketing material, system documentation. Internal documents may be confidential &mdash; require NDA. Always check validity/currency of documents. Manage in a document list with unique IDs, dates, version numbers.<\/p><p><b>Other systems:<\/b> Similar systems (predecessor, legacy, competitor) for functional/quality requirements and constraints. Interfacing systems for interface requirements &mdash; study in detail, as every technical detail matters. Old constraints from legacy systems may no longer be relevant.<\/p>"},{"id":"t4-recap-1","expand_id":"exp-t4-1","title":"Kano Model","body":"<b>Dissatisfiers<\/b> (basic/subconscious: taken for granted, revealed by observation) &middot; <b>Satisfiers<\/b> (performance/conscious: explicitly asked for) &middot; <b>Delighters<\/b> (excitement/unconscious: not asked for, found by creativity).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"250\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"16\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Kano Model — 3 Types of Requirements<\/text><line x1=\"90\" y1=\"28\" x2=\"90\" y2=\"205\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"115\" x2=\"470\" y2=\"115\" stroke=\"#8b949e\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><text x=\"468\" y=\"110\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">neutral<\/text><text x=\"8\" y=\"32\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">😊 Satisfied<\/text><text x=\"8\" y=\"202\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">😞 Disappointed<\/text><text x=\"95\" y=\"220\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Not fulfilled →<\/text><text x=\"465\" y=\"220\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Fully fulfilled<\/text><path d=\"M90,200 C150,135 220,124 465,122\" fill=\"none\" stroke=\"#ff7b72\" stroke-width=\"2\"/><path d=\"M90,195 L465,40\" fill=\"none\" stroke=\"#79c0ff\" stroke-width=\"2\"/><path d=\"M90,116 C250,116 340,82 465,30\" fill=\"none\" stroke=\"#3fb950\" stroke-width=\"2\"/><line x1=\"100\" y1=\"39\" x2=\"118\" y2=\"39\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"124\" y=\"42\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Delighters (Excitement)<\/text><line x1=\"100\" y1=\"57\" x2=\"118\" y2=\"57\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"124\" y=\"60\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Satisfiers (Performance)<\/text><line x1=\"100\" y1=\"75\" x2=\"118\" y2=\"75\" stroke=\"#ff7b72\" stroke-width=\"2\"/><text x=\"124\" y=\"78\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Dissatisfiers (Must-be)<\/text><text x=\"250\" y=\"240\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Must-be: pain if absent, never delights. Delighters: joy if present, no pain if absent.<\/text><\/svg><\/div><p>The Kano model classifies requirements by what happens when the feature is present or absent:<\/p><ul><li><b>Dissatisfiers (basic factors):<\/b> If present &rarr; not noticed. If absent &rarr; users very upset. Subconscious &mdash; users don&apos;t ask for them because they can&apos;t imagine them missing. Example: GPS in a modern smartphone. Best elicited by observation techniques (field observation, apprenticing).<\/li><li><b>Satisfiers (performance factors):<\/b> More = higher satisfaction. Conscious &mdash; users explicitly ask for them. Example: camera quality options. Best elicited by gathering techniques (interviews, questionnaires).<\/li><li><b>Delighters (excitement factors):<\/b> If present &rarr; users delighted. If absent &rarr; no complaint. Unconscious &mdash; users don&apos;t know they want them. Example: first smartphone camera. Best elicited by creativity/design techniques.<\/li><\/ul><p>Kano analysis method: ask two questions per feature: &ldquo;How do you feel if this is present?&rdquo; and &ldquo;How do you feel if this is absent?&rdquo; Score on 5-point scale &rarr; plot on analysis matrix.<\/p><p><b>Kano categories evolve over time:<\/b> A new feature starts as a delighter &rarr; becomes a satisfier (widely requested) &rarr; becomes a dissatisfier (taken for granted). Camera on phones is the canonical example.<\/p>"},{"id":"t4-recap-2","expand_id":"exp-t4-2","title":"Elicitation Technique Categories","body":"<b>Gathering:<\/b> Questioning (interviews, questionnaires), Collaboration (workshops, crowd-RE), Observation (field observation, apprenticing), Artifact-based (system archaeology, document analysis, feedback analysis, reuse). <b>Design &amp; Idea-generating:<\/b> Creativity (brainstorming, analogy), Design (prototyping, scenarios/storyboards), Design thinking.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 215\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"215\" fill=\"#161b22\" rx=\"8\"/><rect x=\"5\" y=\"5\" width=\"94\" height=\"205\" rx=\"5\" fill=\"#3fb95012\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"52\" y=\"20\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">GATHERING<\/text><text x=\"52\" y=\"32\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">From existing sources<\/text><rect x=\"9\" y=\"44\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"52\" y=\"68\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Document analysis<\/text><rect x=\"9\" y=\"98\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"52\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">System archaeology<\/text><rect x=\"9\" y=\"152\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"52\" y=\"176\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Legacy system<\/text><text x=\"52\" y=\"188\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">review<\/text><rect x=\"103\" y=\"5\" width=\"94\" height=\"205\" rx=\"5\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"150\" y=\"20\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">CREATIVITY<\/text><text x=\"150\" y=\"32\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Generate ideas<\/text><rect x=\"107\" y=\"44\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"150\" y=\"68\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Brainstorming<\/text><rect x=\"107\" y=\"98\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"150\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Analogy<\/text><rect x=\"107\" y=\"152\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"150\" y=\"176\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Lateral thinking<\/text><rect x=\"201\" y=\"5\" width=\"94\" height=\"205\" rx=\"5\" fill=\"#ffa65712\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"248\" y=\"20\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">OBSERVATION<\/text><text x=\"248\" y=\"32\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Watch behaviour<\/text><rect x=\"205\" y=\"44\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"248\" y=\"68\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Field observation<\/text><rect x=\"205\" y=\"98\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"248\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Apprenticing<\/text><rect x=\"205\" y=\"152\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"248\" y=\"176\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Ethnography<\/text><rect x=\"299\" y=\"5\" width=\"94\" height=\"205\" rx=\"5\" fill=\"#56d36412\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"346\" y=\"20\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">SURVEY BASED<\/text><text x=\"346\" y=\"32\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Structured asking<\/text><rect x=\"303\" y=\"44\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"346\" y=\"68\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Questionnaire<\/text><rect x=\"303\" y=\"98\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"346\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Structured interview<\/text><rect x=\"303\" y=\"152\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"346\" y=\"176\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Online survey<\/text><rect x=\"397\" y=\"5\" width=\"94\" height=\"205\" rx=\"5\" fill=\"#d2a8ff12\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"444\" y=\"20\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">SUPPORT BASED<\/text><text x=\"444\" y=\"32\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Collaborative<\/text><rect x=\"401\" y=\"44\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"444\" y=\"68\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Workshop (JAD)<\/text><rect x=\"401\" y=\"98\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"444\" y=\"122\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Focus group<\/text><rect x=\"401\" y=\"152\" width=\"86\" height=\"48\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"444\" y=\"176\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Mind mapping<\/text><\/svg><\/div><p>Gathering techniques predominantly yield <b>satisfiers and dissatisfiers<\/b>.<\/p><p>Design &amp; idea-generating techniques predominantly yield <b>delighters<\/b>.<\/p><p><b>Key technique details:<\/b><\/p><ul><li><b>Interviews:<\/b> One-to-one, flexible, yields satisfiers. Time-consuming, not suited for large groups.<\/li><li><b>Questionnaires:<\/b> Scales to many respondents; quantitative (closed = confirm hypotheses) or qualitative (open = find new requirements).<\/li><li><b>Workshops:<\/b> Group technique, good for quick global insight, yields interaction between participants. Can be used for gathering OR creativity.<\/li><li><b>Field observation:<\/b> Observe users in natural environment. Good for dissatisfiers (taken-for-granted requirements). Requires preparation and time.<\/li><li><b>Apprenticing:<\/b> RE engineer acts as intern/novice in the domain. Deep understanding of domain before elicitation. Participatory, unlike passive field observation.<\/li><li><b>System archaeology:<\/b> Extract requirements from existing systems (legacy, competitor) by analysing documentation or code.<\/li><li><b>Document analysis (NEW in v1.3):<\/b> Structured study of documents &mdash; collect, select, analyse, interpret via triangulation.<\/li><li><b>Feedback analysis:<\/b> Reviews, app store ratings, call centre data. Can find dissatisfiers (negative) and occasionally delighters (positive innovative comments).<\/li><li><b>Brainstorming:<\/b> Defer judgment (separate ideation from analysis), quantity over quality, free association encouraged, criticism forbidden.<\/li><li><b>Analogy technique:<\/b> Use analogies (close or distant) to generate ideas. Two steps: elaborate the analogy, then transfer back to original problem.<\/li><\/ul>"},{"id":"t4-recap-3","expand_id":"exp-t4-3","title":"Conflict Types (6)","body":"<b>Subject matter<\/b> (factual differences) &middot; <b>Data<\/b> (inconsistent data/interpretation) &middot; <b>Interest<\/b> (personal/group goals) &middot; <b>Value<\/b> (principles/beliefs, hardest to resolve) &middot; <b>Relationship<\/b> (past negative experience) &middot; <b>Structural<\/b> (power/resource imbalance).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 150\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"150\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"15\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">6 Types of Requirements Conflicts<\/text><rect x=\"8\" y=\"24\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#ff7b7218\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"17\" y=\"45\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Data Conflict<\/text><text x=\"17\" y=\"62\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Inconsistent or misread data<\/text><rect x=\"170\" y=\"24\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"179\" y=\"45\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Interest Conflict<\/text><text x=\"179\" y=\"62\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Different goals/needs<\/text><rect x=\"332\" y=\"24\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"341\" y=\"45\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Value Conflict<\/text><text x=\"341\" y=\"62\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Different priorities or ethics<\/text><rect x=\"8\" y=\"82\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#d2a8ff18\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"17\" y=\"103\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Relationship Conflict<\/text><text x=\"17\" y=\"120\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Personal tensions<\/text><rect x=\"170\" y=\"82\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"179\" y=\"103\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Structural Conflict<\/text><text x=\"179\" y=\"120\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Resource/authority constraints<\/text><rect x=\"332\" y=\"82\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"341\" y=\"103\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Subject Matter Conflict<\/text><text x=\"341\" y=\"115\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Differing factual needs<\/text><text x=\"341\" y=\"126\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">(e.g. different environments)<\/text><text x=\"250\" y=\"142\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-family=\"sans-serif\">Relationship &amp; structural conflicts are often not requirements-related — escalate<\/text><\/svg><\/div><p><b>Subject matter:<\/b> Parties have genuinely different factual needs (e.g., different country legislation). Hard to resolve because underlying facts can&apos;t change. Best approached by detailed documentation and agreement on the conflict&apos;s exact nature.<\/p><p><b>Data:<\/b> Parties interpret the same data differently or use inconsistent data. Bias is common &mdash; each party thinks their interpretation is self-evident. Requires empathy and repeated communication.<\/p><p><b>Interest:<\/b> Formed by personal/group/role goals. Parties often hide true motives. Look for shared interests; understand gains and pains of both sides.<\/p><p><b>Value:<\/b> Differences in fundamental principles/beliefs. Most stable, rarely change short-term. Parties insist and are unwilling to give up. Look for higher shared values. Most difficult to resolve.<\/p><p><b>Relationship:<\/b> Based on past negative experiences. Emotions and miscommunication involved. Often co-occurs with other types. Escalation or personnel exchange may be needed.<\/p><p><b>Structural:<\/b> Power inequality, resource competition, structural dependencies. Parties may misuse requirement discussions to change/preserve status quo. Escalation often necessary.<\/p>"},{"id":"t4-recap-4","expand_id":"exp-t4-4","title":"Conflict Resolution Techniques","body":"<b>Agreement<\/b> &middot; <b>Compromise<\/b> &middot; <b>Voting<\/b> &middot; <b>Overruling<\/b> &middot; <b>Definition of variants<\/b>. Auxiliary: CAF (Consider-All-Facts), PMI (Plus-Minus-Interesting), Decision matrix. <b>Sampling is NOT a conflict resolution technique.<\/b>","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 150\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"150\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Conflict Resolution Techniques (IREB)<\/text><line x1=\"40\" y1=\"68\" x2=\"470\" y2=\"68\" stroke=\"#30363d\" stroke-width=\"1.5\"/><circle cx=\"60\" cy=\"68\" r=\"17\" fill=\"#21262d\" stroke=\"#8b949e\" stroke-width=\"2\"/><text x=\"60\" y=\"44\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Agreement<\/text><text x=\"60\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">All parties<\/text><text x=\"60\" y=\"111\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">truly agree<\/text><circle cx=\"157\" cy=\"68\" r=\"17\" fill=\"#21262d\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"157\" y=\"44\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Compromise<\/text><text x=\"157\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">All can<\/text><text x=\"157\" y=\"111\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">live with it<\/text><circle cx=\"255\" cy=\"68\" r=\"17\" fill=\"#21262d\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"255\" y=\"44\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Voting<\/text><text x=\"255\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Group decides<\/text><text x=\"255\" y=\"111\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">(moderated)<\/text><circle cx=\"352\" cy=\"68\" r=\"17\" fill=\"#21262d\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"352\" y=\"44\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Overruling<\/text><text x=\"352\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Higher authority<\/text><text x=\"352\" y=\"111\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">decides<\/text><circle cx=\"450\" cy=\"68\" r=\"17\" fill=\"#21262d\" stroke=\"#d2a8ff\" stroke-width=\"2\"/><text x=\"450\" y=\"44\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Variants<\/text><text x=\"450\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Separate solutions<\/text><text x=\"450\" y=\"111\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">per group<\/text><text x=\"250\" y=\"140\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">Never ignore conflicts — unresolved conflicts resurface as defects<\/text><\/svg><\/div><p><b>Agreement:<\/b> Discussion until all parties understand each other and agree on a preferred option. Time-consuming. Best for data conflicts. Long-lasting if successful.<\/p><p><b>Compromise:<\/b> Parties accept an option that is not their first preference but acceptable. Often includes new elements introduced by the RE engineer. Suitable for subject matter, interest, structural conflicts.<\/p><p><b>Voting:<\/b> Anonymous, with neutral moderator. Requires stakeholders to understand alternatives and consequences. Quick and easy, but losing party may need attention. Works for subject matter and interest conflicts.<\/p><p><b>Overruling:<\/b> Decision transferred to higher authority. Used under time pressure or when other techniques fail. Good for interest and structural conflicts. Must ensure the decision-maker fully understands the alternatives.<\/p><p><b>Definition of variants:<\/b> Build separate solutions for conflicting requirements (parametric system). High cost and complexity &mdash; only feasible with sufficient time/budget. Good for subject matter, interest, value conflicts.<\/p><p><b>Auxiliary:<\/b> CAF considers alternatives against predefined criteria. PMI = assess Plus/Minus/Interesting aspects. Decision matrix = weighted multi-criteria scoring. These assist primary techniques.<\/p>"},{"id":"t4-recap-5","expand_id":"exp-t4-5","title":"Validation Techniques","body":"<b>Review<\/b> (informal, walkthrough, inspection) &middot; <b>Exploratory<\/b> (prototyping, alpha/beta testing, A/B testing) &middot; <b>Sample development<\/b>. Reviews and sample development = static; exploratory = dynamic.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 175\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"175\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><\/defs><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Validation Techniques — Informal to Formal<\/text><line x1=\"20\" y1=\"80\" x2=\"480\" y2=\"80\" stroke=\"#8b949e\" stroke-width=\"2\"/><line x1=\"430\" y1=\"80\" x2=\"478\" y2=\"80\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#a0)\"/><text x=\"20\" y=\"95\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Informal<\/text><text x=\"480\" y=\"95\" text-anchor=\"end\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Formal<\/text><circle cx=\"65\" cy=\"80\" r=\"14\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"65\" y=\"46\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Walkthrough<\/text><text x=\"65\" y=\"106\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Author leads<\/text><text x=\"65\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">No formal rules<\/text><text x=\"65\" y=\"132\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Fast<\/text><circle cx=\"185\" cy=\"80\" r=\"14\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"185\" y=\"46\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Peer Review<\/text><text x=\"185\" y=\"106\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Role-based<\/text><text x=\"185\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Checklist used<\/text><text x=\"185\" y=\"132\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Structured<\/text><circle cx=\"310\" cy=\"80\" r=\"14\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"310\" y=\"46\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Team Review<\/text><text x=\"310\" y=\"106\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Group review<\/text><text x=\"310\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Moderated<\/text><text x=\"310\" y=\"132\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Defect log<\/text><circle cx=\"435\" cy=\"80\" r=\"14\" fill=\"#ff7b7222\" stroke=\"#ff7b72\" stroke-width=\"2\"/><text x=\"435\" y=\"46\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Inspection<\/text><text x=\"435\" y=\"106\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Trained team<\/text><text x=\"435\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Formal entry<\/text><text x=\"435\" y=\"132\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Metrics collected<\/text><text x=\"250\" y=\"170\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">More formal = better defect detection. Higher cost. Use formal for safety-critical.<\/text><\/svg><\/div><p><b>Important aspects for validation:<\/b><\/p><ul><li><b>Degree of independence:<\/b> Higher independence = more defects found (but more expensive). High-risk projects need higher independence.<\/li><li><b>Separate identification from correction:<\/b> Find all defects first, then decide which to fix (a later-found defect may invalidate an earlier fix).<\/li><li><b>Interdisciplinary group:<\/b> Business, users, developers, testers, operators, security specialists.<\/li><li><b>Repeated validation:<\/b> Not just end-of-phase &mdash; repeated at milestones, especially when requirements are updated.<\/li><\/ul><p><b>Walkthrough:<\/b> Author leads reviewers through the work product step-by-step. Two variants: (1) reviewers come unprepared and ask ad hoc questions; (2) reviewers prepare questions in advance. Best for early concept reviews and work-product handoffs.<\/p><p><b>Inspection:<\/b> Formal. Independent moderator (not author). Individual preparation with checklists. Focus on defect finding, not fixing. Provides audit trail. Best for safety-critical systems and formal milestone approvals.<\/p><p><b>Prototyping for validation:<\/b> Exploratory/throwaway prototype checked by stakeholders. Evolutionary prototype also used during development. Use to check adequacy of requirements.<\/p><p><b>Alpha testing:<\/b> At developer site, simulated environment, small group, some guidance. <b>Beta testing:<\/b> At user sites, real environment, often large/unknown group, minimal guidance &mdash; validates assumptions.<\/p><p><b>A/B testing:<\/b> Two variants shown to randomly selected groups; reactions compared statistically. Validates requirement quality and assumptions.<\/p><p><b>Sample development:<\/b> Developers try to produce designs/code/test cases from requirements. Flaws in requirements surface when developers can&apos;t proceed. Static technique (system not operative).<\/p>"},{"id":"t4-recap-6","expand_id":"exp-t4-6","title":"Selecting Elicitation Techniques","body":"Key selection factors: <b>type of system<\/b> (new/innovative vs replacement) + <b>Kano category sought<\/b> (dissatisfiers &rarr; observation; delighters &rarr; creativity) + stakeholder availability + development lifecycle + organisational setup.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 181.9\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"181.9\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">How to Select Elicitation Techniques<\/text><rect x=\"8\" y=\"22\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"14\" y=\"36.9\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Project Phase<\/text><text x=\"130\" y=\"36.9\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Early → exploratory; Late → structured<\/text><rect x=\"8\" y=\"50\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"64.8\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Stakeholder Type<\/text><text x=\"130\" y=\"64.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Expert → interview; Many → questionnaire<\/text><rect x=\"8\" y=\"78\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"14\" y=\"92.8\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Domain Knowledge<\/text><text x=\"130\" y=\"92.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Low → observation; High → doc analysis<\/text><rect x=\"8\" y=\"106\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1\"/><text x=\"14\" y=\"120.8\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Time Budget<\/text><text x=\"130\" y=\"120.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Short → workshops; Long → ethnography<\/text><rect x=\"8\" y=\"134\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#d2a8ff15\" stroke=\"#d2a8ff\" stroke-width=\"1\"/><text x=\"14\" y=\"148.8\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Req Type<\/text><text x=\"130\" y=\"148.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Functional → interviews; Quality → surveys<\/text><text x=\"250\" y=\"175.9\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Best practice: combine multiple techniques to triangulate requirements<\/text><\/svg><\/div><p><b>Technique-to-Kano mapping:<\/b><\/p><ul><li>Gathering techniques (interviews, questionnaires, workshops) &rarr; mainly satisfiers and dissatisfiers.<\/li><li>Observation techniques (field observation, apprenticing) &rarr; best for dissatisfiers (basic/subconscious factors).<\/li><li>Design and idea-generating (brainstorming, analogy, prototyping, design thinking) &rarr; best for delighters.<\/li><\/ul><p><b>Best results come from combining techniques.<\/b> Start with obvious sources, use questioning first, then observation for dissatisfiers, then creativity for delighters.<\/p><p>The requirements RE preference, tool complexity, and habit are NOT primary selection criteria.<\/p>"}]},"t5":{"cards":[{"id":"t5-recap-0","expand_id":"exp-t5-0","title":"RE Process Influencing Factors","body":"Overall process fit &middot; Development context (customer-supplier-user, contract, trust) &middot; Stakeholder availability/capability &middot; Shared understanding &middot; Complexity/criticality &middot; Constraints &middot; Time/budget &middot; Volatility &middot; RE experience.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 185.9\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"185.9\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Factors Influencing RE Process Design<\/text><rect x=\"8\" y=\"22\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"14\" y=\"36.9\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Domain<\/text><text x=\"90\" y=\"36.9\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Regulated domain → formal; Exploratory → agile<\/text><rect x=\"8\" y=\"51\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"65.8\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">System Type<\/text><text x=\"90\" y=\"65.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Safety-critical → prescriptive; Web SaaS → iterative<\/text><rect x=\"8\" y=\"80\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"14\" y=\"94.8\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Org Culture<\/text><text x=\"90\" y=\"94.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Risk-averse org → waterfall; Startup → lean<\/text><rect x=\"8\" y=\"109\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1\"/><text x=\"14\" y=\"123.8\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Stakeholders<\/text><text x=\"90\" y=\"123.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Few experts → interview; Many users → workshops<\/text><rect x=\"8\" y=\"138\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#d2a8ff15\" stroke=\"#d2a8ff\" stroke-width=\"1\"/><text x=\"14\" y=\"152.8\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Contract Type<\/text><text x=\"90\" y=\"152.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sa
