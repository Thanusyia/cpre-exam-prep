h=\"490\" height=\"20\" rx=\"3\" fill=\"#d2a8ff15\" stroke=\"#d2a8ff\" stroke-width=\"1\"/><text x=\"14\" y=\"130.8\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">✓ Collaboration<\/text><text x=\"155\" y=\"130.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Multi-user, role-based access, review workflow?<\/text><rect x=\"8\" y=\"142\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#ff7b7215\" stroke=\"#ff7b72\" stroke-width=\"1\"/><text x=\"14\" y=\"154.8\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">✗ NOT: Vendor Pitch<\/text><text x=\"155\" y=\"154.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Never select based on demos alone — evaluate against your process<\/text><text x=\"250\" y=\"180.7\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">Key exam point: tool selection is driven by process needs, NOT tool features<\/text><\/svg><\/div>\n        <p><b>Process fit<\/b>: the tool must support the artefact types and workflows the RE process demands. <b>Tool chain integration<\/b>: the tool must integrate with ALM, test management, and configuration management tools already in use. <b>Usability<\/b>: ease of use, required training effort. <b>Scalability<\/b>: number of concurrent users, licensing cost.<\/p>\n        <p>Tool selection is a <b>management/process decision<\/b> — users are consulted but not solely responsible for the choice.<\/p>"},{"id":"t7-recap-2","expand_id":"exp-t7-2","title":"&#9888; Exam Trap: K0910","body":"&#10008; \"Choice should be left to users\" &rarr; <b>False<\/b>. &#10008; \"Assist users to set up test cases\" &rarr; <b>False<\/b>.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 155\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"155\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">K0910 — RM Tool vs. RE Tool<\/text><rect x=\"8\" y=\"22\" width=\"238\" height=\"128\" rx=\"5\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"127\" y=\"38\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">RM TOOL DOES<\/text><text x=\"24\" y=\"58\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Storage & retrieval<\/text><text x=\"24\" y=\"76\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Attribute management<\/text><text x=\"24\" y=\"94\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Baselining & versioning<\/text><text x=\"24\" y=\"112\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Traceability links<\/text><text x=\"24\" y=\"130\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Change workflow<\/text><text x=\"24\" y=\"148\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ Reporting & views<\/text><rect x=\"256\" y=\"22\" width=\"238\" height=\"128\" rx=\"5\" fill=\"#ff7b7215\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"375\" y=\"38\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">RM TOOL DOES NOT<\/text><text x=\"272\" y=\"58\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✗ Create requirements (you do)<\/text><text x=\"272\" y=\"76\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✗ Model diagrams (separate)<\/text><text x=\"272\" y=\"94\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✗ Decide priorities (you do)<\/text><text x=\"272\" y=\"112\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✗ Enforce quality (you do)<\/text><\/svg><\/div>\n        <p><b>A True<\/b> — tool must support the artefacts the process produces. <b>B False<\/b> — tool selection is a management decision; users are consulted but not solely responsible. <b>C False<\/b> — setting up test cases is a testing activity, not a core RE tool requirement. <b>D True<\/b> — integration with the broader tool chain is a key selection criterion.<\/p>"},{"id":"t7-recap-3","expand_id":"exp-t7-3","title":"&#9888; Exam Trap: A0922","body":"\"Modelling of requirements\" is <b>NOT<\/b> a core RM tool capability &mdash; it belongs to CASE tools.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 163.7\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"163.7\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">A0922 — Choosing the Right Tool<\/text><rect x=\"8\" y=\"28\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#ff7b7215\" stroke=\"#ff7b72\" stroke-width=\"1\"/><text x=\"12\" y=\"43.3\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">❌ WRONG<\/text><text x=\"86\" y=\"43.3\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Select tool with most features<\/text><text x=\"290\" y=\"43.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Feature overload → poor adoption<\/text><rect x=\"8\" y=\"57\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#ff7b7215\" stroke=\"#ff7b72\" stroke-width=\"1\"/><text x=\"12\" y=\"72.3\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">❌ WRONG<\/text><text x=\"86\" y=\"72.3\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Select based on vendor demo<\/text><text x=\"290\" y=\"72.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Vendor bias → process mismatch<\/text><rect x=\"8\" y=\"86\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"12\" y=\"101.3\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ RIGHT<\/text><text x=\"86\" y=\"101.3\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Analyse YOUR process first<\/text><text x=\"290\" y=\"101.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Then match tool to process needs<\/text><rect x=\"8\" y=\"115\" width=\"490\" height=\"24\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"12\" y=\"130.3\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">✓ RIGHT<\/text><text x=\"86\" y=\"130.3\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Pilot with real reqs<\/text><text x=\"290\" y=\"130.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Validate fit before commitment<\/text><text x=\"250\" y=\"157.7\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">Exam tip: the correct answer always references process fit first<\/text><\/svg><\/div>\n        <p>Traceability (A), process reporting (C), and prioritisation support (D) are all standard RM tool capabilities. Modelling — creating UML/SysML or graphical notation diagrams — is a CASE tool feature, not an RM tool feature. This is the IREB-endorsed distinction.<\/p>"},{"id":"t7-recap-4","expand_id":"exp-t7-4","title":"Traceability and Change Management","body":"Traceability links enable impact analysis. Impact analysis is mandatory before implementing any change.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"165\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st74_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st74_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st74_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st74_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">RM Tool: Traceability + Change Management<\/text><rect x=\"45\" y=\"24\" width=\"80\" height=\"50\" rx=\"5\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"85\" y=\"45.2\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Source<\/text><text x=\"85\" y=\"57.9\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Doc<\/text><line x1=\"127\" y1=\"44\" x2=\"138\" y2=\"44\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st74_a0)\"/><rect x=\"140\" y=\"24\" width=\"80\" height=\"50\" rx=\"5\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"180\" y=\"45.2\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Require-<\/text><text x=\"180\" y=\"57.9\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">ment<\/text><line x1=\"222\" y1=\"44\" x2=\"233\" y2=\"44\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st74_a0)\"/><rect x=\"235\" y=\"24\" width=\"80\" height=\"50\" rx=\"5\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"275\" y=\"51.5\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Design<\/text><line x1=\"317\" y1=\"44\" x2=\"328\" y2=\"44\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st74_a0)\"/><rect x=\"330\" y=\"24\" width=\"80\" height=\"50\" rx=\"5\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"370\" y=\"51.5\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Test Case<\/text><line x1=\"412\" y1=\"44\" x2=\"423\" y2=\"44\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st74_a0)\"/><rect x=\"425\" y=\"24\" width=\"80\" height=\"50\" rx=\"5\" fill=\"#d2a8ff18\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"465\" y=\"51.5\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Result<\/text><path d=\"M180,74 Q180,110 330,110 Q415,110 425,74\" fill=\"none\" stroke=\"#ff7b72\" stroke-width=\"1.5\" stroke-dasharray=\"4,2\" marker-end=\"url(#st74_a0)\"/><text x=\"300\" y=\"131.9\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Change to REQ → auto-flag linked Tests & Design<\/text><text x=\"250\" y=\"145.8\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">RM tools support impact analysis by showing all downstream links automatically<\/text><text x=\"250\" y=\"159.0\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">This is WHY traceability in a tool is valuable — manual tracking is error-prone<\/text><\/svg><\/div>\n        <p>When a requirement changes, traceability links let the team navigate to all downstream artefacts (test cases, design elements, code modules) that are affected. This is the foundation of effective change management. RM tools automate the recording and navigation of these links, dramatically reducing manual effort.<\/p>\n        <p>Baselining (releasing an agreed snapshot of the requirements set) supports change management by providing the reference from which changes are formally tracked.<\/p>"}]}};

/* ── QuestionBlock ─────────────────────────────────────────────── */
function QuestionBlock({q,idx,answers,onAnswer,submitted,instant,topicId}){
  const ua=answers[q.id];
  const fullyAnswered=q.type==='A'?(ua!==undefined&&ua!==null):q.type==='K'?(!!ua&&ua.every(v=>v!==null)):((ua||[]).length===(q.need||2));
  const revealed=submitted||(instant&&fullyAnswered);
  const answered=ua!==undefined&&ua!==null;

  let earned=0,possible=q.pts,correct=false;
  if(revealed&&answered){
    if(q.type==='A'){
      correct=q.correct[0]===ua;
      earned=correct?q.pts:0;
    }else if(q.type==='K'){
      const nS=q.stmts.length;const ok=q.stmts.reduce((s,_,i)=>s+(ua[i]===q.correct[i]?1:0),0);
      earned=ok===nS?2:ok===nS-1?1:0;
      correct=ok===nS;
    }else if(q.type==='P'){
      const ss=[...(ua||[])].sort((a,b)=>a-b);
      const sc=[...q.correct].sort((a,b)=>a-b);
      correct=JSON.stringify(ss)===JSON.stringify(sc);
      earned=correct?q.pts:0;
    }
  }

  const typeColor={A:'var(--blue)',K:'var(--yellow)',P:'var(--purple)'}[q.type]||'var(--text2)';
  const scoreClass=revealed&&answered?(correct?'earned':earned>0?'partial':'zero'):'';

  return(
    <div className={`qcard${revealed?(correct?' correct':' wrong'):''}`}>
      <div className="qcard-header">
        <span className="q-num">Q{idx+1}</span>
        <span className="type-badge" style={{color:typeColor,borderColor:typeColor}}>{q.type}</span>
        <span className="pts-badge">{q.pts}pt{q.pts>1?'s':''}</span>
        {revealed&&answered&&(
          <span className={`score-ind ${scoreClass}`}>{earned}/{q.pts}pts</span>
        )}
      </div>

      <div className="q-text">{q.q}</div>

      {q.type==='A'&&(
        <div className="opts">
          {(q.opts||[]).map((opt,i)=>{
            const isCor=q.correct[0]===i;
            let cls='opt';
            if(revealed){cls+=(isCor?' correct':ua===i?' wrong':'');cls+=' locked';}
            else if(ua===i)cls+=' selected';
            return(
              <div key={i} className={cls} onClick={()=>!revealed&&onAnswer(q.id,i)}>
                <span className="opt-ltr">{String.fromCharCode(65+i)})</span>
                <span>{opt}</span>
              </div>
            );
          })}
        </div>
      )}

      {q.type==='K'&&(
        <div className="k-stmts">
          <div className="k-head"><span>Statement</span><span>True</span><span>False</span></div>
          {(q.stmts||[]).map((stmt,i)=>{
            const val=ua?ua[i]:null;
            const rowOk=revealed&&val===q.correct[i];
            const rowBad=revealed&&val!==null&&val!==q.correct[i];
            return(
              <div key={i} className={`k-row${rowOk?' correct':''}${rowBad?' wrong':''}`}>
                <span className="k-stmt">{String.fromCharCode(65+i)}) {stmt}</span>
                <button disabled={revealed}
                  className={`k-btn${val===true?' t-active':''}`}
                  onClick={()=>{if(revealed)return;const a=ua?[...ua]:Array(q.stmts.length).fill(null);a[i]=true;onAnswer(q.id,a);}}>T
                </button>
                <button disabled={revealed}
                  className={`k-btn${val===false?' f-active':''}`}
                  onClick={()=>{if(revealed)return;const a=ua?[...ua]:Array(q.stmts.length).fill(null);a[i]=false;onAnswer(q.id,a);}}>F
                </button>
              </div>
            );
          })}
        </div>
      )}

      {q.type==='P'&&(
        <div>
          <div className="p-hint">Select exactly {q.need||2} option{(q.need||2)>1?'s':''}</div>
          <div className="opts">
            {(q.opts||[]).map((opt,i)=>{
              const sel=(ua||[]).includes(i);
              const isCor=q.correct.includes(i);
              let cls='opt';
              if(revealed){cls+=(isCor?' correct':sel?' wrong':'');cls+=' locked';}
              else if(sel)cls+=' selected';
              return(
                <div key={i} className={cls} onClick={()=>{
                  if(revealed)return;
                  const cur=ua||[];
                  let next;
                  if(cur.includes(i))next=cur.filter(x=>x!==i);
                  else if(cur.length<(q.need||2))next=[...cur,i];
                  else next=cur;
                  onAnswer(q.id,next);
                }}>
                  <div className="p-check">{sel?'✓':''}</div>
                  <span className="opt-ltr">{String.fromCharCode(65+i)})</span>
                  <span>{opt}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {revealed&&(
        <div className="exp"><span className="exp-label">Explanation:</span>{q.exp}<div className="exp-ref">Ref: IREB CPRE FL Handbook v1.3.0 — Chapter {topicId?topicId.slice(1):"?"}{q.official?" · based on an official IREB practice question":""}</div></div>
      )}
    </div>
  );
}

/* ── ExamView ──────────────────────────────────────────────────── */
function ExamView({topicId,onComplete}){
  const [answers,setAnswers]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [instant,setInstant]=useState(true);
  const questions=QUESTIONS[topicId]||[];

  useEffect(()=>{setAnswers({});setSubmitted(false);},[topicId]);

  const onAnswer=useCallback((qId,val)=>{
    setAnswers(prev=>({...prev,[qId]:val}));
  },[]);

  const answeredN=Object.keys(answers).filter(k=>answers[k]!==null&&answers[k]!==undefined).length;

  const {earned,possible,pct}=useMemo(()=>{
    if(!submitted)return{earned:0,possible:0,pct:0};
    let e=0,p=0;
    questions.forEach(q=>{
      p+=q.pts;
      const ua=answers[q.id];
      if(ua===undefined||ua===null)return;
      if(q.type==='A'){if(q.correct[0]===ua)e+=q.pts;}
      else if(q.type==='K'){const nS=q.stmts.length;const ok=q.stmts.reduce((s,_,i)=>s+(ua[i]===q.correct[i]?1:0),0);e+=ok===nS?2:ok===nS-1?1:0;}
      else if(q.type==='P'){const ss=[...ua].sort((a,b)=>a-b),sc=[...q.correct].sort((a,b)=>a-b);if(JSON.stringify(ss)===JSON.stringify(sc))e+=q.pts;}
    });
    return{earned:e,possible:p,pct:p>0?Math.round(e/p*100):0};
  },[submitted,answers,questions]);

  const pass=pct>=70;

  useEffect(()=>{
    if(submitted&&onComplete)onComplete(topicId,{earned,possible,pct,pass});
  },[submitted]);

  return(
    <div className="exam-scroll">
      <div className="exam-sticky">
        <span className="exam-stat">{answeredN}/{questions.length} answered</span>
        {submitted&&<span className="exam-stat score">Score: {earned}/{possible} pts ({pct}%)</span>}
        <div className="exam-actions"><label className="instant-toggle" title="Reveal the correct answer and explanation as soon as a question is fully answered"><input type="checkbox" checked={instant} onChange={e=>setInstant(e.target.checked)}/> Instant feedback</label>
          {!submitted?(
            <button className="btn btn-primary" disabled={answeredN===0}
              onClick={()=>setSubmitted(true)}>
              Submit{answeredN<questions.length?` (${questions.length-answeredN} unanswered)`:' All'}
            </button>
          ):(
            <button className="btn btn-secondary" onClick={()=>{setAnswers({});setSubmitted(false);}}>
              Reset &amp; Retry
            </button>
          )}
        </div>
      </div>

      {submitted&&(
        <div className={`score-banner ${pass?'pass':'fail'}`}>
          {pass?'✓ PASS':'✗ FAIL'} — {earned}/{possible} pts ({pct}%) · {pass?'≥ 70% threshold met':'< 70% — review and retry'}
        </div>
      )}

      <div className="questions-list">
        {questions.map((q,i)=>(
          <QuestionBlock key={q.id} q={q} idx={i} answers={answers} onAnswer={onAnswer} submitted={submitted} instant={instant} topicId={topicId}/>
        ))}
      </div>
    </div>
  );
}

/* ── RecapCard ─────────────────────────────────────────────────── */
function RecapCard({card}){
  const [open,setOpen]=useState(false);
  return(
    <div className={`card${open?' expanded':''}`}>
      <div className="card-header" onClick={()=>setOpen(!open)}>
        <div className="card-header-left">
          <div className="card-title" dangerouslySetInnerHTML={{__html:card.title}}/>
          <div className="card-body-text" dangerouslySetInnerHTML={{__html:card.body}}/>
        </div>
        <span className="card-toggle">▼</span>
      </div>
      {open&&<div className="card-expand-content" dangerouslySetInnerHTML={{__html:card.expand}}/>}
    </div>
  );
}

/* ── RecapView ─────────────────────────────────────────────────── */
function RecapView({topicId}){
  const td=RECAP_DATA[topicId];
  if(!td||!td.cards||!td.cards.length)return(
    <div className="recap-scroll" style={{padding:32,color:'var(--text3)'}}>No recap cards for this topic.</div>
  );
  return(
    <div className="recap-scroll">
      <div className="cards-grid">
        {td.cards.map(c=><RecapCard key={c.id} card={c}/>)}
      </div>
    </div>
  );
}

/* ── Sidebar ───────────────────────────────────────────────────── */
function Sidebar({topic,onSelect,collapsed,onToggle,progress}){
  const total=TOPICS.reduce((s,t)=>s+t.count,0);
  return(
    <>
      {collapsed&&<button className="sidebar-fab" onClick={onToggle} title="Open sidebar">▶</button>}
      <div className={`sidebar${collapsed?' collapsed':''}`}>
        <div className="sb-header">
          <div className="sb-brand">CPRE FL3<span>Foundation Level · Exam Prep</span></div>
          <button className="sb-toggle" onClick={onToggle} title="Collapse">◀</button>
        </div>
        <div className="sb-content">
          <div className="sb-section">Topics</div>
          {TOPICS.map(t=>{
            const pr=progress&&progress[t.id];
            const fc=pr&&!pr.pass?' fail':'';
            return(
            <div key={t.id} className={`nav-item${topic===t.id?' active':''}`} onClick={()=>onSelect(t.id)}>
              <div className="nav-top">
                <span className="nav-label">{t.title}</span>
                {pr&&<span className={`nav-pct${fc}`}>{pr.pct}%</span>}
              </div>
              {pr&&<div className="nav-bar"><div className={`nav-bar-fill${fc}`} style={{width:pr.pct+'%'}}/></div>}
            </div>
            );
          })}
        </div>
        <div className="sb-footer">7 Topics · {total} Qs · Pass ≥ 70% · 75 min</div>
      </div>
    </>
  );
}

/* ── App ───────────────────────────────────────────────────────── */
function useProgress(){
  const [prog,setProg]=useState(()=>{try{return JSON.parse(localStorage.getItem('cpre_fl3_progress')||'{}');}catch(e){return{};}});
  const record=useCallback((topicId,result)=>{
    setProg(prev=>{
      const cur=prev[topicId];
      const next={...prev,[topicId]:(!cur||result.pct>=cur.pct)?result:cur};
      try{localStorage.setItem('cpre_fl3_progress',JSON.stringify(next));}catch(e){}
      return next;
    });
  },[]);
  return[prog,record];
}

function App(){
  const [topic,setTopic]=useState('t1');
  const [view,setView]=useState('recap');
  const [sbCol,setSbCol]=useState(false);
  const [progress,recordProgress]=useProgress();

  const t=TOPICS.find(x=>x.id===topic);
  const cardCount=RECAP_DATA[topic]?.cards?.length||0;
  const pr=progress[topic];

  return(
    <div className="app">
      <Sidebar topic={topic} onSelect={id=>{setTopic(id);setView('recap');}} collapsed={sbCol} onToggle={()=>setSbCol(!sbCol)} progress={progress}/>
      <div className="content-area">
        <div className="topbar">
          <div className="topbar-title">{t?.title||''}</div>
          <div className="topbar-pills">
            {pr&&<span className="pill score">Best {pr.pct}%</span>}
            <span className="pill">{t?.count||0} Qs</span>
            <span className="pill pass">Pass ≥ 70%</span>
            <span className="pill">75 min</span>
          </div>
        </div>
        <div className="tab-row">
          <button className={`tab${view==='recap'?' active':''}`} onClick={()=>setView('recap')}>
            Recap ({cardCount} cards)
          </button>
          <button className={`tab${view==='exam'?' active':''}`} onClick={()=>setView('exam')}>
            Exam ({t?.count||0} Qs)
          </button>
        </div>
        {view==='recap'?<RecapView topicId={topic}/>:<ExamView topicId={topic} onComplete={recordProgress}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body></html>
