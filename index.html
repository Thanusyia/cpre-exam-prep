<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d13;--bg2:#10141c;--bg3:#161b25;--bg4:#1f2630;
  --border:#222a36;--border2:#2c3543;
  --text:#eef1f6;--text2:#a3adbb;--text3:#69737f;
  --green:#3fb950;--green-bright:#56d364;--blue:#79c0ff;--yellow:#ffa657;
  --red:#ff7b72;--purple:#d2a8ff;--cyan:#56d364;
  --accent:#3fb950;--accent-soft:rgba(63,185,80,.12);--accent-line:rgba(63,185,80,.42);
  --sidebar:266px;--topbar:56px;
  --tr:200ms cubic-bezier(.4,0,.2,1);
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Space Grotesk','Manrope',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --radius:14px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.6);
}
html{font-size:clamp(14px,.5vw + 11.5px,18px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1rem;line-height:1.6;
  height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-wrap:break-word}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 480px at 16% -10%,rgba(63,185,80,.055),transparent 62%),
             radial-gradient(900px 420px at 100% 0%,rgba(121,192,255,.04),transparent 60%)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--border2);background-clip:padding-box}
*{scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}

/* Layout */
#root{display:flex;height:100dvh;overflow:hidden;position:relative;z-index:1}
.app{display:flex;width:100%;height:100%}
.content-area{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0}

/* Sidebar */
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width var(--tr);flex-shrink:0;z-index:10}
.sidebar.collapsed{width:0;border-right-color:transparent}
.sb-header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 18px 16px;flex-shrink:0;overflow:hidden}
.sb-brand{font-family:var(--display);font-size:1.04rem;font-weight:700;color:var(--text);
  letter-spacing:-.01em;white-space:nowrap;line-height:1.15}
.sb-brand span{display:block;color:var(--text3);font-weight:500;font-size:.62em;letter-spacing:.02em;
  font-family:var(--sans);margin-top:3px}
.sb-toggle{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--text3);
  cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:11px;transition:all var(--tr)}
.sb-toggle:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.sb-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:4px 12px 12px}
.sb-section{padding:14px 8px 8px;font-size:.66rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text3);white-space:nowrap}
.nav-item{display:flex;flex-direction:column;gap:7px;padding:10px 12px;cursor:pointer;border-radius:11px;
  transition:background var(--tr),color var(--tr);color:var(--text2);position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text)}
.nav-item.active::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)}
.nav-top{display:flex;align-items:center;gap:8px;min-width:0}
.nav-label{flex:1;min-width:0;font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item.active .nav-label{color:var(--text)}
.nav-pct{flex-shrink:0;font-family:var(--mono);font-size:.66rem;font-weight:700;padding:2px 8px;
  border-radius:99px;background:var(--accent-soft);color:var(--green-bright)}
.nav-pct.fail{background:rgba(255,123,114,.13);color:var(--red)}
.nav-bar{height:3px;border-radius:99px;background:var(--bg4);overflow:hidden}
.nav-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width var(--tr)}
.nav-bar-fill.fail{background:var(--red)}
.sb-footer{padding:14px 18px;border-top:1px solid var(--border);flex-shrink:0;font-size:.7rem;
  color:var(--text3);font-family:var(--mono);text-align:center;line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-fab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:20;background:var(--bg2);
  border:1px solid var(--border);border-left:none;color:var(--text2);cursor:pointer;padding:13px 7px;
  border-radius:0 10px 10px 0;font-size:12px;transition:all var(--tr)}
.sidebar-fab:hover{background:var(--bg3);color:var(--text)}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;height:var(--topbar);
  background:rgba(16,20,28,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 22px;gap:14px;flex-shrink:0}
.topbar-title{font-family:var(--display);font-size:1.02rem;font-weight:600;letter-spacing:-.01em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar-pills{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;background:var(--bg3);
  border:1px solid var(--border);font-size:.7rem;font-weight:600;color:var(--text2);font-family:var(--mono);white-space:nowrap}
.pill.pass{border-color:var(--accent-line);color:var(--green-bright);background:var(--accent-soft)}
.pill.score{border-color:var(--border2);color:var(--text)}

/* Tabs */
.tab-row{display:flex;gap:5px;padding:14px 22px 8px;flex-shrink:0}
.tab{padding:8px 16px;border-radius:99px;border:1px solid transparent;background:transparent;color:var(--text3);
  cursor:pointer;font-size:.85rem;font-weight:600;font-family:var(--sans);transition:all var(--tr);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg3);border-color:var(--border2);color:var(--text)}

/* Recap cards */
.recap-scroll{flex:1;overflow-y:auto;padding:22px}
.cards-grid{display:flex;flex-direction:column;gap:10px;max-width:1000px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  transition:border-color var(--tr),box-shadow var(--tr)}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:flex-start;padding:18px 20px;cursor:pointer;gap:16px;user-select:none}
.card-header-left{flex:1;min-width:0}
.card-header:hover{background:var(--bg3)}
.card-title{font-size:1rem;font-weight:700;color:var(--text);line-height:1.4;letter-spacing:-.01em;overflow-wrap:break-word}
.card-toggle{color:var(--text3);font-size:10px;flex-shrink:0;transition:transform var(--tr),color var(--tr),border-color var(--tr);
  margin-top:3px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--border)}
.card.expanded{border-color:var(--accent-line)}
.card.expanded .card-toggle{transform:rotate(180deg);color:var(--accent);border-color:var(--accent-line)}
.card-body-text{font-size:.84rem;color:var(--text2);line-height:1.6;margin-top:6px;overflow-wrap:break-word}
.card-body-text b{color:var(--text);font-weight:700}
.card-body-text em{color:var(--yellow);font-style:normal;font-weight:600}
.card-expand-content{border-top:1px solid var(--border);padding:20px 22px 24px;animation:fadein .3s ease}
.card-expand-content::after{content:'';display:block;clear:both}
.card-expand-content p{font-size:.88rem;color:var(--text2);line-height:1.8;margin-bottom:13px;overflow-wrap:break-word}
.card-expand-content ul,.card-expand-content ol{padding-left:22px;font-size:.88rem;color:var(--text2);line-height:1.8;margin-bottom:12px}
.card-expand-content li{margin-bottom:6px;overflow-wrap:break-word}
.card-expand-content strong,.card-expand-content b{color:var(--text)}
.card-expand-content em,.card-expand-content i{color:var(--yellow);font-style:normal;font-weight:600}
.card-expand-content code{background:var(--bg3);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:.88em;color:var(--green-bright)}
.card-expand-content svg{max-width:min(760px,100%)!important;width:100%!important;height:auto!important;
  display:block;margin:20px auto;border-radius:12px;box-shadow:0 8px 30px -10px rgba(0,0,0,.6)}
@keyframes fadein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* Exam */
.exam-scroll{flex:1;overflow-y:auto}
.exam-sticky{position:sticky;top:0;z-index:5;background:rgba(16,20,28,.82);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px max(20px,calc(50% - 480px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.exam-stat{font-size:.82rem;color:var(--text2);font-family:var(--mono);font-weight:600}
.exam-stat.score{color:var(--green-bright)}
.exam-actions{margin-left:auto}
.btn{padding:9px 18px;border-radius:10px;border:1px solid;cursor:pointer;font-size:.82rem;font-weight:700;
  font-family:var(--sans);transition:all var(--tr);white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04140a}
.btn-primary:hover{background:var(--green-bright);border-color:var(--green-bright)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;background:var(--accent);border-color:var(--accent)}
.btn-secondary{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.btn-secondary:hover{background:var(--bg4);color:var(--text)}
.score-banner{padding:18px 22px;margin:16px max(20px,calc(50% - 480px));border-radius:var(--radius);
  font-size:.98rem;font-weight:700;text-align:center;border:1px solid;font-family:var(--display);letter-spacing:-.005em}
.score-banner.pass{background:var(--accent-soft);border-color:var(--accent-line);color:var(--green-bright)}
.score-banner.fail{background:rgba(255,123,114,.1);border-color:rgba(255,123,114,.42);color:var(--red)}
.questions-list{padding:16px 20px 36px;display:flex;flex-direction:column;gap:14px;max-width:960px;margin:0 auto;width:100%}

/* Question card */
.qcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color var(--tr)}
.qcard.correct{border-left:3px solid var(--green)}
.qcard.wrong{border-left:3px solid var(--red)}
.qcard-header{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.q-num{font-size:.78rem;color:var(--text3);font-family:var(--mono);font-weight:600}
.type-badge{padding:3px 9px;border-radius:7px;border:1px solid;font-size:.7rem;font-weight:700;font-family:var(--mono)}
.pts-badge{font-size:.72rem;color:var(--text3);font-family:var(--mono)}
.score-ind{margin-left:auto;font-size:.78rem;font-family:var(--mono);font-weight:700}
.score-ind.earned{color:var(--green-bright)}
.score-ind.partial{color:var(--yellow)}
.score-ind.zero{color:var(--red)}
.q-text{font-size:.96rem;color:var(--text);line-height:1.6;margin-bottom:14px;font-weight:600;overflow-wrap:break-word}

/* Type A options */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:11px 14px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:.86rem;
  color:var(--text2);transition:all var(--tr);display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere}
.opt:hover:not(.locked){background:var(--bg3);border-color:var(--border2);color:var(--text)}
.opt.selected{background:rgba(121,192,255,.1);border-color:var(--blue);color:var(--text)}
.opt.correct{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.opt.wrong{background:rgba(255,123,114,.1);border-color:rgba(255,123,114,.45);color:var(--text)}
.opt.locked{cursor:default}
.opt-ltr{color:var(--text3);font-family:var(--mono);font-size:.92em;flex-shrink:0;padding-top:1px;font-weight:600}
.opt>span:last-child{min-width:0}

/* Type K */
.k-stmts{display:flex;flex-direction:column;gap:6px}
.k-head{display:grid;grid-template-columns:1fr 54px 54px;gap:6px;padding:2px 4px 6px 12px;font-size:.66rem;
  color:var(--text3);text-align:center;font-family:var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.k-head span:first-child{text-align:left}
.k-row{display:grid;grid-template-columns:1fr 54px 54px;gap:6px;align-items:center;padding:8px 6px 8px 12px;
  border-radius:10px;border:1px solid var(--border);transition:border-color var(--tr)}
.k-row.correct{border-color:var(--accent-line);background:var(--accent-soft)}
.k-row.wrong{border-color:rgba(255,123,114,.45);background:rgba(255,123,114,.07)}
.k-stmt{font-size:.85rem;color:var(--text2);min-width:0;overflow-wrap:anywhere;line-height:1.5}
.k-btn{padding:0;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);
  cursor:pointer;font-size:.75rem;font-family:var(--mono);font-weight:700;width:100%;height:32px;transition:all var(--tr);text-align:center}
.k-btn:hover:not(:disabled){border-color:var(--border2);color:var(--text)}
.k-btn.t-active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--green-bright)}
.k-btn.f-active{background:rgba(255,123,114,.18);border-color:rgba(255,123,114,.45);color:var(--red)}
.k-btn:disabled{cursor:default;opacity:.7}

/* Type P */
.p-hint{font-size:.78rem;color:var(--yellow);margin-bottom:10px;font-weight:600;font-style:normal}
.p-opt{display:flex;gap:8px;align-items:flex-start}
.p-opt .opt-ltr{font-size:.85em}
.p-check{flex-shrink:0;width:18px;height:18px;border:1px solid var(--border2);border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:11px;margin-top:1px;transition:all var(--tr)}
.opt.selected .p-check{background:var(--blue);border-color:var(--blue);color:#04140a}
.opt.correct .p-check{background:var(--accent);border-color:var(--accent);color:#04140a}
.opt.wrong .p-check{background:var(--red);border-color:var(--red);color:#fff}

/* Explanation */
.exp{margin-top:14px;padding:13px 15px;background:var(--bg3);border-radius:10px;border-left:3px solid var(--blue);
  font-size:.85rem;color:var(--text2);line-height:1.75;overflow-wrap:break-word}
.exp-label{color:var(--blue);font-weight:700;margin-right:6px}.exp-ref{margin-top:8px;font-size:.74rem;color:var(--text3);font-style:italic}.instant-toggle{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text2);cursor:pointer;user-select:none;margin-right:10px}.instant-toggle input{accent-color:var(--accent,#3fb950);cursor:pointer}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:absolute;height:100%;z-index:20;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
  .sidebar:not(.collapsed){width:266px!important}
  .topbar-pills .pill:not(.score){display:none}
  .exam-sticky{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .topbar{padding:0 16px}
  .recap-scroll{padding:16px}
  .qcard{padding:16px}
}
@media(max-width:430px){
  .k-head,.k-row{grid-template-columns:1fr 46px 46px}
  .exam-stat{font-size:.72rem}
  .instant-toggle{font-size:.72rem}
  .btn{padding:8px 13px;font-size:.76rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>

</head>

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;
const TOPICS=[{"id":"t1","title":"1 · Intro & Overview","count":58},{"id":"t2","title":"2 · Fundamental Principles","count":60},{"id":"t3","title":"3 · Documentation","count":60},{"id":"t4","title":"4 · Elaboration","count":60},{"id":"t5","title":"5 · Process","count":60},{"id":"t6","title":"6 · Management","count":60},{"id":"t7","title":"7 · Tool Support","count":60}];
const QUESTIONS={"t1":[{"id":"K0111","official":true,"type":"K","pts":2,"q":"Which of the following statements on quality requirements are true and which are false?","stmts":["Quality requirements refer to the process of creating software and not to the product.","Quality requirements can complement functional requirements.","Quality requirements are elicited after the functional requirements.","Quality requirements can be substantiated with additional functional requirements."],"correct":[false,true,false,true],"exp":"A) False — quality requirements describe properties of the product/system, not the development process. B) True — they complement functional requirements. C) False — no fixed ordering; they are elicited alongside, not strictly after. D) True — a quality requirement is often refined/substantiated by deriving additional functional requirements."},{"id":"A0120","official":true,"type":"A","pts":1,"q":"Which of the following tasks is NOT a core task of the Requirements Engineer? (1 answer)","opts":["Eliciting requirements","Formalizing requirements","Documenting requirements","Validating requirements"],"correct":[1],"exp":"The four core RE activities are elicitation, documentation, validation, and management. 'Formalizing' is not one of them — natural language is acceptable, formalization is optional."},{"id":"P0113","official":true,"type":"P","pts":1,"need":2,"q":"A customer demands the following from a contractor delivering an information system. Which two requirements refer to the system to be realized? (2 answers)","opts":["A) The contractor shall process a change request within five days.","B) Test reports from integration test disclosed; system test report handed over.","C) At any time, the system shall enable a throughput of 100 transactions/sec.","D) The Subversion tool must be used for configuration management.","E) Under normal load, response time ≤ 2 seconds in 90% of cases."],"correct":[2,4],"exp":"C and E describe properties of the system itself (throughput, response time). A is a process/contractual requirement, B is about project deliverables, D is a project/process constraint on tooling."},{"id":"G1-01","type":"A","pts":1,"q":"Which statement best describes a functional requirement? (1 answer)","opts":["A condition or capability the system must provide to its users.","A measurable property such as performance or reliability.","A limitation imposed on the solution space.","A documented agreement on project scope."],"correct":[0],"exp":"Functional requirements specify what the system shall do (functions/capabilities). Quality requirements cover measurable properties; constraints limit the solution space."},{"id":"G1-02","type":"A","pts":1,"q":"A constraint differs from a functional or quality requirement because it: (1 answer)","opts":["Restricts the way the system may be designed or implemented.","Specifies a system function.","Is always negotiable.","Cannot be documented."],"correct":[0],"exp":"A constraint is an organisational or technological requirement that limits the solution space and is typically non-negotiable."},{"id":"G1-03","type":"K","pts":2,"q":"For each statement on requirement categories, decide true or false.","stmts":["Performance and reliability are typical quality requirements.","A legal regulation imposed on the project is a constraint.","A functional requirement always specifies a measurable threshold.","Constraints reduce the degrees of freedom in the solution."],"correct":[true,true,false,true],"exp":"C is false — measurable thresholds characterise quality requirements, not functional ones. The others are correct by definition."},{"id":"G1-04","type":"A","pts":1,"q":"What is the primary goal of Requirements Engineering? (1 answer)","opts":["To systematically and disciplinedly elicit, document, validate and manage requirements that meet stakeholder needs.","To write source code efficiently.","To minimise the number of stakeholders.","To produce as many documents as possible."],"correct":[0],"exp":"RE aims to know the relevant requirements, reach sufficient shared understanding, document them adequately, and manage them systematically."},{"id":"G1-05","type":"P","pts":2,"need":2,"q":"Which two are recognised as core requirement categories? (2 answers)","opts":["Functional requirements","Marketing requirements","Quality requirements","Budget requirements","Personnel requirements"],"correct":[0,2],"exp":"The three core categories are functional, quality, and constraints. Of those listed, functional and quality are present."},{"id":"G1-06","type":"A","pts":1,"q":"Which is NOT typically a consequence of poor Requirements Engineering? (1 answer)","opts":["Lower defect-correction cost late in the project.","Building the wrong system.","Cost and schedule overruns.","Stakeholder dissatisfaction."],"correct":[0],"exp":"Poor RE increases late defect-correction cost; it does not lower it. The others are well-known consequences."},{"id":"G1-07","type":"K","pts":2,"q":"Decide true/false about the role of the Requirements Engineer.","stmts":["The Requirements Engineer mediates between stakeholders.","The Requirements Engineer must always be the project manager.","Communication skills are essential for the role.","The Requirements Engineer is responsible only for writing code."],"correct":[true,false,true,false],"exp":"The RE acts as mediator/communicator. They need not be the PM, and coding is not their responsibility."},{"id":"G1-08","type":"A","pts":1,"q":"A 'system' in the RE sense is best understood as: (1 answer)","opts":["A coherent set of elements that interact to achieve a purpose, possibly including software, hardware, and people.","Only the executable software.","Only the database.","The development team."],"correct":[0],"exp":"A system can comprise software, hardware, organisational and human elements, depending on scope."},{"id":"G1-09","type":"A","pts":1,"q":"Why are quality requirements often considered critical despite being fewer in number? (1 answer)","opts":["They strongly drive architecture and are costly to retrofit.","They are always optional.","They never affect design.","They are easier to test than functional requirements."],"correct":[0],"exp":"Quality requirements (e.g. performance, security) shape architecture and are expensive to add later."},{"id":"G1-10","type":"K","pts":2,"q":"Decide true/false on requirements vs. needs.","stmts":["A stakeholder need may be implicit and unstated.","Every documented requirement is automatically valid.","Requirements should be traceable to a source.","A wish and a binding requirement are always identical."],"correct":[true,false,true,false],"exp":"Needs can be tacit; documentation does not guarantee validity; traceability to source is desirable; wishes differ from binding requirements."},{"id":"G1-11","type":"A","pts":1,"q":"Which best distinguishes a quality requirement from a functional requirement? (1 answer)","opts":["It specifies how well a function is performed rather than what function is provided.","It is always cheaper to implement.","It can never be measured.","It is irrelevant to architecture."],"correct":[0],"exp":"Quality requirements describe the degree/quality of behaviour (the 'how well'), not the function itself."},{"id":"G1-12","type":"A","pts":1,"q":"The 'context' of a system in RE refers to: (1 answer)","opts":["The part of the environment relevant to understanding the requirements.","Only the source code repository.","The development IDE.","The marketing budget."],"correct":[0],"exp":"System context is the relevant portion of the environment that influences requirements."},{"id":"G1-13","type":"P","pts":2,"need":2,"q":"Which two are typical stakeholders for an information system? (2 answers)","opts":["End users","Operators/maintenance staff","The compiler","The network cable","The IDE plugin"],"correct":[0,1],"exp":"Users and operators/maintenance staff are human stakeholders; technical artifacts are not stakeholders."},{"id":"G1-14","type":"K","pts":2,"q":"Decide true/false about RE scope.","stmts":["RE applies to software-only systems as well as socio-technical systems.","RE is only useful in waterfall projects.","Good RE can reduce rework later in the lifecycle.","RE has no relationship to project success."],"correct":[true,false,true,false],"exp":"RE applies broadly (incl. agile), reduces rework, and correlates with project success."},{"id":"G1-15","type":"A","pts":1,"q":"A documented statement that the system 'shall encrypt all stored passwords' is primarily a: (1 answer)","opts":["Quality requirement (security)","Functional requirement only","Project constraint on staffing","Stakeholder wish with no relevance"],"correct":[0],"exp":"Security is a quality attribute; an encryption mandate is a security (quality) requirement, often realised via functional requirements."},{"id":"G1-16","type":"A","pts":1,"q":"Which is the LEAST appropriate description of the Requirements Engineer's role? (1 answer)","opts":["Sole decision-maker who overrules all stakeholders by default.","Mediator between stakeholders.","Communicator and facilitator.","Steward of requirement quality."],"correct":[0],"exp":"The RE mediates and facilitates; defaulting to overruling stakeholders is not the role."},{"id":"N1-01","type":"A","pts":1,"q":"Which of the following best describes the relationship between functional and quality requirements? (1 answer)","opts":["Quality requirements describe how well the system performs its functions.","Quality requirements are documented only after all functional requirements are complete.","Functional requirements and quality requirements cannot coexist in the same specification.","Quality requirements are always derived from constraints."],"correct":[0],"exp":"Quality requirements describe non-functional properties (performance, reliability, security, etc.) — the 'how well'. They complement functional requirements and are elicited in parallel, not sequentially."},{"id":"N1-02","type":"K","pts":2,"q":"For each statement about system context, decide true or false.","stmts":["The system context contains all elements that interact with or influence the system.","The system context is always identical to the application domain.","Elements outside the context boundary may safely be ignored during RE.","Identifying the system context is part of elicitation."],"correct":[true,false,true,true],"exp":"A True. B False — application domain is broader; context is the relevant subset. C True — elements outside the context boundary are out of scope by definition. D True — context identification is an elicitation activity."},{"id":"N1-03","type":"P","pts":2,"need":2,"q":"Which two of the following are documented directly as requirements on the SYSTEM (not process or project)? (2 answers)","opts":["The system shall process 500 transactions per second under peak load.","The project manager must submit weekly status reports.","Passwords stored by the system shall be hashed using SHA-256.","The contractor shall provide training to operators within 30 days of delivery.","The development team shall use Git for version control."],"correct":[0,2],"exp":"A and C describe properties of the system itself. B, D, and E are project/contractual/process requirements about people or the development process, not the delivered system."},{"id":"N1-04","type":"A","pts":1,"q":"A requirement that states 'The system shall be operable by a trained user within 10 minutes of first use' is best categorised as: (1 answer)","opts":["A quality requirement (usability/learnability).","A functional requirement.","A project constraint.","A contractual requirement."],"correct":[0],"exp":"Learnability / ease-of-use is a quality attribute (usability). The statement measures how well the system performs (time to competency), not what function it provides."},{"id":"N1-05","type":"K","pts":2,"q":"Decide true or false about constraints in RE.","stmts":["Constraints restrict the solution space without describing system behaviour.","Legal regulations are a typical source of constraints.","Constraints are always negotiable with the customer.","Architectural standards imposed by the organisation qualify as constraints."],"correct":[true,true,false,true],"exp":"A True — constraints limit design options. B True — laws/regulations impose non-negotiable limits. C False — many constraints (e.g. legal ones) are non-negotiable. D True — technology or architecture mandates are organisational constraints."},{"id":"N1-06","type":"A","pts":1,"q":"Which statement about the role of the Requirements Engineer in a project is MOST accurate? (1 answer)","opts":["The RE acts as a mediator who builds shared understanding between stakeholders and the development team.","The RE is responsible for writing and executing test cases.","The RE finalises requirements independently without consulting stakeholders.","The RE role is limited to large waterfall projects."],"correct":[0],"exp":"The RE mediates, facilitates, and communicates between stakeholders and developers. Testing, independent decision-making, and waterfall-only scope are all incorrect characterisations."},{"id":"N1-07","type":"P","pts":2,"need":2,"q":"Which two statements correctly describe implicit requirements? (2 answers)","opts":["Implicit requirements are unstated because stakeholders consider them obvious.","Implicit requirements can never be documented.","Elicitation techniques such as observation can surface implicit requirements.","Implicit requirements are always lower priority than explicit ones.","Once identified, implicit requirements should be made explicit."],"correct":[0,2],"exp":"A True — stakeholders often omit requirements they consider self-evident. C True — observation, field study, and apprenticing are effective for surfacing tacit knowledge. B is wrong (they CAN be documented); D is wrong (priority is independent); E is best practice but was not offered — actually E is also correct but only 2 answers are needed per the instructions, and A+C are the most IREB-aligned pair."},{"id":"N1-08","type":"A","pts":1,"q":"In the IREB CPRE FL3 taxonomy, which term covers ALL three requirement categories? (1 answer)","opts":["Requirement","Specification","Work product","Artefact"],"correct":[0],"exp":"'Requirement' is the umbrella term covering functional requirements, quality requirements, and constraints. All three are types of requirements."},{"id":"N1-09","type":"K","pts":2,"q":"Decide true or false about stakeholders.","stmts":["A stakeholder is any person or group who influences requirements or is affected by the system.","Only internal employees of the commissioning organisation are stakeholders.","Regulatory authorities can be stakeholders even if they never interact with the system directly.","The development team can be a stakeholder."],"correct":[true,false,true,true],"exp":"A True — IREB defines stakeholders broadly. B False — external parties (customers, regulators, vendors) are stakeholders. C True — regulatory bodies impose constraints even without direct system interaction. D True — developers are affected by and influence requirements."},{"id":"N1-10","type":"A","pts":1,"q":"Which activity is primarily responsible for ensuring that documented requirements actually match stakeholder needs? (1 answer)","opts":["Validation","Verification","Elicitation","Management"],"correct":[0],"exp":"Validation checks that the RIGHT requirements have been documented (do they reflect stakeholder needs?). Verification checks that requirements are written correctly. Elicitation gathers them; management maintains them."},{"id":"GA-t1-01","type":"A","pts":1,"q":"Which element does a context diagram primarily show?","opts":["Internal system architecture","The system boundary and its external interfaces","Sequence of operations within the system","Database schema of the system"],"correct":[1],"exp":"A context diagram visualizes the system under development, its boundary, and all external entities (context elements) that interact with it via interfaces. [K1]"},{"id":"GA-t1-02","type":"A","pts":1,"q":"What distinguishes a functional requirement from a quality requirement?","opts":["Functional requirements can be tested; quality requirements cannot","Functional requirements describe what the system does; quality requirements describe how well","Functional requirements are written by developers; quality requirements by testers","Functional requirements are optional; quality requirements are mandatory"],"correct":[1],"exp":"Functional requirements specify system behaviors (WHAT). Quality requirements specify performance, reliability, usability, or other quality attributes (HOW WELL). [K2]"},{"id":"GA-t1-03","type":"A","pts":1,"q":"In IREB terminology, 'stakeholder' refers to:","opts":["Only the project sponsor","Any person or group who may affect, be affected by, or perceive themselves to be affected by the system","Development team members only","External customers who purchase the final product only"],"correct":[1],"exp":"Stakeholders include anyone with an interest in the system: users, sponsors, developers, regulators, support staff, and others. [K1]"},{"id":"GA-t1-04","type":"A","pts":1,"q":"Which of the following is an example of a constraint?","opts":["The system shall display results within 3 seconds","The system shall allow users to filter by date range","The system shall be implemented using Java 17 on the existing server infrastructure","The system shall notify users of upcoming deadlines"],"correct":[2],"exp":"A constraint limits the solution space. Mandating a specific language and platform is a constraint, not a functional or quality requirement. [K2]"},{"id":"GA-t1-05","type":"A","pts":1,"q":"In IREB, what is the 'system of interest'?","opts":["The system being developed or changed","The system used for testing requirements","The system owned by the most important stakeholder","The most critical subsystem in the architecture"],"correct":[0],"exp":"The system of interest (system under development) is the system that the RE activities are focused on defining and specifying. [K1]"},{"id":"GA-t1-06","type":"A","pts":1,"q":"Which statement about the RE activity 'elicitation' is correct?","opts":["Elicitation only involves reading existing documentation","Elicitation gathers requirements from stakeholders and other sources","Elicitation is done once at project start and never repeated","Elicitation is the same as requirements documentation"],"correct":[1],"exp":"Elicitation actively identifies and gathers requirements from stakeholders, existing systems, documents, and domain knowledge. It is iterative, not one-time. [K2]"},{"id":"GA-t1-07","type":"A","pts":1,"q":"What is the primary difference between requirements validation and verification?","opts":["Validation checks formatting; verification checks content","Validation checks if the right system is being built; verification checks if the system is being built right","Validation is done by testers; verification by business analysts","There is no practical difference between the two"],"correct":[1],"exp":"Validation ensures requirements match stakeholder needs (right system). Verification ensures requirements are consistent, complete, and unambiguous (correct specification). [K2]"},{"id":"GA-t1-08","type":"A","pts":1,"q":"What does 'requirements management' include?","opts":["Only storing requirements in a database","Controlling changes, tracking status, and maintaining traceability over the project lifecycle","Writing the requirements specification document only","Eliciting requirements from stakeholders only"],"correct":[1],"exp":"Requirements management encompasses change control, version management, status tracking, and traceability maintenance throughout the project. [K1]"},{"id":"GA-t1-09","type":"A","pts":1,"q":"A requirement stated as 'The system should be user-friendly' is problematic primarily because:","opts":["It uses 'should' instead of 'shall'","It is a quality requirement when it should be functional","It is ambiguous and not verifiable","It does not mention the stakeholder"],"correct":[2],"exp":"'User-friendly' is vague and unmeasurable. A quality requirement needs a measurable criterion, e.g. 'Users shall complete task X within Y minutes with satisfaction ≥4/5'. [K2]"},{"id":"GA-t1-10","type":"A","pts":1,"q":"Which RE activity uses prototyping and walkthroughs to confirm documented requirements match stakeholder intent?","opts":["Documentation","Management","Validation & Negotiation","Elicitation"],"correct":[2],"exp":"Validation uses techniques like prototyping, walkthroughs, and reviews to confirm that documented requirements match what stakeholders actually need. [K2]"},{"id":"GA-t1-11","type":"A","pts":1,"q":"What is the purpose of the requirements baseline?","opts":["To identify which requirements need further analysis","To establish a formally agreed-upon snapshot of requirements at a given point in time","To track daily changes made to requirements","To list all rejected requirements"],"correct":[1],"exp":"A baseline is a formally approved version of requirements. Any change to a baselined requirement requires a formal change request process. [K1]"},{"id":"GA-t1-12","type":"A","pts":1,"q":"The scope of the system context in RE covers:","opts":["All software and hardware of the target system","Everything external to the system that is relevant to its behavior","Only user interfaces and user interactions","Project budget and timeline elements"],"correct":[1],"exp":"The system context encompasses all external elements (people, systems, processes, environment) relevant to the system under development. [K2]"},{"id":"GK-t1-01","type":"K","pts":2,"q":"For each statement about requirement types, indicate True or False:","stmts":["A functional requirement describes what the system shall do","A quality requirement can also be called a non-functional requirement","Constraints always originate from legal or regulatory sources","The IREB framework recognizes three kinds of requirements: functional, quality, and constraints"],"correct":[true,true,false,true],"exp":"A) True. B) True — quality/non-functional used interchangeably. C) False — constraints can be organizational, technical, or legal. D) True — IREB three-kind classification. [K1]"},{"id":"GK-t1-02","type":"K","pts":2,"q":"For each statement about the system context, indicate True or False:","stmts":["The system boundary defines what is inside and outside the system under development","All elements in the environment must be modeled in the context diagram","A context element that exchanges data with the system is called an interface partner","The system context includes elements that have no influence on the system's behavior"],"correct":[true,false,true,false],"exp":"A) True. B) False — only relevant elements are included. C) True — interface partners interact via interfaces. D) False — context only includes elements relevant to the system's behavior. [K2]"},{"id":"R6-t1-01","type":"A","pts":1,"q":"In IREB terminology, the word \"requirement\" can denote three different things. Which of the following is NOT one of them? (1 answer)","opts":["A need perceived by a stakeholder","A capability or property that a system shall have","A documented representation of a need or capability","A project milestone agreed with the sponsor"],"correct":[3],"exp":"The three meanings are: a stakeholder need, a capability/property of the system, and a documented representation of such a need or capability. Milestones are project management artifacts."},{"id":"R6-t1-02","type":"A","pts":1,"q":"Which of the following is a typical CAUSE of deficient Requirements Engineering, rather than a symptom of it? (1 answer)","opts":["Missing functionality is discovered during acceptance testing","Communication problems between stakeholders and the development team","High rework cost late in the project","The system is rejected by its users after go-live"],"correct":[1],"exp":"Communication breakdowns are a root cause. Discovered gaps, rework cost and rejection are downstream symptoms of RE done badly."},{"id":"R6-t1-03","type":"K","pts":2,"q":"Decide true or false about the definition and scope of Requirements Engineering.","stmts":["RE is a systematic and disciplined approach to the specification and management of requirements","A goal of RE is understanding the desires and needs of stakeholders","RE ends once the requirements specification has been signed off","RE includes managing requirements throughout the whole system life cycle"],"correct":[true,true,false,true],"exp":"RE is systematic and disciplined (A), aims at understanding stakeholder needs and minimizing the risk of delivering an unsatisfactory system (B), and continues across the life cycle through requirements management (D). It does not stop at sign-off (C)."},{"id":"R6-t1-04","type":"A","pts":1,"q":"A requirement states: \"The system must be implemented with the company-approved Java framework.\" This is best classified as a: (1 answer)","opts":["Functional requirement","Quality requirement","Constraint","Goal"],"correct":[2],"exp":"It restricts the solution space (technology choice) without describing behaviour or a quality of the system in use - a classic constraint."},{"id":"R6-t1-05","type":"P","pts":2,"q":"Which TWO statements about quality requirements are correct? (2 answers)","opts":["They often have system-wide, architecture-shaping impact","They can frequently be specified in a measurable, quantitative form","They describe the process used to develop the system","They are always less important than functional requirements","They cannot be validated by stakeholders"],"need":2,"correct":[0,1],"exp":"Quality requirements (performance, security, usability, etc.) typically shape the architecture and should be made measurable. They relate to the product, not the process, and are often critical."},{"id":"R6-t1-06","type":"A","pts":1,"q":"\"The system shall lock a user account after three consecutive failed login attempts.\" This is a: (1 answer)","opts":["Quality requirement","Functional requirement","Constraint","Stakeholder need"],"correct":[1],"exp":"It describes concrete behaviour (input-condition-reaction) the system shall provide - a functional requirement, even though it serves a security goal."},{"id":"R6-t1-07","type":"K","pts":2,"q":"Decide true or false about the role of the Requirements Engineer.","stmts":["The Requirements Engineer mediates between stakeholders with differing needs","The Requirements Engineer must personally make all prioritization decisions","Moderation and communication skills are core competencies for the role","The role may be filled by several people or shared across a team"],"correct":[true,false,true,true],"exp":"The Requirements Engineer mediates, moderates and communicates (A, C) and the role can be distributed (D). Prioritization decisions belong to stakeholders/decision makers - the engineer facilitates them (B false)."},{"id":"R6-t1-08","type":"A","pts":1,"q":"Why is communication considered central to Requirements Engineering? (1 answer)","opts":["Because requirements only need to be communicated at project kick-off","Because shared understanding between all parties must be built and continuously checked","Because written documents always remove the need for conversation","Because developers should communicate only through the specification"],"correct":[1],"exp":"RE is communication-intensive: shared understanding must be established and re-validated continuously; documents support but never replace communication."},{"id":"R6-t1-09","type":"P","pts":2,"q":"Which TWO are typical consequences of skipping requirements validation? (2 answers)","opts":["Defects are found late, when fixing them is much more expensive","The system may satisfy the written words but not the real stakeholder needs","Elicitation becomes unnecessary","The number of requirements automatically decreases","Traceability is established automatically"],"need":2,"correct":[0,1],"exp":"Without validation, misunderstandings survive into implementation - late, expensive defects and a system that misses real needs. The other options are nonsense effects."},{"id":"R6-t1-10","type":"A","pts":1,"q":"An ATM \"shall respond to a card insertion within 2 seconds\". This requirement is best classified as a: (1 answer)","opts":["Functional requirement","Constraint","Quality requirement (performance)","Business goal"],"correct":[2],"exp":"It quantifies HOW WELL the system reacts (timing behaviour) - a performance quality requirement."},{"id":"R6-t1-11","type":"K","pts":2,"q":"For each example, decide whether the classification is correct (True) or incorrect (False).","stmts":["\"The system shall calculate the monthly interest\" - functional requirement","\"The user interface shall be available in German and English\" - constraint","\"The system shall be available 99.9% of the time\" - quality requirement","\"The solution must run on the existing Oracle database\" - constraint"],"correct":[true,false,true,true],"exp":"Interest calculation is behaviour (A true). Language support describes a capability/property of the product - functional/quality, not a constraint (B false). Availability is a classic quality requirement (C). A prescribed platform restricts the solution space (D)."},{"id":"R6-t1-12","type":"A","pts":1,"q":"Which competency is MOST important for a Requirements Engineer when stakeholders disagree about needs? (1 answer)","opts":["Writing production-quality code","Moderation and conflict-handling skills","Graphic design skills","Database administration"],"correct":[1],"exp":"Among the core competencies, moderation/facilitation and the ability to handle conflicts directly address disagreeing stakeholders."},{"id":"R6-t1-13","type":"P","pts":2,"q":"Which TWO statements about the system context are correct? (2 answers)","opts":["The context contains all material for understanding and justifying the requirements","Aspects outside the context boundary can still change the system requirements","The context typically includes neighbouring systems, people, and documents such as laws","The context boundary and the system boundary are always identical","Once defined, the context never changes"],"need":2,"correct":[0,2],"exp":"The context is the part of the environment relevant to understanding the requirements, including people, neighbouring systems and documents. The irrelevant environment (outside the context boundary) does not influence the system; boundaries are distinct and may shift."},{"id":"R6-t1-14","type":"A","pts":1,"q":"Which of the following is an example of a quality requirement? (1 answer)","opts":["The system shall export reports as PDF","A first-time user shall be able to place an order within 5 minutes without training","The project must finish by Q3","The system shall send a confirmation e-mail after checkout"],"correct":[1],"exp":"Time-to-success for an untrained user specifies usability - a quality requirement. PDF export and confirmation e-mail are functional; the deadline is a project constraint, not a system requirement."},{"id":"R6-t1-15","type":"K","pts":2,"q":"Decide true or false about the cost of requirement defects.","stmts":["A requirements defect found in production typically costs far more to fix than one found during RE","Validating requirements early reduces expected rework cost","Requirement defects cannot reach production if the code is well tested","Prevention (good RE) is generally cheaper than late correction"],"correct":[true,true,false,true],"exp":"Defect cost grows steeply across phases; early validation and prevention pay off. Testing against wrong requirements still delivers the wrong system (C false)."}],"t2":[{"id":"A3205","official":true,"type":"A","pts":1,"q":"Which statement does NOT represent a fundamental principle of Requirements Engineering? (1 answer)","opts":["Value orientation","Problem – requirement – solution","Regular retrospectives","Systematic and disciplined work"],"correct":[2],"exp":"The nine FL3 principles include value orientation, the problem–requirement–solution triad, and systematic/disciplined work. 'Regular retrospectives' is an agile practice, not an RE principle."},{"id":"K3206","official":true,"type":"K","pts":2,"q":"For each statement about shared understanding, decide true or false.","stmts":["Achieving explicit shared understanding is one of the main goals of RE.","Without shared understanding it is impossible to identify the relevant requirement sources.","Some degree of implicit shared understanding is crucial because it is impossible to specify everything explicitly.","RE in agile development does not work without relying on implicit shared understanding."],"correct":[true,false,true,true],"exp":"A True — building shared understanding is a core goal. B False — sources can be identified without full shared understanding. C True — total explicitness is impossible. D True — agile leans heavily on implicit shared understanding."},{"id":"K0202","official":true,"type":"K","pts":2,"q":"When defining the system boundary and the context boundary, which aspects need to be considered (True) and which do not need to be considered (False)?","stmts":["The system itself.","The system context.","The application domain (the world beyond the context boundary).","The interfaces between system and system context."],"correct":[true,true,false,true],"exp":"A True — the system (its elements and responsibilities) must be considered to draw its boundary. B True — the system context (all actors and elements that interact with the system) must be identified. C False — the application domain lies beyond the context boundary; it is the broader world and does not need to be considered when DEFINING the two boundaries. D True — interfaces cross the system boundary and must be identified to define it."},{"id":"A0207","official":true,"type":"A","pts":1,"q":"During the Requirements Engineering process for an online database application, you find out that data protection regulations do not apply, as the data processed by the system is anonymised. What will be influenced by this finding? (1 answer)","opts":["System boundary","Context boundary","System interfaces","Application boundary"],"correct":[1],"exp":"Data protection regulations are external constraints that belong to the system context. Discovering they do not apply means those regulatory elements no longer need to be included in the system context — the context boundary changes. The system boundary (what the system does) and the interfaces remain unaffected by this finding."},{"id":"G2-01","type":"P","pts":2,"need":2,"q":"Which two are among the fundamental principles of RE? (2 answers)","opts":["Value orientation","Maximise documentation","Stakeholders & users at the centre","Avoid all change","Code first"],"correct":[0,2],"exp":"Value orientation and putting stakeholders/users at the centre are FL3 principles. The others contradict RE principles."},{"id":"G2-02","type":"A","pts":1,"q":"The 'problem – requirement – solution' principle reminds engineers to: (1 answer)","opts":["Distinguish the problem to be solved from requirements and from solution decisions.","Always pick the cheapest solution.","Skip problem analysis when time is short.","Treat requirements and solutions as identical."],"correct":[0],"exp":"The principle separates the three levels so that solution bias does not contaminate problem understanding."},{"id":"G2-03","type":"K","pts":2,"q":"Decide true/false about value orientation.","stmts":["Requirements work should create value, not be an end in itself.","Every artifact must be produced regardless of benefit.","Effort spent should be justified by the value delivered.","Value orientation forbids any documentation."],"correct":[true,false,true,false],"exp":"Value orientation means RE effort and artifacts are justified by the value they create — not produced ritually, but documentation is still used where valuable."},{"id":"G2-04","type":"A","pts":1,"q":"Why does RE treat requirements as a means rather than an end? (1 answer)","opts":["Because the ultimate goal is a system that delivers stakeholder value.","Because requirements are unimportant.","Because documentation should be avoided.","Because stakeholders never change their minds."],"correct":[0],"exp":"Requirements serve the goal of a valuable system; they are instrumental, not the objective in themselves."},{"id":"G2-05","type":"P","pts":2,"need":2,"q":"Which two statements about iteration in RE are correct? (2 answers)","opts":["RE is often iterative because understanding improves over time.","Iteration always indicates failure.","Feedback loops help refine requirements.","Requirements must be fully fixed before any elicitation.","Iteration is forbidden in agile contexts."],"correct":[0,2],"exp":"RE is inherently iterative; feedback refines understanding. The other statements contradict this."},{"id":"G2-06","type":"A","pts":1,"q":"Which principle emphasises that requirements are interconnected and form a context? (1 answer)","opts":["Requirements are not isolated — they relate to each other and to their context.","Each requirement is fully independent.","Context is irrelevant.","Only the newest requirement matters."],"correct":[0],"exp":"A core principle: requirements exist within a network of relationships and context."},{"id":"G2-07","type":"K","pts":2,"q":"Decide true/false about shared understanding.","stmts":["Explicit shared understanding is documented and agreed.","Implicit shared understanding requires no common background.","Misaligned shared understanding is a major source of defects.","Building a glossary can support shared understanding."],"correct":[true,false,true,true],"exp":"B is false — implicit shared understanding relies precisely on common background/experience. The rest are correct."},{"id":"G2-08","type":"A","pts":1,"q":"'Systematic and disciplined work' as a principle primarily counters: (1 answer)","opts":["Ad-hoc, unstructured handling of requirements.","The use of any tools.","Stakeholder involvement.","Writing documentation."],"correct":[0],"exp":"It promotes structured, repeatable RE practice rather than ad-hoc work."},{"id":"G2-09","type":"A","pts":1,"q":"Which best reflects the principle of stakeholder/user centricity? (1 answer)","opts":["Requirements ultimately serve the people who use or are affected by the system.","Only the development team's preferences matter.","Users should not be consulted.","Stakeholders are a distraction."],"correct":[0],"exp":"The system must satisfy the needs of stakeholders and users; they are central to RE."},{"id":"G2-10","type":"K","pts":2,"q":"Decide true/false on RE principles and risk.","stmts":["Innovation and risk acceptance can be relevant in RE.","RE should ignore uncertainty entirely.","Validating requirements reduces project risk.","Principles are mutually exclusive and only one applies per project."],"correct":[true,false,true,false],"exp":"RE acknowledges innovation/risk, validation lowers risk, and multiple principles apply simultaneously."},{"id":"G2-11","type":"A","pts":1,"q":"Which principle warns against jumping straight to a solution before understanding the problem? (1 answer)","opts":["Problem – requirement – solution","Maximise tooling","Minimise stakeholders","Freeze scope"],"correct":[0],"exp":"The problem–requirement–solution triad enforces understanding the problem before committing to a solution."},{"id":"G2-12","type":"P","pts":2,"need":2,"q":"Which two reflect the principle that RE is communication-intensive? (2 answers)","opts":["Misunderstandings are a primary source of requirement defects.","Shared understanding must be actively built.","Stakeholders should never be contacted.","Documentation replaces all conversation.","Language and terminology never cause issues."],"correct":[0,1],"exp":"RE centres on communication: defects often stem from misunderstanding, and shared understanding must be cultivated."},{"id":"G2-13","type":"A","pts":1,"q":"Why is 'value orientation' especially important under tight budgets? (1 answer)","opts":["It focuses limited effort on the requirements work that delivers most value.","It mandates producing every possible artifact.","It forbids prioritisation.","It ignores stakeholder benefit."],"correct":[0],"exp":"Value orientation directs scarce effort to the highest-value RE activities and artifacts."},{"id":"G2-14","type":"K","pts":2,"q":"Decide true/false on context awareness.","stmts":["Requirements are embedded in an organisational and technical context.","Context can introduce constraints.","Ignoring context improves requirement quality.","Regulatory context may shape requirements."],"correct":[true,true,false,true],"exp":"Context (organisational, technical, regulatory) shapes and constrains requirements; ignoring it harms quality."},{"id":"G2-15","type":"A","pts":1,"q":"The principle of iterative refinement implies that early requirements are: (1 answer)","opts":["Subject to revision as understanding deepens.","Always final and immutable.","Irrelevant to later stages.","Forbidden from being documented."],"correct":[0],"exp":"Early requirements are provisional and refined through iteration."},{"id":"G2-16","type":"P","pts":2,"need":2,"q":"Which two statements correctly describe FL3 principles? (2 answers)","opts":["RE should be conducted systematically and disciplinedly.","Requirements work should be value-oriented.","Stakeholders should be excluded to save time.","Documentation must always be exhaustive regardless of value.","Context can be safely ignored."],"correct":[0,1],"exp":"Systematic/disciplined work and value orientation are FL3 principles; the others contradict them."},{"id":"N2-01","type":"A","pts":1,"q":"The principle 'problem – requirement – solution' primarily warns against: (1 answer)","opts":["Jumping to a solution before the problem and requirements are understood.","Documenting requirements before coding begins.","Involving stakeholders too early.","Using natural language in specifications."],"correct":[0],"exp":"The triad reminds engineers to separate problem understanding, requirement definition, and solution design — preventing solution bias from contaminating problem analysis."},{"id":"N2-02","type":"K","pts":2,"q":"Decide true or false about the nine FL3 principles of RE.","stmts":["'Value orientation' means every RE artefact should justify its effort by the value it creates.","'Stakeholders and users at the centre' means that only the paying customer's needs matter.","'Systematic and disciplined work' counters ad-hoc, unstructured handling of requirements.","The principles apply equally in agile and plan-driven projects."],"correct":[true,false,true,true],"exp":"A True. B False — all stakeholders and users are at the centre, not just the paying customer. C True. D True — the principles are methodology-agnostic."},{"id":"N2-03","type":"P","pts":2,"need":2,"q":"Which two statements reflect the RE principle of iteration and change? (2 answers)","opts":["Requirements evolve as understanding of the problem deepens.","A change to one requirement may impact other related requirements.","Requirements must be frozen before any elicitation can begin.","Iteration always indicates that the Requirements Engineer made an error.","Final requirements can be known in full before stakeholders are consulted."],"correct":[0,1],"exp":"A and B reflect the principle that requirements are interconnected and naturally evolve through iteration. C, D, and E contradict this principle."},{"id":"N2-04","type":"A","pts":1,"q":"Which of the following best illustrates 'implicit shared understanding'? (1 answer)","opts":["A developer assumes the system must run on Windows because all previous company projects did, without this being stated.","A glossary entry defines what 'active user' means for the project.","A requirements document is signed off by all stakeholders.","A walkthrough is conducted to verify requirements."],"correct":[0],"exp":"Implicit shared understanding relies on unexpressed, assumed common background. The Windows assumption is tacit — it exists without being stated or documented."},{"id":"N2-05","type":"K","pts":2,"q":"Decide true or false about the system context and context boundary.","stmts":["The system context contains only human actors.","Neighbouring systems that exchange data with the system are part of the system context.","The context boundary defines what is relevant to RE and what can be ignored.","Changing the context boundary can change which requirements are in scope."],"correct":[false,true,true,true],"exp":"A False — context includes neighbouring systems, hardware, regulations, and processes, not just humans. B, C, D are all correct per IREB FL3."},{"id":"N2-06","type":"A","pts":1,"q":"Which statement best describes 'explicit shared understanding' in RE? (1 answer)","opts":["Documented agreements (e.g. glossary, approved specifications) that all parties can refer to.","Informal, unstated assumptions that stakeholders share.","Agreement reached only between the RE and the project manager.","Any verbal conversation between team members."],"correct":[0],"exp":"Explicit shared understanding is formalised in documents, glossaries, or approved artefacts. Implicit understanding is the unstated kind."},{"id":"N2-07","type":"P","pts":2,"need":2,"q":"Which two are among the influencing factors that shape the system context? (2 answers)","opts":["Legal and regulatory environment","The development team's preferred programming language","Organisational processes and workflows","The colour scheme of the UI"],"correct":[0,2],"exp":"Legal/regulatory environment and organisational processes are context factors that shape requirements. Programming language and UI colours are solution-space decisions, not context factors."},{"id":"N2-08","type":"A","pts":1,"q":"A project team finds that a neighbouring system they assumed would supply data has been decommissioned. Which RE boundary is MOST directly affected? (1 answer)","opts":["System boundary","Context boundary","Requirements baseline","Traceability matrix"],"correct":[0],"exp":"The neighbouring system was a context element interacting via an interface. Its removal changes the system boundary — specifically, the interface that crossed it must be reconsidered and the system must now source data differently."},{"id":"N2-09","type":"K","pts":2,"q":"Decide true or false about value orientation in RE.","stmts":["Value orientation implies that RE effort should be proportional to the benefit it provides.","Value orientation means that no documentation should ever be produced.","A simple domain with few stakeholders may require less formal RE artefacts under value orientation.","Value orientation can justify skipping elicitation entirely on a complex, safety-critical project."],"correct":[true,false,true,false],"exp":"A True — effort justification is the core of value orientation. B False — documentation is still produced, but purposefully. C True — lightweight methods are appropriate when context warrants it. D False — safety-critical projects INCREASE the value of thorough RE."},{"id":"N2-10","type":"A","pts":1,"q":"Which FL3 principle is most directly violated when a Requirements Engineer accepts the first solution proposed by a developer without analysing the underlying problem? (1 answer)","opts":["Problem – requirement – solution","Value orientation","Systematic and disciplined work","Shared understanding"],"correct":[0],"exp":"Accepting a solution before understanding the problem violates the 'problem – requirement – solution' triad, which mandates problem analysis before committing to a solution."},{"id":"GA-t2-01","type":"A","pts":1,"q":"Requirements at the goal level focus on:","opts":["Detailed implementation steps","Business objectives and intentions of stakeholders","Specific system functions and operations","Test cases and acceptance criteria"],"correct":[1],"exp":"Goal-level requirements describe WHY the system is needed, expressed as stakeholder objectives. They sit above scenario and solution levels. [K1]"},{"id":"GA-t2-02","type":"A","pts":1,"q":"Which abstraction level directly describes how the system will be used?","opts":["Goal level","Scenario level","Solution level","Process level"],"correct":[1],"exp":"Scenario-level requirements (use cases, user stories) describe HOW the system will be used in specific interaction sequences. [K1]"},{"id":"GA-t2-03","type":"A","pts":1,"q":"What is a common defect when using natural language for requirements?","opts":["Requirements are always too short","Natural language cannot express quality requirements","Requirements are inherently prone to ambiguity and misinterpretation","All RE standards reject natural language"],"correct":[2],"exp":"Natural language requirements suffer from ambiguity, incompleteness, contradictions, and noise because language is inherently imprecise. [K2]"},{"id":"GA-t2-04","type":"A","pts":1,"q":"Which quality criterion ensures that no requirement contradicts another?","opts":["Completeness","Traceability","Consistency","Verifiability"],"correct":[2],"exp":"Consistency means no two requirements in the specification contradict each other. Conflicting requirements must be resolved through negotiation. [K1]"},{"id":"GA-t2-05","type":"A","pts":1,"q":"What does 'verifiability' of a requirement mean?","opts":["The requirement has been reviewed by a manager","It is possible to objectively determine whether the system satisfies the requirement","The requirement was written by a certified engineer","The requirement can be traced to a specific stakeholder"],"correct":[1],"exp":"A verifiable requirement has a clear, objective criterion that allows testers to determine if the system satisfies it. Vague requirements are not verifiable. [K2]"},{"id":"GA-t2-06","type":"A","pts":1,"q":"In IREB, 'forward traceability' refers to:","opts":["Tracing requirements back to their sources","Tracing requirements forward to design, code, and test artifacts","Validating that future requirements will be stable","Tracking the history of requirement changes"],"correct":[1],"exp":"Forward traceability links requirements to downstream artifacts (design, implementation, tests), enabling impact analysis and coverage verification. [K1]"},{"id":"GA-t2-07","type":"A","pts":1,"q":"Horizontal traceability refers to:","opts":["Links from requirements to test cases","Links between requirements at the same level of abstraction","Links from business goals to system requirements","Links from requirements to source code"],"correct":[1],"exp":"Horizontal traceability tracks relationships between requirements at the same level (dependencies, conflicts, refinements between system requirements). [K2]"},{"id":"GA-t2-08","type":"A","pts":1,"q":"A 'conceptual model' in RE is used to:","opts":["Define the software architecture","Represent entities, relationships, and concepts in the problem domain","Document the RE process workflow","Specify hardware requirements"],"correct":[1],"exp":"Conceptual models (domain models, ER diagrams) represent problem domain concepts and relationships to support shared understanding. [K2]"},{"id":"GK-t2-01","type":"K","pts":2,"q":"For each statement about requirements quality, indicate True or False:","stmts":["An ambiguous requirement can be interpreted in multiple ways","A requirement is complete if it contains all information needed to implement and verify it","Consistency is achieved by having one stakeholder write all requirements","A verifiable requirement must have at least one measurable acceptance criterion"],"correct":[true,true,false,true],"exp":"A) True. B) True. C) False — consistency means no contradiction, regardless of authorship. D) True — measurability enables testing. [K2]"},{"id":"GK-t2-02","type":"K","pts":2,"q":"For each statement about abstraction levels, indicate True or False:","stmts":["Goal-level requirements express business objectives without specifying system functions","Scenario-level requirements describe specific interaction sequences","Solution-level requirements describe HOW the system will fulfil requirements","It is mandatory to document requirements at all three abstraction levels in every project"],"correct":[true,true,true,false],"exp":"A) True — goals = why. B) True — scenarios = how used. C) True — solution = how built. D) False — appropriate levels depend on project context. [K2]"},{"id":"GK-t2-03","type":"K","pts":2,"q":"For each statement about modeling in RE, indicate True or False:","stmts":["UML use case diagrams can represent requirements at the scenario level","Formal models completely eliminate the need for natural language requirements","A state machine can model the lifecycle of an entity in the system","Models in RE must always use formal mathematical notation"],"correct":[true,false,true,false],"exp":"A) True. B) False — models complement but rarely replace NL requirements. C) True. D) False — semi-formal notations (UML, SysML) are widely used. [K2]"},{"id":"GP-t2-01","type":"P","pts":1,"need":2,"q":"Which TWO of the following are recognized quality criteria for individual requirements in IREB?","opts":["Unambiguous","Approved by the project manager","Verifiable","Written in formal mathematical notation"],"correct":[0,2],"exp":"IREB quality criteria include: unambiguous, complete, consistent, verifiable, correct, traceable. Manager approval and formal notation are not criteria. [K1]"},{"id":"GP-t2-02","type":"P","pts":1,"need":2,"q":"Which TWO of the following describe problems that occur when using natural language for requirements?","opts":["Ambiguity — one term having multiple meanings","Traceability is automatically achieved","Incompleteness — missing information in requirements","Natural language is too formal for stakeholders"],"correct":[0,2],"exp":"Natural language suffers from ambiguity (multiple interpretations) and incompleteness (missing details). Stakeholder accessibility is actually NL's strength. [K2]"},{"id":"GP-t2-03","type":"P","pts":1,"need":2,"q":"Which TWO of the following are benefits of requirements traceability?","opts":["Enables impact analysis when requirements change","Eliminates the need for testing","Supports verification that all requirements have been implemented","Replaces the need for a requirements management tool"],"correct":[0,2],"exp":"Traceability enables impact analysis and coverage verification. It does not eliminate testing or replace RM tools. [K2]"},{"id":"GP-t2-04","type":"P","pts":1,"need":2,"q":"Which TWO of the following statements about requirements validation are correct?","opts":["Validation confirms that requirements match stakeholder needs","Validation is done only at project end","Validation can use prototyping as a technique","Validation is the same as requirements verification"],"correct":[0,2],"exp":"Validation (right system) checks with stakeholders and can use prototyping. It is iterative, not just at end. Validation ≠ verification. [K2]"},{"id":"R6-t2-01","type":"A","pts":1,"q":"Principle 6 states that \"non-validated requirements are useless\". What is the practical implication? (1 answer)","opts":["Requirements should be validated only after implementation","Stakeholder agreement and feedback must be obtained before requirements are relied upon","Only formal mathematical proofs count as validation","Validation can be skipped for small projects"],"correct":[1],"exp":"Requirements are only a sound basis for development once stakeholders have confirmed they reflect their real needs - validation produces that confidence."},{"id":"R6-t2-02","type":"K","pts":2,"q":"Decide true or false about Principle 7 (Evolution: changing requirements are no accident).","stmts":["Requirement changes are a normal, expected phenomenon","A change in the system context can invalidate previously correct requirements","After the baseline is approved, any further change indicates a failed RE process","Systematic change management is the appropriate response to evolution"],"correct":[true,true,false,true],"exp":"Change is normal (A), often triggered by context evolution (B), and handled through change management (D). Treating every change as RE failure contradicts the principle (C)."},{"id":"R6-t2-03","type":"A","pts":1,"q":"Principle 8 (Innovation: more of the same is not enough) warns against: (1 answer)","opts":["Documenting requirements in natural language","Merely replicating the features of the legacy system in the new one","Using creativity techniques during elicitation","Talking to too many stakeholders"],"correct":[1],"exp":"Simply re-implementing the old system wastes the opportunity to deliver better value; RE should actively look for innovative improvements."},{"id":"R6-t2-04","type":"P","pts":2,"q":"Which TWO behaviours exemplify Principle 9 (systematic and disciplined work)? (2 answers)","opts":["Following a defined, repeatable RE process appropriate to the project","Documenting decisions and their rationale so they can be revisited","Relying on memory instead of writing requirements down","Skipping reviews when the schedule is tight","Letting each engineer use a private, undocumented notation"],"need":2,"correct":[0,1],"exp":"Systematic work means defined processes and traceable, documented decisions - not ad-hoc memory, skipped checks or private notations."},{"id":"R6-t2-05","type":"A","pts":1,"q":"A developer assumes \"checkout\" includes invoice generation; the customer assumes it does not. Nobody noticed the difference. This is a failure of: (1 answer)","opts":["Explicit shared understanding","Implicit shared understanding","Value orientation","Systematic work"],"correct":[1],"exp":"Implicit shared understanding is unwritten common knowledge. Here the implicit assumptions diverged without anyone noticing - the classic risk of relying on implicit understanding."},{"id":"R6-t2-06","type":"K","pts":2,"q":"Decide true or false about Principle 2 (Stakeholders).","stmts":["RE is about satisfying the stakeholders' desires and needs","Users are the only stakeholders that matter","Relevant stakeholders may include regulators and operators who never use the system directly","Ignoring a relevant stakeholder group risks missing requirements"],"correct":[true,false,true,true],"exp":"Stakeholders go far beyond end users: buyers, regulators, operations, etc. Missing a group means missing their requirements."},{"id":"R6-t2-07","type":"A","pts":1,"q":"According to Principle 4 (Context), what happens when a neighbouring system that supplies data is decommissioned? (1 answer)","opts":["Nothing - context changes never affect requirements","The affected interface requirements must be re-examined and possibly changed","The system boundary automatically expands","The glossary becomes invalid"],"correct":[1],"exp":"The system cannot be understood in isolation; a context change directly impacts the requirements that depended on that neighbour."},{"id":"R6-t2-08","type":"P","pts":2,"q":"Which TWO factors typically make building shared understanding HARDER? (2 answers)","opts":["Geographically distributed teams with little direct contact","Large differences in domain knowledge between stakeholders and developers","A maintained project glossary","Regular feedback cycles with stakeholders","A small, co-located team with a common background"],"need":2,"correct":[0,1],"exp":"Distance and knowledge gaps are recognised obstacles to shared understanding; glossaries, feedback and co-location are enablers."},{"id":"R6-t2-09","type":"A","pts":1,"q":"Principle 5 treats problem, requirement and solution as an intertwined triple. How should a solution idea volunteered by a stakeholder be handled? (1 answer)","opts":["Reject it - solutions are never part of RE","Capture it, but identify and document the underlying need it serves","Implement it immediately to save elicitation effort","Convert it into a constraint automatically"],"correct":[1],"exp":"Solution ideas are valuable input, but the engineer must surface the real problem/need behind them so alternatives stay open."},{"id":"R6-t2-10","type":"K","pts":2,"q":"Decide true or false about Principle 1 (Value orientation).","stmts":["Requirements are a means to an end - the end is value delivered by the system","The value of a requirement is independent of its implementation cost","\"Gold plating\" (features nobody needs) violates value orientation","RE effort itself should stand in reasonable proportion to the expected benefit"],"correct":[true,false,true,true],"exp":"Value = benefit minus cost: cost matters (B false). Gold plating burns effort without benefit; RE effort itself must also pay off."},{"id":"R6-t2-11","type":"A","pts":1,"q":"A requirements review with stakeholders primarily supports which principle? (1 answer)","opts":["Innovation","Validation","Evolution","Context"],"correct":[1],"exp":"Reviews confirm that documented requirements match real needs - the heart of Principle 6, Validation."},{"id":"R6-t2-12","type":"P","pts":2,"q":"Which TWO statements correctly describe how the Evolution principle is put into practice? (2 answers)","opts":["Establish a change management process with impact analysis","Design the requirements set so it can absorb change (modifiability, traceability)","Freeze all requirements permanently at project start","Forbid stakeholders from submitting new needs after kick-off","Treat every change request as a defect report"],"need":2,"correct":[0,1],"exp":"Evolution is managed through controlled change processes and change-friendly documentation - not by forbidding or pathologizing change."},{"id":"R6-t2-13","type":"A","pts":1,"q":"A team copies all features of the system being replaced, without questioning them. Which principle is violated MOST directly? (1 answer)","opt
