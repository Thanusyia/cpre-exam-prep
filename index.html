ns-serif\">→ Fixed-price → upfront; T&M → evolving<\/text><text x=\"250\" y=\"179.9\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">No one-size-fits-all RE process — always analyse your context first<\/text><\/svg><\/div><p>Before configuring an RE process, these factors must be analysed. They both inform and constrain the configuration space.<\/p><p><b>Overall process fit:<\/b> The RE process must fit the overall system development process &mdash; terminology, work products, and phase structure must align.<\/p><p><b>Development context:<\/b> Who is the customer, who is the supplier, who are the users? Are they in the same organisation? Is there a formal contract? Do the parties trust each other?<\/p><p><b>Shared understanding:<\/b> Better shared understanding &rarr; lighter RE process. Lower shared understanding &rarr; more explicit specification and validation needed.<\/p><p><b>Complexity and criticality:<\/b> High complexity/safety-critical &rarr; detailed specification including formal/semi-formal models and strong validation.<\/p><p><b>Volatility:<\/b> Many anticipated changes &rarr; iterative, change-friendly process.<\/p><p><b>Experience:<\/b> Match process complexity to RE engineer experience. A sophisticated process that can&apos;t be enacted is worse than a simpler, well-enacted one.<\/p>"},{"id":"t5-recap-1","expand_id":"exp-t5-1","title":"3 Process Facets","body":"<b>Time:<\/b> Linear vs Iterative. <b>Purpose:<\/b> Prescriptive vs Explorative. <b>Target:<\/b> Customer-specific vs Market-oriented. These span a 3D configuration space.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 192\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"192\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">The 3 RE Process Facets<\/text><text x=\"14\" y=\"46\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">TIME ORIENTATION<\/text><line x1=\"14\" y1=\"58\" x2=\"490\" y2=\"58\" stroke=\"#3fb950\" stroke-width=\"2\"/><circle cx=\"180\" cy=\"58\" r=\"7\" fill=\"#161b22\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"180\" y=\"46\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Linear<\/text><text x=\"180\" y=\"76\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Sequential phases<\/text><circle cx=\"380\" cy=\"58\" r=\"7\" fill=\"#161b22\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"380\" y=\"46\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Iterative<\/text><text x=\"380\" y=\"76\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Cycles/sprints<\/text><text x=\"14\" y=\"92\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">PURPOSE<\/text><line x1=\"14\" y1=\"104\" x2=\"490\" y2=\"104\" stroke=\"#79c0ff\" stroke-width=\"2\"/><circle cx=\"180\" cy=\"104\" r=\"7\" fill=\"#161b22\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"180\" y=\"92\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Prescriptive<\/text><text x=\"180\" y=\"122\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Fixed requirements<\/text><circle cx=\"380\" cy=\"104\" r=\"7\" fill=\"#161b22\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"380\" y=\"92\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Explorative<\/text><text x=\"380\" y=\"122\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Discovery-driven<\/text><text x=\"14\" y=\"138\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">TARGET<\/text><line x1=\"14\" y1=\"150\" x2=\"490\" y2=\"150\" stroke=\"#ffa657\" stroke-width=\"2\"/><circle cx=\"180\" cy=\"150\" r=\"7\" fill=\"#161b22\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"180\" y=\"138\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Customer-specific<\/text><text x=\"180\" y=\"168\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">One client<\/text><circle cx=\"380\" cy=\"150\" r=\"7\" fill=\"#161b22\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"380\" y=\"138\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Market-oriented<\/text><text x=\"380\" y=\"168\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Many users<\/text><text x=\"250\" y=\"184\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Factor analysis determines where on each axis your project sits<\/text><\/svg><\/div><p><b>Time facet:<\/b><\/p><ul><li><b>Linear:<\/b> Requirements specified up front in a single phase. Requires comprehensive requirements specification. Choose when: plan-driven process, stakeholders available up-front, regulatory requirements mandate comprehensive spec early.<\/li><li><b>Iterative:<\/b> Requirements specified incrementally; intertwined with design/implementation. Short feedback loops. Choose when: agile process, requirements not known up-front, stakeholders available for continuous feedback, ability to change is important.<\/li><\/ul><p><b>Purpose facet:<\/b><\/p><ul><li><b>Prescriptive:<\/b> Requirements spec = binding contract; all requirements must be implemented. Choose when: customer requires fixed contract (fixed functionality, scope, price, deadline).<\/li><li><b>Explorative:<\/b> Only goals known a priori; requirements must be explored. Choose when: stakeholders have vague ideas, deadlines/cost take precedence over functionality.<\/li><\/ul><p><b>Target facet:<\/b><\/p><ul><li><b>Customer-specific:<\/b> System ordered by specific customer, developed by supplier. Choose when: system mainly used by customer&apos;s organisation, individuals identifiable for stakeholder roles.<\/li><li><b>Market-oriented:<\/b> System as product/service for a market. Choose when: developing org intends to sell system, prospective users not individually identifiable, product owner/marketing drive requirements.<\/li><\/ul><p><b>Facet dependencies:<\/b> Linear + Prescriptive often chosen together. Explorative processes are typically also iterative. Market-oriented does not combine well with linear + prescriptive.<\/p>"},{"id":"t5-recap-2","expand_id":"exp-t5-2","title":"3 Typical Process Configurations","body":"<b>Participatory<\/b> (iterative + explorative + customer-specific): agile, close collaboration. <b>Contractual<\/b> (linear + prescriptive + customer-specific): waterfall, outsourcing. <b>Product-oriented<\/b> (iterative + explorative + market-oriented): product/app, market-driven.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 180\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"180\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">3 RE Process Configurations<\/text><text x=\"62\" y=\"30\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Configuration<\/text><text x=\"163\" y=\"30\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Time<\/text><text x=\"253\" y=\"30\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Purpose<\/text><text x=\"338\" y=\"30\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Target<\/text><text x=\"438\" y=\"30\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Example<\/text><rect x=\"6\" y=\"36\" width=\"490\" height=\"38\" rx=\"4\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"62\" y=\"59.5\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Contractual<\/text><text x=\"163\" y=\"59.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Linear<\/text><text x=\"253\" y=\"59.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Prescriptive<\/text><text x=\"338\" y=\"59.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Customer-specific<\/text><text x=\"438\" y=\"59.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Bespoke safety systems<\/text><rect x=\"6\" y=\"80\" width=\"490\" height=\"38\" rx=\"4\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"62\" y=\"103.5\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Participatory<\/text><text x=\"163\" y=\"103.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Iterative<\/text><text x=\"253\" y=\"103.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Explorative<\/text><text x=\"338\" y=\"103.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Customer-specific<\/text><text x=\"438\" y=\"103.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Enterprise software<\/text><rect x=\"6\" y=\"124\" width=\"490\" height=\"38\" rx=\"4\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"62\" y=\"147.5\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Product-oriented<\/text><text x=\"163\" y=\"147.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Iterative<\/text><text x=\"253\" y=\"147.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Explorative<\/text><text x=\"338\" y=\"147.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Market-oriented<\/text><text x=\"438\" y=\"147.5\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Consumer apps / SaaS<\/text><text x=\"250\" y=\"174\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Exam tip: configuration choice is driven by the 3 facets, not project size<\/text><\/svg><\/div><p><b>Participatory RE process:<\/b><\/p><ul><li>Context: Agile, customer and supplier collaborate closely.<\/li><li>Work products: Product backlog with user stories, vision, prototypes.<\/li><li>Information flow: Continuous interaction between stakeholders, product owners, RE engineers, developers.<\/li><li>Example: Insurance company IT unit developing new product with internal business unit as customer.<\/li><\/ul><p><b>Contractual RE process:<\/b><\/p><ul><li>Context: Development tendered/outsourced; comprehensive requirements spec is contractual basis; waterfall-style.<\/li><li>Work products: Classic system requirements specification (text + models).<\/li><li>Information flow: Primarily from stakeholders to Requirements Engineers.<\/li><li>Example: Car manufacturer outsourcing centralized ECU control system development.<\/li><\/ul><p><b>Product-oriented RE process:<\/b><\/p><ul><li>Context: Software product or service for a market; product owner and digital designers drive requirements.<\/li><li>Work products: Product backlog, user stories, vision, prototypes, user feedback.<\/li><li>Information flow: Product owner + marketing + RE engineers + designers + developers + customer/user feedback.<\/li><li>Example: Media company renewing mobile news app.<\/li><\/ul><p><b>Note:<\/b> &ldquo;Human-oriented&rdquo; is NOT a recognised typical pattern. The three patterns are participatory, contractual, and product-oriented.<\/p>"},{"id":"t5-recap-3","expand_id":"exp-t5-3","title":"Configuring an RE Process: 5 Steps","body":"1 Analyse influencing factors. 2 Assess facet criteria. 3 Configure (or choose typical pattern). 4 Determine work products. 5 Select appropriate practices.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 135\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"135\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st53_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st53_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st53_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st53_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">5-Step RE Process<\/text><circle cx=\"50\" cy=\"65\" r=\"28\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"50\" y=\"55\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Scope<\/text><text x=\"50\" y=\"69\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">& Context<\/text><line x1=\"80\" y1=\"65\" x2=\"115\" y2=\"65\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st53_a0)\"/><circle cx=\"145\" cy=\"65\" r=\"28\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"145\" y=\"62\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Elicit<\/text><line x1=\"175\" y1=\"65\" x2=\"210\" y2=\"65\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st53_a0)\"/><circle cx=\"240\" cy=\"65\" r=\"28\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"240\" y=\"55\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Document<\/text><text x=\"240\" y=\"69\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">& Model<\/text><line x1=\"270\" y1=\"65\" x2=\"310\" y2=\"65\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st53_a0)\"/><circle cx=\"340\" cy=\"65\" r=\"28\" fill=\"#56d36422\" stroke=\"#56d364\" stroke-width=\"2\"/><text x=\"340\" y=\"55\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Validate<\/text><text x=\"340\" y=\"69\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">& Negotiate<\/text><line x1=\"370\" y1=\"65\" x2=\"410\" y2=\"65\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st53_a0)\"/><circle cx=\"440\" cy=\"65\" r=\"28\" fill=\"#d2a8ff22\" stroke=\"#d2a8ff\" stroke-width=\"2\"/><text x=\"440\" y=\"55\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Manage<\/text><text x=\"440\" y=\"69\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">& Baseline<\/text><text x=\"250\" y=\"110\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9.5\" font-weight=\"normal\" font-family=\"sans-serif\">Each step feeds the next — validate early and often<\/text><text x=\"250\" y=\"125\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Iterative projects loop steps 2–4 each sprint<\/text><\/svg><\/div><p>This five-step procedure from handbook Section 5.3.3:<\/p><ol><li><b>Analyse influencing factors<\/b> (Section 5.1) &mdash; understand the situation.<\/li><li><b>Assess facet criteria<\/b> (Section 5.2) &mdash; score each criterion on a five-point scale (&ndash;&ndash; to ++).<\/li><li><b>Configure<\/b> &mdash; if criteria clearly match a typical configuration, choose it. Otherwise, tailor (e.g., contractual framework with a participatory sub-process for an unclear subsystem).<\/li><li><b>Determine work products<\/b> &mdash; aligned with overall development process work products.<\/li><li><b>Select practices<\/b> &mdash; from Chapters 3, 4, and 6.<\/li><\/ol><p><b>Key principle:<\/b> There is no proven, one-size-fits-all RE process. Every RE undertaking needs a tailored process.<\/p>"},{"id":"t5-recap-4","expand_id":"exp-t5-4","title":"Linear vs Iterative Trade-offs","body":"Linear: long feedback loops, requires intense up-front validation, needs change process. Iterative: short feedback loops, accommodates unknown reqs. In agile: product owner is central RE role.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 200\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"200\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"16\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Linear vs. Iterative RE Process<\/text><rect x=\"8\" y=\"26\" width=\"230\" height=\"150\" rx=\"6\" fill=\"#0d1117\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"123\" y=\"43\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">LINEAR<\/text><text x=\"123\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">(Waterfall / V-Model)<\/text><rect x=\"22\" y=\"66\" width=\"202\" height=\"16\" rx=\"3\" fill=\"#79c0ff14\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"123\" y=\"77\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8\" font-family=\"sans-serif\">Requirements<\/text><rect x=\"22\" y=\"87\" width=\"202\" height=\"16\" rx=\"3\" fill=\"#79c0ff14\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"123\" y=\"98\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8\" font-family=\"sans-serif\">Design<\/text><rect x=\"22\" y=\"108\" width=\"202\" height=\"16\" rx=\"3\" fill=\"#79c0ff14\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"123\" y=\"119\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8\" font-family=\"sans-serif\">Code<\/text><rect x=\"22\" y=\"129\" width=\"202\" height=\"16\" rx=\"3\" fill=\"#79c0ff14\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"123\" y=\"140\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8\" font-family=\"sans-serif\">Test<\/text><rect x=\"22\" y=\"150\" width=\"202\" height=\"16\" rx=\"3\" fill=\"#79c0ff14\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"123\" y=\"161\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8\" font-family=\"sans-serif\">Deploy<\/text><text x=\"123\" y=\"186\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">All reqs upfront<\/text><text x=\"123\" y=\"196\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Changes are costly<\/text><rect x=\"262\" y=\"26\" width=\"230\" height=\"150\" rx=\"6\" fill=\"#0d1117\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"377\" y=\"43\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">ITERATIVE<\/text><text x=\"377\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">(Agile / Spiral)<\/text><circle cx=\"377\" cy=\"116\" r=\"34\" fill=\"none\" stroke=\"#8b949e\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"347\" cy=\"94\" r=\"18\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"347\" y=\"97\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"7.5\" font-family=\"sans-serif\">Elicit<\/text><circle cx=\"407\" cy=\"94\" r=\"18\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"407\" y=\"97\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"7.5\" font-family=\"sans-serif\">Design<\/text><circle cx=\"407\" cy=\"138\" r=\"18\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"407\" y=\"141\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"7.5\" font-family=\"sans-serif\">Build<\/text><circle cx=\"347\" cy=\"138\" r=\"18\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"347\" y=\"141\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"7.5\" font-family=\"sans-serif\">Validate<\/text><text x=\"377\" y=\"119\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7\" font-family=\"sans-serif\">Sprint<\/text><text x=\"377\" y=\"186\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Reqs evolve each sprint<\/text><text x=\"377\" y=\"196\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-family=\"sans-serif\">Changes welcome<\/text><\/svg><\/div><p><b>Linear RE process caveats:<\/b><\/p><ul><li>Requires sophisticated change management process (once released, all changes must be controlled).<\/li><li>Long feedback loops &mdash; months or years before errors in requirements become visible. Must validate intensively up-front to compensate.<\/li><li>Does NOT mean implementation must also be linear; the example car ECU had iterative implementation despite a linear RE process.<\/li><\/ul><p><b>Iterative RE in agile settings:<\/b><\/p><ul><li>Product owner plays central role: maintains/prioritises backlog, elicits/documents requirements, represents stakeholders to development team.<\/li><li>Iterations: typically 2&ndash;6 weeks.<\/li><li>Market-oriented + iterative + explorative fits agile best.<\/li><li>Big-picture validation risk: sprint reviews and refinement focus on individual stories &mdash; overall product vision must also be validated periodically.<\/li><\/ul>"}]},"t6":{"cards":[{"id":"t6-recap-0","expand_id":"exp-t6-0","title":"Life Cycle Management","body":"Requirements pass through states (draft &rarr; released &rarr; operational &rarr; archived). Define life cycle models: states, transitions, triggering events. Record actual states and transitions.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 132\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"132\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"mlc\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><\/defs><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirement Lifecycle<\/text><rect x=\"8\" y=\"26\" width=\"88\" height=\"40\" rx=\"5\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"52\" y=\"42\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">DRAFT<\/text><text x=\"52\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Proposed<\/text><line x1=\"96\" y1=\"46\" x2=\"105\" y2=\"46\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#mlc)\"/><rect x=\"106\" y=\"26\" width=\"88\" height=\"40\" rx=\"5\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"150\" y=\"42\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">REVIEWED<\/text><text x=\"150\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Feedback done<\/text><line x1=\"194\" y1=\"46\" x2=\"203\" y2=\"46\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#mlc)\"/><rect x=\"204\" y=\"26\" width=\"88\" height=\"40\" rx=\"5\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"248\" y=\"42\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">APPROVED<\/text><text x=\"248\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Baselined<\/text><line x1=\"292\" y1=\"46\" x2=\"301\" y2=\"46\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#mlc)\"/><rect x=\"302\" y=\"26\" width=\"88\" height=\"40\" rx=\"5\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"346\" y=\"42\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">IMPLEMENTED<\/text><text x=\"346\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">In code<\/text><line x1=\"390\" y1=\"46\" x2=\"399\" y2=\"46\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#mlc)\"/><rect x=\"400\" y=\"26\" width=\"88\" height=\"40\" rx=\"5\" fill=\"#8b949e18\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><text x=\"444\" y=\"42\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">DEPRECATED<\/text><text x=\"444\" y=\"56\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Retired<\/text><path d=\"M150,70 C130,88 72,88 54,72\" fill=\"none\" stroke=\"#ff7b72\" stroke-width=\"1.2\" stroke-dasharray=\"4,3\" marker-end=\"url(#mlc)\"/><text x=\"102\" y=\"98\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Rejected<\/text><text x=\"250\" y=\"124\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"600\" font-family=\"sans-serif\">Baselines freeze approved reqs — changes require formal change process<\/text><\/svg><\/div><p><b>Life cycle management involves:<\/b><\/p><ul><li>Defining life cycle models for work products and requirements (states, allowed transitions, triggering events).<\/li><li>Ensuring only explicitly allowed transitions occur.<\/li><li>Recording actual states and transitions.<\/li><li>Reporting on states and transitions (dashboards, progress tracking).<\/li><\/ul><p>State of a work product is often recorded as an attribute (Section 6.5). In agile: state derivable from position in product backlog, task board, definition of ready/done.<\/p><p>Different roles have different life cycle views: RE engineer&apos;s interest may end at &ldquo;validated&rdquo;; project manager&apos;s starts at &ldquo;documented&rdquo;.<\/p><p><b>Practical warning from handbook:<\/b> Requirements management is often neglected early in a project when a small team works on obvious high-level requirements. Later, complexity increases and the team loses overview. Better to invest early in a proper management setup.<\/p>"},{"id":"t6-recap-1","expand_id":"exp-t6-1","title":"Version Control","body":"<b>Version number<\/b> (major.increment) &middot; <b>Change description<\/b> &middot; <b>Storage policy<\/b>. Version = released milestone (1, 2&hellip;). Increment = each externally visible change. Preserve all prior versions unless storage limits apply.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 174\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"174\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"16\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirements Version Control<\/text><text x=\"45\" y=\"34\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Version<\/text><text x=\"115\" y=\"34\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Author<\/text><text x=\"180\" y=\"34\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Date<\/text><text x=\"300\" y=\"34\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Change Summary<\/text><text x=\"440\" y=\"34\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Status<\/text><line x1=\"8\" y1=\"42\" x2=\"492\" y2=\"42\" stroke=\"#30363d\" stroke-width=\"1\"/><rect x=\"8\" y=\"48\" width=\"484\" height=\"24\" rx=\"4\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"45\" y=\"64\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">v1.0<\/text><text x=\"115\" y=\"64\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">J.Smith<\/text><text x=\"180\" y=\"64\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">2024-01<\/text><text x=\"300\" y=\"64\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Initial draft<\/text><text x=\"440\" y=\"64\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Draft<\/text><rect x=\"8\" y=\"76\" width=\"484\" height=\"24\" rx=\"4\" fill=\"#ffa65712\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"45\" y=\"92\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">v1.1<\/text><text x=\"115\" y=\"92\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">A.Lee<\/text><text x=\"180\" y=\"92\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">2024-02<\/text><text x=\"300\" y=\"92\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Added UC-03<\/text><text x=\"440\" y=\"92\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Reviewed<\/text><rect x=\"8\" y=\"104\" width=\"484\" height=\"24\" rx=\"4\" fill=\"#3fb95012\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"45\" y=\"120\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">v2.0<\/text><text x=\"115\" y=\"120\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">J.Smith<\/text><text x=\"180\" y=\"120\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">2024-03<\/text><text x=\"300\" y=\"120\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Approved baseline<\/text><text x=\"440\" y=\"120\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Approved<\/text><rect x=\"8\" y=\"132\" width=\"484\" height=\"24\" rx=\"4\" fill=\"#ff7b7212\" stroke=\"#ff7b72\" stroke-width=\"1\"/><text x=\"45\" y=\"148\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">v2.1<\/text><text x=\"115\" y=\"148\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">M.Patel<\/text><text x=\"180\" y=\"148\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">2024-04<\/text><text x=\"300\" y=\"148\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Updated UC-05<\/text><text x=\"440\" y=\"148\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Draft<\/text><text x=\"250\" y=\"166\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Baseline = approved, immutable version. Changes create new version.<\/text><\/svg><\/div><p><b>Three measures for version control:<\/b><\/p><ol><li><b>Version identification<\/b> &mdash; unique version number + date per version.<\/li><li><b>Change description<\/b> &mdash; clear diff between version and predecessor, linked to version number.<\/li><li><b>Storage policy<\/b> &mdash; preserve all prior versions (rollback capability); policy for archiving/cleanup when storage is limited.<\/li><\/ol><p><b>Version numbering convention:<\/b><\/p><ul><li><b>Version<\/b> number: starts at 0 (under development); becomes 1 when formally approved/released; incremented only for major substantive updates.<\/li><li><b>Increment<\/b> number: starts at 1; incremented with every externally visible change (including editorial). Sub-increment for typos only. Increment 9 sometimes used as &ldquo;final draft before release&rdquo;.<\/li><\/ul><p>If a work product contains multiple requirements and only one changes: both the work product and that requirement get new version numbers; unchanged requirements keep their old version numbers. Practical solution: version number at work-product level, requirements inherit the work product version.<\/p><p>Lifecycle state changes (validated &rarr; implemented &rarr; archived) do NOT require a new version number unless accompanied by content changes.<\/p>"},{"id":"t6-recap-2","expand_id":"exp-t6-2","title":"Configurations and Baselines","body":"<b>Configuration<\/b> = consistent, logically connected, unique, unchangeable set of work product versions for a specific purpose. <b>Baseline<\/b> = stable, validated, change-controlled configuration marking a milestone.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 162\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"160\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Configurations and Baselines<\/text><line x1=\"30\" y1=\"65\" x2=\"470\" y2=\"65\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><circle cx=\"70\" cy=\"65\" r=\"10\" fill=\"#3fb95033\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"70\" y=\"44\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Baseline 1.0<\/text><text x=\"70\" y=\"85\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Initial requirements<\/text><text x=\"70\" y=\"97\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Approved for design<\/text><circle cx=\"200\" cy=\"65\" r=\"10\" fill=\"#ffa65733\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"200\" y=\"44\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Change Request<\/text><text x=\"200\" y=\"85\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Impact analysis<\/text><text x=\"200\" y=\"97\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">→ Update reqs<\/text><circle cx=\"320\" cy=\"65\" r=\"10\" fill=\"#3fb95033\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"320\" y=\"44\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Baseline 2.0<\/text><text x=\"320\" y=\"85\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Updated set<\/text><text x=\"320\" y=\"97\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Approved for build<\/text><circle cx=\"440\" cy=\"65\" r=\"10\" fill=\"#56d36433\" stroke=\"#56d364\" stroke-width=\"2\"/><text x=\"440\" y=\"44\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Baseline 3.0<\/text><text x=\"440\" y=\"85\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Final build<\/text><text x=\"440\" y=\"97\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">baseline<\/text><text x=\"250\" y=\"155\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">A configuration is a defined set of requirements at a point in time (= baseline)<\/text><\/svg><\/div><p><b>Configuration properties:<\/b><\/p><ul><li><b>Logically connected<\/b> &mdash; belongs together for a specific goal.<\/li><li><b>Consistent<\/b> &mdash; no internal conflicts; can be integrated into a system.<\/li><li><b>Unique<\/b> &mdash; both the configuration and its constituent requirements are clearly identified.<\/li><li><b>Unchangeable<\/b> &mdash; each selected requirement is at a fixed version; changing any version creates a new configuration.<\/li><li><b>Basis for reset<\/b> &mdash; allows rollback to previous configuration.<\/li><\/ul><p><b>Configuration has two dimensions:<\/b> Product dimension (which requirements are included) and Version dimension (which specific version of each requirement).<\/p><p><b>Baseline:<\/b> A stable, validated, change-controlled configuration. Marks a milestone or project phase end. Used for planning (stable starting point for next phase). If something goes wrong &rarr; roll back to baseline.<\/p><p>In agile: sprint backlog at sprint start = baseline for that iteration.<\/p><p><b>Exam:<\/b> &ldquo;A baseline is a released, fixed, approved configuration of a set of requirements.&rdquo; Correct. A baseline is NOT just a list of requirements or a frozen document &mdash; it is a <em>configuration<\/em> (consistent set of specific versions).<\/p>"},{"id":"t6-recap-3","expand_id":"exp-t6-3","title":"Attributes and Views","body":"<b>ISO 29148 attributes:<\/b> ID, Stakeholder priority, Dependency, Risk, Source, Rationale, Difficulty, Type. <b>Views:<\/b> Selective (filter requirements) &middot; Projective (filter attributes) &middot; Aggregating (summaries/totals).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 184\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"184\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirement Attributes and Views<\/text><rect x=\"8\" y=\"22\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"41\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">ID:<\/text><text x=\"150\" y=\"41\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">REQ-042<\/text><rect x=\"256\" y=\"22\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"41\" text-anchor=\"start\" fill=\"#e6edf3\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Description:<\/text><text x=\"398\" y=\"41\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">The system shall...<\/text><rect x=\"8\" y=\"58\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"77\" text-anchor=\"start\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Priority:<\/text><text x=\"150\" y=\"77\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">HIGH<\/text><rect x=\"256\" y=\"58\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"77\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Status:<\/text><text x=\"398\" y=\"77\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Approved<\/text><rect x=\"8\" y=\"94\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"113\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Source:<\/text><text x=\"150\" y=\"113\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Stakeholder A<\/text><rect x=\"256\" y=\"94\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"113\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Version:<\/text><text x=\"398\" y=\"113\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">v2.0<\/text><rect x=\"8\" y=\"130\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"16\" y=\"149\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Acceptance Criteria:<\/text><text x=\"150\" y=\"149\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">TC-017<\/text><rect x=\"256\" y=\"130\" width=\"240\" height=\"30\" rx=\"4\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"264\" y=\"149\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">Assigned to:<\/text><text x=\"398\" y=\"149\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Dev Team B<\/text><text x=\"250\" y=\"176\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Views: filter by attribute (e.g. all HIGH priority, all Approved) for different audiences<\/text><\/svg><\/div><p><b>Attributes (metadata about requirements):<\/b><\/p><ul><li><b>Identification<\/b> &mdash; unique immutable ID; essential for management.<\/li><li><b>Stakeholder priority<\/b> &mdash; agreed importance from stakeholder viewpoint.<\/li><li><b>Dependency<\/b> &mdash; relationships between requirements (low-priority req may need to be done first if a high-priority req depends on it).<\/li><li><b>Risk<\/b> &mdash; potential for implementation to cause damage/costs/delays.<\/li><li><b>Source<\/b> &mdash; where the requirement came from (for backward traceability, validation, conflict resolution).<\/li><li><b>Rationale<\/b> &mdash; why the requirement is needed; stakeholder objectives it fulfils.<\/li><li><b>Difficulty<\/b> &mdash; estimated implementation effort.<\/li><li><b>Type<\/b> &mdash; functional / quality / constraint.<\/li><\/ul><p><b>Views (3 types):<\/b><\/p><ul><li><b>Selective<\/b> &mdash; filters <em>which<\/em> requirements are shown (e.g., only requirements with state &ldquo;validated&rdquo;, only requirements for Sales department).<\/li><li><b>Projective<\/b> &mdash; filters <em>which attributes<\/em> are shown (e.g., only ID + version number + name).<\/li><li><b>Aggregating<\/b> &mdash; summaries, totals, averages (e.g., total requirements per department).<\/li><\/ul><p>A view does NOT enable multi-user concurrent editing &mdash; that is a tool capability, not a view property.<\/p>"},{"id":"t6-recap-4","expand_id":"exp-t6-4","title":"Traceability","body":"<b>Backward<\/b> (pre-RS): trace to origins/sources. <b>Forward<\/b> (post-RS): trace to design/code/tests. <b>Between-requirements<\/b>: dependencies, refinements. Document: implicit (naming/structure) or explicit (attributes, trace matrix, hyperlinks, trace graph).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 155\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"185\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st64_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st64_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st64_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st64_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Requirements Traceability Chain<\/text><rect x=\"38\" y=\"22\" width=\"80\" height=\"56\" rx=\"5\" fill=\"#d2a8ff18\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"78\" y=\"39.8\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Stakeholder<\/text><text x=\"78\" y=\"52.5\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Need<\/text><text x=\"78\" y=\"65.3\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">SN-01<\/text><rect x=\"128\" y=\"22\" width=\"80\" height=\"56\" rx=\"5\" fill=\"#3fb95018\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"168\" y=\"39.8\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Require-<\/text><text x=\"168\" y=\"52.5\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">ment<\/text><text x=\"168\" y=\"65.3\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">REQ-42<\/text><rect x=\"218\" y=\"22\" width=\"80\" height=\"56\" rx=\"5\" fill=\"#79c0ff18\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"258\" y=\"46.2\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Design<\/text><text x=\"258\" y=\"58.9\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">DD-07<\/text><rect x=\"308\" y=\"22\" width=\"80\" height=\"56\" rx=\"5\" fill=\"#ffa65718\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"348\" y=\"46.2\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Code<\/text><text x=\"348\" y=\"58.9\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">MOD-5<\/text><rect x=\"398\" y=\"22\" width=\"80\" height=\"56\" rx=\"5\" fill=\"#56d36418\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"438\" y=\"46.2\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Test<\/text><text x=\"438\" y=\"58.9\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">TC-55<\/text><line x1=\"120\" y1=\"44\" x2=\"126\" y2=\"44\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#st64_aG)\"/><line x1=\"210\" y1=\"44\" x2=\"216\" y2=\"44\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#st64_aG)\"/><line x1=\"300\" y1=\"44\" x2=\"306\" y2=\"44\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#st64_aG)\"/><line x1=\"390\" y1=\"44\" x2=\"396\" y2=\"44\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#st64_aG)\"/><line x1=\"128\" y1=\"58\" x2=\"120\" y2=\"58\" stroke=\"#ff7b72\" stroke-width=\"1\" stroke-dasharray=\"4,2\"/><line x1=\"218\" y1=\"58\" x2=\"210\" y2=\"58\" stroke=\"#ff7b72\" stroke-width=\"1\" stroke-dasharray=\"4,2\"/><line x1=\"308\" y1=\"58\" x2=\"300\" y2=\"58\" stroke=\"#ff7b72\" stroke-width=\"1\" stroke-dasharray=\"4,2\"/><line x1=\"398\" y1=\"58\" x2=\"390\" y2=\"58\" stroke=\"#ff7b72\" stroke-width=\"1\" stroke-dasharray=\"4,2\"/><text x=\"250\" y=\"106.4\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">→ Forward tracing: implementation coverage<\/text><text x=\"250\" y=\"120.3\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">← Backward tracing: impact analysis on change<\/text><text x=\"250\" y=\"134.3\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Traceability matrix links each req to source, design, code, and test<\/text><text x=\"250\" y=\"149.0\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">If a req changes: ALL linked artefacts must be checked and updated<\/text><\/svg><\/div><p><b>Without traceability, you cannot:<\/b><\/p><ul><li>Prove a requirement is satisfied.<\/li><li>Show compliance with laws/standards.<\/li><li>Find missing work products (e.g., requirements without test cases).<\/li><li>Analyse change impact.<\/li><\/ul><p>Safety-critical systems often explicitly require traceability by process standards.<\/p><p><b>Traceability documentation methods:<\/b><\/p><ul><li><b>Implicit:<\/b> Naming conventions (e.g., Req-sal-012 = Sales department), document structure, standard templates.<\/li><li><b>Explicit:<\/b> Attributes (Source, Rationale), document cross-references, traceability matrix (Table 6.1), Wiki-style hyperlinks, trace graph.<\/li><\/ul><p>In complex projects: requirements management or configuration management tool is indispensable for managing traceability with versioning.<\/p>"},{"id":"t6-recap-5","expand_id":"exp-t6-5","title":"Handling Change","body":"Changes are normal (Evolution principle). Change authority varies by phase: <b>author<\/b> (draft) &rarr; <b>PM/CCB<\/b> (released, linear) &rarr; <b>product owner<\/b> (released, iterative) &rarr; <b>CAB<\/b> (operational).","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"165\" fill=\"#161b22\" rx=\"8\"/><defs><marker id=\"st65_a0\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#8b949e\"/><\/marker><marker id=\"st65_aG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#3fb950\"/><\/marker><marker id=\"st65_aB\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#79c0ff\"/><\/marker><marker id=\"st65_aY\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L7,3.5 z\" fill=\"#ffa657\"/><\/marker><\/defs><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">Change Management Process<\/text><line x1=\"30\" y1=\"72\" x2=\"475\" y2=\"72\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><circle cx=\"50\" cy=\"72\" r=\"22\" fill=\"#ff7b7222\" stroke=\"#ff7b72\" stroke-width=\"2\"/><text x=\"50\" y=\"50\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Change<\/text><text x=\"50\" y=\"62\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Request<\/text><line x1=\"74\" y1=\"72\" x2=\"126\" y2=\"72\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st65_a0)\"/><text x=\"50\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Log CR<\/text><circle cx=\"150\" cy=\"72\" r=\"22\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-width=\"2\"/><text x=\"150\" y=\"50\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Impact<\/text><text x=\"150\" y=\"62\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Analysis<\/text><line x1=\"174\" y1=\"72\" x2=\"231\" y2=\"72\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st65_a0)\"/><text x=\"150\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Assess impact<\/text><circle cx=\"255\" cy=\"72\" r=\"22\" fill=\"#79c0ff22\" stroke=\"#79c0ff\" stroke-width=\"2\"/><text x=\"255\" y=\"50\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Approve<\/text><text x=\"255\" y=\"62\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">or Reject<\/text><line x1=\"279\" y1=\"72\" x2=\"336\" y2=\"72\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st65_a0)\"/><text x=\"255\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Decision<\/text><circle cx=\"360\" cy=\"72\" r=\"22\" fill=\"#3fb95022\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"360\" y=\"50\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Update<\/text><text x=\"360\" y=\"62\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Artefacts<\/text><line x1=\"384\" y1=\"72\" x2=\"431\" y2=\"72\" stroke=\"#8b949e\" stroke-width=\"1.5\" marker-end=\"url(#st65_a0)\"/><text x=\"360\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Update<\/text><circle cx=\"455\" cy=\"72\" r=\"22\" fill=\"#56d36422\" stroke=\"#56d364\" stroke-width=\"2\"/><text x=\"455\" y=\"50\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"600\" font-family=\"sans-serif\">Re-Baseline<\/text><text x=\"455\" y=\"100\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">New baseline<\/text><path d=\"M256,93 Q255,130 150,130 Q80,130 50,130\" fill=\"none\" stroke=\"#ff7b72\" stroke-width=\"1\" stroke-dasharray=\"3,2\" marker-end=\"url(#st65_a0)\"/><text x=\"200\" y=\"145\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8\" font-weight=\"normal\" font-family=\"sans-serif\">Rejected → Close CR<\/text><text x=\"250\" y=\"160\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9.5\" font-weight=\"600\" font-family=\"sans-serif\">Impact analysis is MANDATORY before any change is approved<\/text><\/svg><\/div><p><b>Change enablement (ITIL-aligned) focuses on:<\/b><\/p><ul><li>Ensuring all risks are accurately assessed (impact analysis).<\/li><li>Authorizing changes to proceed.<\/li><li>Managing change implementation.<\/li><\/ul><p><b>Change authority by phase:<\/b><\/p><ul><li><b>Draft state:<\/b> Author has authority to change without formal process.<\/li><li><b>Released (linear development):<\/b> Project management, steering committee, or Change Control Board (CCB) &mdash; formal decision, impact analysis, planned implementation.<\/li><li><b>Released (iterative/agile):<\/b> Product owner decides; accepted change added to product backlog as a new item.<\/li><li><b>Operational system:<\/b> Strictest process. Change Advisory Board (CAB) typically; standard (pre-authorised), normal (formal RfC), emergency (immediate) changes.<\/li><\/ul><p><b>CCB vs CAB (Glossary distinction):<\/b> Change control board = committee of client + supplier representatives that <em>decides<\/em> on change requests. Change advisory board = evaluates change requests for a system in operation, typically has <em>no decision power<\/em>.<\/p><p><b>Traceability is essential for impact analysis<\/b> before authorising any change to a released requirement.<\/p>"},{"id":"t6-recap-6","expand_id":"exp-t6-6","title":"Prioritisation","body":"<b>Ad hoc:<\/b> Top-10, MoSCoW (Must/Should/Could/Won&apos;t), Kano-based. <b>Analytical:<\/b> Weighted multi-criteria (business value, urgency, effort, risk, dependencies). Goal, stakeholders, and criteria must be defined first.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"185\" fill=\"#161b22\" rx=\"8\"/><rect x=\"10\" y=\"5\" width=\"118\" height=\"175\" rx=\"5\" fill=\"#ff7b7212\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"69\" y=\"24\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"16\" font-weight=\"800\" font-family=\"sans-serif\">M<\/text><text x=\"69\" y=\"42\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">MUST<\/text><rect x=\"16\" y=\"54\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"69\" y=\"73\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Core rule<\/text><rect x=\"16\" y=\"90\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"69\" y=\"109\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Legal req<\/text><rect x=\"16\" y=\"126\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"69\" y=\"145\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Safety critical<\/text><text x=\"69\" y=\"162\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">✗ Absent = project fails<\/text><rect x=\"133\" y=\"5\" width=\"118\" height=\"175\" rx=\"5\" fill=\"#ffa65712\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"192\" y=\"24\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"16\" font-weight=\"800\" font-family=\"sans-serif\">S<\/text><text x=\"192\" y=\"42\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">SHOULD<\/text><rect x=\"139\" y=\"54\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"192\" y=\"73\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">High value<\/text><rect x=\"139\" y=\"90\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"192\" y=\"109\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Strong business need<\/text><text x=\"192\" y=\"162\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Can defer once<\/text><rect x=\"254\" y=\"5\" width=\"118\" height=\"175\" rx=\"5\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"313\" y=\"24\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"16\" font-weight=\"800\" font-family=\"sans-serif\">C<\/text><text x=\"313\" y=\"42\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">COULD<\/text><rect x=\"260\" y=\"54\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"313\" y=\"73\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Nice to have<\/text><rect x=\"260\" y=\"90\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"313\" y=\"109\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Minor UX gain<\/text><text x=\"313\" y=\"162\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Include if capacity<\/text><rect x=\"375\" y=\"5\" width=\"118\" height=\"175\" rx=\"5\" fill=\"#8b949e12\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><text x=\"434\" y=\"24\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"16\" font-weight=\"800\" font-family=\"sans-serif\">W<\/text><text x=\"434\" y=\"42\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"700\" font-family=\"sans-serif\">WON'T<\/text><rect x=\"381\" y=\"54\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"434\" y=\"73\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Future release<\/text><rect x=\"381\" y=\"90\" width=\"106\" height=\"30\" rx=\"3\" fill=\"#21262d\" stroke=\"#30363d\" stroke-width=\"1\"/><text x=\"434\" y=\"109\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"8.5\" font-weight=\"normal\" font-family=\"sans-serif\">Low ROI now<\/text><text x=\"434\" y=\"162\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"7.5\" font-weight=\"normal\" font-family=\"sans-serif\">Explicitly excluded<\/text><text x=\"250\" y=\"182\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">MoSCoW = Must + Should + Could + Won't (for now)<\/text><\/svg><\/div><p><b>Steps for prioritisation:<\/b><\/p><ol><li>Define major goals and constraints for the prioritisation.<\/li><li>Define desired assessment criteria (business value, urgency, effort, risk, dependencies, legal nature).<\/li><li>Define stakeholders that must be involved.<\/li><li>Define which requirements to prioritise (comparable abstraction level).<\/li><li>Select prioritisation technique (must be agreed by stakeholders beforehand).<\/li><li>Perform prioritisation; resolve any differences as conflicts (Section 4.3).<\/li><\/ol><p><b>Ad hoc techniques:<\/b> Quick and cheap but single-criterion/subjective. MoSCoW = Must have / Should have / Could have / Won&apos;t have this time. Top-10 = experts rank top 10. Kano-based: dissatisfiers = Must, satisfiers = Should, delighters = Could/Won&apos;t.<\/p><p><b>Analytical techniques:<\/b> Systematic, weighted criteria. Stakeholders must agree on weight factors before calculation (otherwise manipulation). Estimates on ordinal scales (low/medium/high) &mdash; beware pseudo-accuracy in calculated scores. Higher stakeholder acceptance because process is transparent.<\/p><p><b>Prioritisation is NOT:<\/b> cost estimation, reuse identification, or size estimation &mdash; those are different attributes/activities.<\/p>"},{"id":"t6-recap-7","expand_id":"exp-t6-7","title":"Tool Support in RE","body":"<b>6 RE tool categories:<\/b> Requirements management &middot; RE process management &middot; Knowledge documentation &middot; Modelling &middot; Collaboration &middot; Testing/simulation. Most tools are a mix; integration between tools is important.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 180.9\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"180.9\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">RM Tool Capabilities<\/text><rect x=\"8\" y=\"22\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#3fb95012\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"18\" y=\"35.3\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"28\" y=\"35.3\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Storage & Attributes<\/text><text x=\"175\" y=\"35.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Store, search, filter requirements by any attribute<\/text><rect x=\"8\" y=\"45\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#79c0ff12\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"18\" y=\"58.3\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"28\" y=\"58.3\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Versioning & Baselines<\/text><text x=\"175\" y=\"58.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Track changes, freeze approved sets<\/text><rect x=\"8\" y=\"68\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#ffa65712\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"18\" y=\"81.3\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"28\" y=\"81.3\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Traceability<\/text><text x=\"175\" y=\"81.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Link reqs to source, design, code, test<\/text><rect x=\"8\" y=\"91\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#56d36412\" stroke=\"#56d364\" stroke-width=\"1\"/><text x=\"18\" y=\"104.3\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"28\" y=\"104.3\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Change Management<\/text><text x=\"175\" y=\"104.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Workflow for CR review and approval<\/text><rect x=\"8\" y=\"114\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#d2a8ff12\" stroke=\"#d2a8ff\" stroke-width=\"1\"/><text x=\"18\" y=\"127.3\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✓<\/text><text x=\"28\" y=\"127.3\" text-anchor=\"start\" fill=\"#d2a8ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">Collaboration<\/text><text x=\"175\" y=\"127.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Multi-user editing, review, comments<\/text><rect x=\"8\" y=\"137\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#8b949e12\" stroke=\"#8b949e\" stroke-width=\"1\"/><text x=\"18\" y=\"150.3\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\" font-weight=\"normal\" font-family=\"sans-serif\">✗<\/text><text x=\"28\" y=\"150.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">NOT: Modelling<\/text><text x=\"175\" y=\"150.3\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">UML modelling is done in separate tools<\/text><text x=\"250\" y=\"174.9\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Select tools based on process fit, tool chain integration, and usability — not vendor demos<\/text><\/svg><\/div><p><b>Tool category details (Handbook 7.1):<\/b><\/p><ul><li><b>Requirements management:<\/b> Attributes, prioritisation support, life cycle management, version control, configurations/baselines, traceability tracking, change management.<\/li><li><b>RE process management:<\/b> Measures and reports on RE process and workflow; product quality measurement.<\/li><li><b>Knowledge documentation:<\/b> Sharing and creating common understanding; legal record-keeping; overview and insight.<\/li><li><b>Modelling:<\/b> Structure thinking; specify requirements in formal/semi-formal languages; link models to text.<\/li><li><b>Collaboration:<\/b> Supports elicitation, documentation, management in distributed/remote teams.<\/li><li><b>Testing/simulation:<\/b> Simulate requirements to predict intended effect before implementation.<\/li><\/ul><p><b>Key exam point:<\/b> &ldquo;Modelling&rdquo; is a <em>separate<\/em> RE tool category from requirements management. A requirements management tool does NOT necessarily include modelling capabilities. Asking what a requirements management tool does NOT do = &ldquo;modelling&rdquo; is a valid answer.<\/p><p><b>Tool introduction advice (Section 7.2):<\/b> Consider all life cycle costs (beyond licence), resources needed, run pilot projects, evaluate against defined criteria, train employees.<\/p>"}]},"t7":{"cards":[{"id":"t7-recap-0","expand_id":"exp-t7-0","title":"Core RM Tool Capabilities","body":"Storage with attributes &bull; Traceability links &bull; Version/baseline management &bull; Change tracking &bull; Reporting dashboards &bull; Collaborative review.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 246\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"246\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"14\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"1\" font-weight=\"normal\" font-family=\"sans-serif\"><\/text><circle cx=\"250\" cy=\"118\" r=\"44\" fill=\"#21262d\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"250\" y=\"114\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" font-family=\"sans-serif\">RM<\/text><text x=\"250\" y=\"130\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"10\" font-weight=\"700\" font-family=\"sans-serif\">TOOL<\/text><line x1=\"250\" y1=\"74\" x2=\"250\" y2=\"44\" stroke=\"#3fb95088\" stroke-width=\"1.3\"/><rect x=\"206\" y=\"6\" width=\"88\" height=\"36\" rx=\"6\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"250.0\" y=\"21\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Storage &amp;<\/text><text x=\"250.0\" y=\"33\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Attributes<\/text><line x1=\"287\" y1=\"95\" x2=\"378\" y2=\"62\" stroke=\"#79c0ff88\" stroke-width=\"1.3\"/><rect x=\"380\" y=\"36\" width=\"104\" height=\"36\" rx=\"6\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1.5\"/><text x=\"432.0\" y=\"51\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Traceability<\/text><text x=\"432.0\" y=\"63\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Links<\/text><line x1=\"292\" y1=\"132\" x2=\"390\" y2=\"144\" stroke=\"#ffa65788\" stroke-width=\"1.3\"/><rect x=\"392\" y=\"130\" width=\"100\" height=\"36\" rx=\"6\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1.5\"/><text x=\"442.0\" y=\"145\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Baselines &amp;<\/text><text x=\"442.0\" y=\"157\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Versioning<\/text><line x1=\"272\" y1=\"156\" x2=\"330\" y2=\"184\" stroke=\"#56d36488\" stroke-width=\"1.3\"/><rect x=\"300\" y=\"186\" width=\"92\" height=\"34\" rx=\"6\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1.5\"/><text x=\"346.0\" y=\"206.0\" text-anchor=\"middle\" fill=\"#56d364\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Reporting<\/text><line x1=\"228\" y1=\"156\" x2=\"180\" y2=\"184\" stroke=\"#d2a8ff88\" stroke-width=\"1.3\"/><rect x=\"118\" y=\"186\" width=\"92\" height=\"34\" rx=\"6\" fill=\"#d2a8ff15\" stroke=\"#d2a8ff\" stroke-width=\"1.5\"/><text x=\"164.0\" y=\"201\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Change<\/text><text x=\"164.0\" y=\"213\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Tracking<\/text><line x1=\"208\" y1=\"132\" x2=\"110\" y2=\"142\" stroke=\"#ff7b7288\" stroke-width=\"1.3\"/><rect x=\"8\" y=\"128\" width=\"100\" height=\"36\" rx=\"6\" fill=\"#ff7b7215\" stroke=\"#ff7b72\" stroke-width=\"1.5\"/><text x=\"58.0\" y=\"143\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Collaborative<\/text><text x=\"58.0\" y=\"155\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Review<\/text><line x1=\"216\" y1=\"92\" x2=\"126\" y2=\"54\" stroke=\"#8b949e88\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><rect x=\"30\" y=\"20\" width=\"96\" height=\"34\" rx=\"6\" fill=\"#8b949e15\" stroke=\"#8b949e\" stroke-width=\"1.2\" stroke-dasharray=\"4,3\"/><text x=\"78\" y=\"34\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">NOT:<\/text><text x=\"78\" y=\"47\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"8.5\" font-weight=\"700\" font-family=\"sans-serif\">Modelling ✗<\/text><text x=\"250\" y=\"238\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">RM tools manage requirements — modelling is a separate concern<\/text><\/svg><\/div>\n        <p>A requirements management tool stores requirements with attributes (ID, status, priority, source), maintains traceability links between requirements and downstream artefacts (test cases, design elements), supports versioning and baselining, and provides reporting on requirement coverage and status.<\/p>\n        <p><b>NOT<\/b> core RM capabilities: modelling/diagramming (CASE tools), automatic elicitation, code generation, test execution.<\/p>"},{"id":"t7-recap-1","expand_id":"exp-t7-1","title":"Tool Selection Criteria","body":"Process fit &bull; Tool chain integration &bull; Usability &bull; Scalability/licensing. NOT vendor recommendation alone.","expand":"<div style=\"margin-top:12px;padding-top:10px;border-top:1px solid #30363d\"><p style=\"font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px\">Visual Overview<\/p><svg viewBox=\"0 0 500 186.7\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;margin:10px 0;max-width:500px;border-radius:6px;\"><rect width=\"500\" height=\"186.7\" fill=\"#161b22\" rx=\"8\"/><text x=\"250\" y=\"21.3\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"11\" font-weight=\"700\" font-family=\"sans-serif\">RM Tool Selection Criteria<\/text><rect x=\"8\" y=\"22\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#3fb95015\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"14\" y=\"34.9\" text-anchor=\"start\" fill=\"#3fb950\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">✓ Process Fit<\/text><text x=\"155\" y=\"34.9\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Does the tool support your artefacts, roles, and workflows?<\/text><rect x=\"8\" y=\"46\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#79c0ff15\" stroke=\"#79c0ff\" stroke-width=\"1\"/><text x=\"14\" y=\"58.9\" text-anchor=\"start\" fill=\"#79c0ff\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">✓ Tool Chain Integration<\/text><text x=\"155\" y=\"58.9\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Links with ALM, CM, test management systems?<\/text><rect x=\"8\" y=\"70\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#ffa65715\" stroke=\"#ffa657\" stroke-width=\"1\"/><text x=\"14\" y=\"82.8\" text-anchor=\"start\" fill=\"#ffa657\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">✓ Usability<\/text><text x=\"155\" y=\"82.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Training effort? Adoption risk? UI clarity?<\/text><rect x=\"8\" y=\"94\" width=\"490\" height=\"20\" rx=\"3\" fill=\"#56d36415\" stroke=\"#56d364\" stroke-width=\"1\"/><text x=\"14\" y=\"106.8\" text-anchor=\"start\" fill=\"#56d364\" font-size=\"9.5\" font-weight=\"700\" font-family=\"sans-serif\">✓ Scalability<\/text><text x=\"155\" y=\"106.8\" text-anchor=\"start\" fill=\"#8b949e\" font-size=\"9\" font-weight=\"normal\" font-family=\"sans-serif\">Users, repos, performance under load?<\/text><rect x=\"8\" y=\"118\" widt
