st address","Technical implementation challenges","Project management challenges"],"correct":[1],"exp":"The problem space contains real-world needs and goals motivating the system. The solution space contains possible systems addressing those problems. [K1]"},{"id":"GA-t5-02","type":"A","pts":1,"q":"In Agile RE, a 'Product Backlog' is:","opts":["A list of defects found during testing","A prioritized list of features, enhancements, and requirements to be implemented","The final requirements specification","A list of rejected requirements"],"correct":[1],"exp":"The product backlog is a prioritized, living list of all work items (user stories, features, requirements) for a product, managed by the Product Owner. [K1]"},{"id":"GA-t5-03","type":"A","pts":1,"q":"The MoSCoW prioritization method categorizes requirements as:","opts":["Mandatory, Optional, Structural, Complex, Won't-have","Must have, Should have, Could have, Won't have this time","Most important, Somewhat important, Could add, Won't add","Minimum, Optimal, Scalable, Core, Optional"],"correct":[1],"exp":"MoSCoW: Must have (non-negotiable), Should have (important but not vital), Could have (desirable), Won't have this time (deferred). [K1]"},{"id":"GA-t5-04","type":"A","pts":1,"q":"In the Kano model, 'excitement factors' are requirements that:","opts":["Are absolutely expected and cause dissatisfaction if absent","Are linearly correlated with user satisfaction","Are unexpected features that delight users but don't cause dissatisfaction if absent","Must always be implemented first"],"correct":[2],"exp":"Excitement factors create high satisfaction when present but don't reduce satisfaction when absent. Basic factors cause dissatisfaction when missing. [K2]"},{"id":"GA-t5-05","type":"A","pts":1,"q":"Requirements negotiation is needed when:","opts":["All stakeholders immediately agree on requirements","Conflicting requirements exist between different stakeholder groups","Requirements are already fully documented","Only one stakeholder is involved"],"correct":[1],"exp":"Negotiation resolves conflicts when different stakeholders have contradictory or competing requirements. The RE acts as a mediator to reach acceptable compromise. [K2]"},{"id":"GA-t5-06","type":"A","pts":1,"q":"What is the 'Definition of Done' (DoD) in Agile RE?","opts":["A list of features that will never be implemented","A shared checklist of criteria a user story must meet to be considered complete","The formal acceptance test plan","The project completion certificate"],"correct":[1],"exp":"The DoD is a team agreement on quality criteria (tested, reviewed, documented, deployed) that a user story must satisfy before it is considered done. [K1]"},{"id":"GA-t5-07","type":"A","pts":1,"q":"RE in Agile projects differs from traditional RE primarily in that:","opts":["Agile RE produces no documentation","Requirements are elaborated continuously and iteratively rather than upfront and comprehensively","Agile RE has no validation activities","Stakeholders are not involved in Agile RE"],"correct":[1],"exp":"In Agile, requirements are refined just-in-time in iterations (sprints), avoiding premature elaboration. Traditional RE aims for upfront completeness. [K2]"},{"id":"GA-t5-08","type":"A","pts":1,"q":"Acceptance criteria for a user story should be:","opts":["Written only by developers based on technical feasibility","Specific, testable conditions that the story must satisfy to be accepted","General quality goals for the whole system","Derived from the project budget"],"correct":[1],"exp":"Acceptance criteria (often in Given/When/Then BDD format) define exact conditions for acceptance, bridging requirements and testing. [K2]"},{"id":"GA-t5-09","type":"A","pts":1,"q":"'Backlog refinement' in Scrum refers to:","opts":["Deleting old or irrelevant user stories","The ongoing process of reviewing, updating, estimating, and prioritizing backlog items","Creating the initial product backlog at project start","Writing test cases for backlog items"],"correct":[1],"exp":"Backlog refinement is a regular activity where the team reviews items, adds detail, estimates effort, and re-prioritizes to keep the backlog healthy. [K2]"},{"id":"GA-t5-10","type":"A","pts":1,"q":"What does 'requirements negotiation' involve?","opts":["Forcing the most important stakeholder's requirements on others","A facilitated process to resolve conflicts and reach agreement on requirements","Removing requirements to reduce project scope","Delegating requirement decisions to the development team"],"correct":[1],"exp":"Requirements negotiation involves facilitated discussion between conflicting stakeholders to find mutually acceptable solutions. The RE facilitates but does not impose. [K2]"},{"id":"GK-t5-01","type":"K","pts":2,"q":"For each statement about RE in Agile, indicate True or False:","stmts":["User stories replace the need for any requirements documentation in Agile","Acceptance criteria define when a user story is considered complete","The Product Owner is responsible for prioritizing the product backlog","Agile RE does not include any validation activities"],"correct":[false,true,true,false],"exp":"A) False — user stories are supplemented by acceptance criteria and conversations. B) True. C) True. D) False — sprint reviews are validation activities. [K2]"},{"id":"GK-t5-02","type":"K","pts":2,"q":"For each statement about requirements prioritization, indicate True or False:","stmts":["MoSCoW helps stakeholders distinguish must-have from nice-to-have requirements","In Kano model, basic factors cause satisfaction when present and dissatisfaction when absent","Cost-benefit analysis ranks requirements by return on investment","All prioritization methods require a formal mathematical model"],"correct":[true,false,true,false],"exp":"A) True. B) False — basic factors only cause dissatisfaction when absent; presence is expected, not delighting. C) True. D) False — MoSCoW and voting are informal. [K2]"},{"id":"GK-t5-03","type":"K","pts":2,"q":"For each statement about the problem/solution space, indicate True or False:","stmts":["The problem space contains stakeholder needs and goals to be addressed","A RE should define the solution space before fully understanding the problem space","The solution space contains possible systems that address the problem space","Understanding the problem space before defining solutions reduces costly rework"],"correct":[true,false,true,true],"exp":"A) True. B) False — jumping to solutions without understanding problems leads to building the wrong system. C) True. D) True. [K3]"},{"id":"GK-t5-04","type":"K","pts":2,"q":"For each statement about Agile user stories, indicate True or False:","stmts":["User stories capture who wants a capability, what capability, and why","Epics are large user stories that can be broken into smaller stories","User stories do not need acceptance criteria to be useful","The INVEST criteria for user stories include Independent, Negotiable, and Testable"],"correct":[true,true,false,true],"exp":"A) True. B) True. C) False — acceptance criteria are essential to define 'done'. D) True — INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable. [K2]"},{"id":"GK-t5-05","type":"K","pts":2,"q":"For each statement about the RE process, indicate True or False:","stmts":["RE activities are always performed in strict sequential order","Requirements can be elaborated just-in-time as development needs arise","Validation should only occur at the end of the RE process","RE is a continuous activity throughout the project lifecycle"],"correct":[false,true,false,true],"exp":"A) False — RE activities are iterative and interleaved. B) True. C) False — early validation catches defects cheaply. D) True. [K2]"},{"id":"GK-t5-06","type":"K","pts":2,"q":"For each statement about requirements conflicts, indicate True or False:","stmts":["Conflicts always indicate that one stakeholder is wrong","Requirements conflicts can arise from stakeholders having different priorities","Negotiation is a technique to resolve conflicting requirements","Conflicting requirements can coexist in a specification without any problem"],"correct":[false,true,true,false],"exp":"A) False — conflicts arise from different valid perspectives. B) True. C) True. D) False — conflicts make the spec inconsistent and must be resolved. [K3]"},{"id":"GK-t5-07","type":"K","pts":2,"q":"For each statement about the cost of requirements defects, indicate True or False:","stmts":["RE activities are only relevant during project initiation","Requirements should be revisited when the system context changes","Late requirements changes are typically more expensive than early ones","The cost of fixing requirements defects decreases as the project progresses"],"correct":[false,true,true,false],"exp":"A) False — RE spans the entire lifecycle. B) True. C) True — well-known cost escalation curve. D) False — cost INCREASES with phase. [K2]"},{"id":"R6-t5-01","type":"A","pts":1,"q":"The TARGET facet of RE process configuration distinguishes between: (1 answer)","opts":["Linear and iterative development","Prescriptive and explorative purposes","Customer-specific and market-oriented systems","Manual and automated testing"],"correct":[2],"exp":"Time = linear/iterative, Purpose = prescriptive/explorative, Target = customer-specific/market-oriented (handbook 5.2.3)."},{"id":"R6-t5-02","type":"K","pts":2,"q":"Decide true or false about the three RE process facets.","stmts":["The three facets are time, purpose, and target","\"Interaction\" is one of the three IREB process facets","Each facet has two instances (e.g. linear vs iterative)","The facets can be combined to configure a project-specific RE process"],"correct":[true,false,true,true],"exp":"Facets: time (linear/iterative), purpose (prescriptive/explorative), target (customer-specific/market-oriented). \"Interaction\" is not a facet."},{"id":"R6-t5-03","type":"A","pts":1,"q":"A prescriptive RE process purpose means: (1 answer)","opts":["Requirements emerge gradually through experimentation","The requirements prescribe the system to be built and must be specified up front","The process forbids documentation","Only quality requirements are produced"],"correct":[1],"exp":"Prescriptive: requirements are binding input (e.g. regulated/tender contexts). Explorative: requirements are discovered through feedback."},{"id":"R6-t5-04","type":"P","pts":2,"q":"Which TWO conditions favour an ITERATIVE time facet? (2 answers)","opts":["High requirements volatility and uncertainty","A need for early and frequent stakeholder feedback","A fixed-price contract demanding a complete spec before signing","A perfectly stable, fully known problem domain","Regulatory demand for a complete upfront safety case"],"need":2,"correct":[0,1],"exp":"Volatility and feedback needs drive iteration; complete-upfront contractual or regulatory contexts push toward linear."},{"id":"R6-t5-05","type":"A","pts":1,"q":"In MARKET-ORIENTED RE, who typically substitutes for the (unavailable) end customers as requirement source and validator? (1 answer)","opts":["The legal department","Internal proxies such as product management, supported by market research","The database administrator","No one - requirements are skipped"],"correct":[1],"exp":"For market products, product managers/marketing act as stakeholder proxies, using research, personas, A/B feedback, etc."},{"id":"R6-t5-06","type":"K","pts":2,"q":"Decide true or false about typical facet combinations.","stmts":["A contractual bespoke safety system is typically linear, prescriptive, and customer-specific","A consumer app for an open market is typically iterative, explorative, and market-oriented","A participatory configuration with continuous customer involvement is typically iterative","Only these named combinations are allowed - other mixes are forbidden"],"correct":[true,true,true,false],"exp":"The three named patterns are typical, not exhaustive - facets can in principle be combined as the project requires."},{"id":"R6-t5-07","type":"A","pts":1,"q":"A ministry issues a public tender requiring a complete, binding specification that bidders price against. Which configuration fits? (1 answer)","opts":["Iterative + explorative + market-oriented","Linear + prescriptive + customer-specific","Iterative + prescriptive + market-oriented","Linear + explorative + market-oriented"],"correct":[1],"exp":"A tender demands complete upfront binding requirements for one specific customer: the classic contractual configuration."},{"id":"R6-t5-08","type":"P","pts":2,"q":"A team chose a LINEAR process although the domain is highly volatile. Which TWO consequences are most likely? (2 answers)","opts":["Late discovery that specified requirements no longer match real needs","Expensive change requests against the frozen specification","Requirements validation becomes unnecessary","Stakeholder feedback arrives earlier than in an iterative process","The product backlog refines itself"],"need":2,"correct":[0,1],"exp":"Linear + volatility = the spec ages while reality moves: late mismatch discoveries and costly formal changes."},{"id":"R6-t5-09","type":"A","pts":1,"q":"In an EXPLORATIVE purpose configuration, requirements are primarily: (1 answer)","opts":["Fixed in a contract before development","Discovered and refined through building increments and gathering feedback","Copied from the predecessor system","Derived only from standards"],"correct":[1],"exp":"Explorative RE treats requirements as hypotheses to be tested through increments and feedback loops."},{"id":"R6-t5-10","type":"K","pts":2,"q":"Decide true or false about RE within agile development.","stmts":["Agile projects still perform elicitation, documentation, validation, and management - often continuously","The product backlog acts as a living container for requirements","Agile development makes requirements validation obsolete","Backlog refinement is a recurring RE activity"],"correct":[true,true,false,true],"exp":"Agile changes the cadence and granularity of RE, not its existence; reviews/refinement embody continuous validation and elaboration."},{"id":"R6-t5-11","type":"A","pts":1,"q":"For a market-oriented product, acceptance of the delivered increments is typically declared by: (1 answer)","opts":["Each individual anonymous end user","Internal stakeholders such as the product manager on behalf of the market","The competitor","The hosting provider"],"correct":[1],"exp":"Without a single contracting customer, internal proxies (product management) accept on behalf of the target market."},{"id":"R6-t5-12","type":"P","pts":2,"q":"Which TWO influencing factors should drive RE process configuration? (2 answers)","opts":["Availability and proximity of stakeholders for feedback","Regulatory and contractual constraints on the project","The font used in the specification","The brand of the development laptops","The astrological sign of the product owner"],"need":2,"correct":[0,1],"exp":"Stakeholder availability and regulatory/contract context are genuine configuration drivers (alongside volatility, criticality, etc.)."},{"id":"R6-t5-13","type":"A","pts":1,"q":"\"Configuring the RE process\" in FL3 means: (1 answer)","opts":["Buying a workflow tool","Selecting an appropriate instance for each facet based on project factors","Copying the process of the previous project unchanged","Letting each developer pick their own process privately"],"correct":[1],"exp":"Configuration = consciously choosing per facet (time, purpose, target) based on influencing factors."},{"id":"R6-t5-14","type":"K","pts":2,"q":"Decide true or false about the TIME facet.","stmts":["Linear means requirements are essentially specified in one pass before development","Iterative means requirements are developed in repeated cycles","A linear process maximises the speed of feedback from real users","Stable, well-understood domains tolerate linear processes well"],"correct":[true,true,false,true],"exp":"Linear defers user feedback to late phases - that is its key weakness; it suits stable domains."},{"id":"R6-t5-15","type":"A","pts":1,"q":"A startup pivots its consumer product weekly based on usage analytics. Which configuration matches? (1 answer)","opts":["Linear + prescriptive + customer-specific","Iterative + explorative + market-oriented","Linear + explorative + customer-specific","Iterative + prescriptive + customer-specific"],"correct":[1],"exp":"Fast feedback loops, discovery-driven requirements, anonymous market: iterative, explorative, market-oriented."}],"t6":[{"id":"K0819","official":true,"type":"K","pts":2,"q":"Views on requirements — true or false?","stmts":["Not every stakeholder needs to have access to all requirements.","Requirements that belong together can be grouped to support the review.","Requirements can be hidden from unauthorized stakeholders.","It is assured that several people can work on one specification at the same time."],"correct":[true,true,true,false],"exp":"A, B, C are true uses of views. D is false — a view does not by itself guarantee concurrent multi-user editing."},{"id":"A0820","official":true,"type":"A","pts":1,"q":"The traceability of requirements has several goals. Indicate the statement that is NOT correct. (1 answer)","opts":["Traceability facilitates an impact analysis.","Traceability facilitates the verification of implementation.","Traceability facilitates exports from a requirements management tool.","Traceability facilitates finding a requirement's source."],"correct":[2],"exp":"Impact analysis, verification, and source-finding are traceability goals. Facilitating tool exports is not a goal of traceability."},{"id":"K0821","official":true,"type":"K","pts":2,"q":"Unique identifiers are helpful... — true or false?","stmts":["... for estimating the overall size of a specification.","... for having an unambiguous basis for communication.","... for establishing references to other requirements.","... for establishing traceability to other development artifacts."],"correct":[false,true,true,true],"exp":"A False — identifiers don't estimate size. B, C, D True — unique IDs enable unambiguous reference, linking, and traceability."},{"id":"P0838","official":true,"type":"P","pts":2,"need":2,"q":"After delivering a baseline, change requests arrive. Which represent correct change management? (2 answers)","opts":["Changes to baseline requirements are implemented by creating new versions within this baseline.","Before adjusting requirements to change requests, the impact of the changes has to be determined.","Change requests can be submitted any time and may be considered for a future baseline.","Time-critical change requests are neither analyzed nor estimated but delivered directly to development.","If development for changed requirements has not started, the change can be processed without a new baseline."],"correct":[1,2],"exp":"B — impact analysis precedes change. C — CRs can arrive anytime and feed a future baseline. A is wrong (a baseline is fixed; changes go to a new baseline). D skips analysis (unsafe). E mishandles baseline control."},{"id":"K0802","official":true,"type":"K","pts":2,"q":"A reason for prioritizing is... — true or false?","stmts":["... to decide which requirements are to be implemented in the next release.","... to decide on which requirements to focus first in testing.","... to document how much it would cost to implement a requirement.","... to recognize which requirements can be reused."],"correct":[true,true,false,false],"exp":"A, B True — prioritisation drives release scoping and test focus. C is cost estimation (a different attribute). D is reuse identification, not a prioritisation reason."},{"id":"A0804","official":true,"type":"A","pts":1,"q":"Select the best description of a baseline. (1 answer)","opts":["A version of a requirement","A released configuration of an individual requirement","A released configuration of requirements","A not yet released version of a requirements specification"],"correct":[2],"exp":"A baseline is a released (fixed, approved) configuration of a set of requirements."},{"id":"G6-01","type":"A","pts":1,"q":"Traceability that links a requirement back to its origin is called: (1 answer)","opts":["Pre-RS (backward-to-source) traceability","Forward-to-implementation traceability","Horizontal traceability only","No traceability"],"correct":[0],"exp":"Linking to the requirement's source/origin is pre-requirements-specification (backward) traceability."},{"id":"G6-02","type":"P","pts":2,"need":2,"q":"Which two are common prioritisation criteria? (2 answers)","opts":["Business value","Risk","Stakeholder's shoe size","Office location","Day of week"],"correct":[0,1],"exp":"Value and risk are standard prioritisation criteria (also cost, urgency, dependencies)."},{"id":"G6-03","type":"K","pts":2,"q":"Decide true/false about requirements attributes.","stmts":["Priority is a requirement attribute.","A unique identifier supports traceability.","Status (e.g. proposed/approved) is never an attribute.","Source is a useful attribute for traceability to origin."],"correct":[true,true,false,true],"exp":"Status is a common, useful attribute — so 'never' is false. The rest are correct."},{"id":"G6-04","type":"A","pts":1,"q":"Configuration management of requirements primarily ensures: (1 answer)","opts":["Controlled versioning and reproducible baselines.","Faster typing speed.","Elimination of all stakeholders.","That no requirement ever changes."],"correct":[0],"exp":"CM provides version control and reproducible, released baselines."},{"id":"G6-05","type":"P","pts":2,"need":2,"q":"Which two are goals of requirements traceability? (2 answers)","opts":["Impact analysis","Verifying implementation coverage","Increasing document length","Hiding the source","Reducing stakeholder count"],"correct":[0,1],"exp":"Impact analysis and coverage verification are core traceability goals."},{"id":"G6-06","type":"A","pts":1,"q":"A 'view' on requirements is used to: (1 answer)","opts":["Present a stakeholder-relevant subset of requirements.","Permanently delete requirements.","Encrypt the whole repository.","Replace prioritisation."],"correct":[0],"exp":"Views show a tailored, role-relevant subset of the requirements."},{"id":"G6-07","type":"K","pts":2,"q":"Decide true/false about change management.","stmts":["A change control board can decide on change requests.","Impact analysis should precede approving a change.","Approved changes never need a new baseline.","Change requests should be logged and tracked."],"correct":[true,true,false,true],"exp":"Approved changes to a released baseline generally produce a new baseline — so C is false."},{"id":"G6-08","type":"A","pts":1,"q":"Which is a capability you would expect from a requirements management tool? (1 answer)","opts":["Maintaining traceability links and requirement attributes.","Compiling C++ code.","Rendering 3D game graphics.","Booking flights."],"correct":[0],"exp":"RM tools maintain attributes, versions, and traceability links."},{"id":"G6-09","type":"A","pts":1,"q":"Versioning differs from baselining because a version: (1 answer)","opts":["Tracks the evolution of a single artifact over time, while a baseline fixes a released set.","Is always released and approved.","Cannot change.","Applies only to source code."],"correct":[0],"exp":"A version is a point in an artifact's history; a baseline is an approved, fixed configuration of a set."},{"id":"G6-10","type":"P","pts":2,"need":2,"q":"Which two attributes are commonly attached to requirements for management? (2 answers)","opts":["Priority","Status","Favourite colour","Astrological sign","Random number"],"correct":[0,1],"exp":"Priority and status are standard management attributes."},{"id":"N6-01","type":"A","pts":1,"q":"Which attribute of a requirement provides a stable, unambiguous reference for communication and traceability? (1 answer)","opts":["Unique identifier","Priority","Status","Author"],"correct":[0],"exp":"A unique identifier (ID) provides an unambiguous, stable reference. Priority, status, and author are also useful attributes but they change over time and are not primarily for identification."},{"id":"N6-02","type":"K","pts":2,"q":"Decide true or false about requirements attributes.","stmts":["Priority is a requirements attribute used to decide implementation order.","Status (e.g. draft, approved, implemented) is a requirements attribute.","All requirements must have the same set of attributes in every project.","The source/origin of a requirement is a useful traceability attribute."],"correct":[true,true,false,true],"exp":"A and B are standard requirement attributes. C False — attribute sets are configured per project based on needs. D True — knowing the source enables forward and backward traceability."},{"id":"N6-03","type":"P","pts":2,"need":2,"q":"Which two goals does requirements traceability serve? (2 answers)","opts":["Impact analysis — assessing which artefacts are affected by a change.","Automatically generating source code from requirements.","Verification — confirming that all requirements have been implemented.","Replacing the need for stakeholder communication.","Generating UML diagrams automatically."],"correct":[0,2],"exp":"Traceability supports impact analysis (change management) and implementation verification. Code generation and automatic diagram generation are tool features unrelated to the goals of traceability itself."},{"id":"N6-04","type":"A","pts":1,"q":"A 'version' of a requirement differs from a 'baseline' in that: (1 answer)","opts":["A version is a single state of one requirement; a baseline is a released configuration of a set of requirements.","Versions are always released; baselines are always draft.","A baseline contains only one requirement.","Versions and baselines are synonymous."],"correct":[0],"exp":"A version tracks the history of a single requirement. A baseline is a released, agreed snapshot of the entire (or a subset of) requirements set used as a reference for change management."},{"id":"N6-05","type":"K","pts":2,"q":"Decide true or false about prioritisation techniques.","stmts":["The MoSCoW method classifies requirements as Must have, Should have, Could have, and Won't have.","Prioritisation eliminates requirements with low priority from the project.","Kano analysis can inform prioritisation by categorising requirements as satisfiers, dissatisfiers, or delighters.","Prioritisation helps decide which requirements to implement in a given release."],"correct":[true,false,true,true],"exp":"A True. B False — low-priority requirements remain in the backlog for future releases; they are not eliminated. C True — Kano provides a value-based rationale for prioritisation. D True."},{"id":"N6-06","type":"A","pts":1,"q":"Before a change request is implemented, what must ALWAYS be performed according to IREB FL3 change management? (1 answer)","opts":["An impact analysis to assess which requirements, artefacts, and systems are affected.","A full system retest.","Approval by the CEO.","Deletion of the original requirement from the baseline."],"correct":[0],"exp":"Impact analysis is mandatory before implementing any change. It identifies all downstream artefacts and costs, enabling informed decision-making."},{"id":"N6-07","type":"P","pts":2,"need":2,"q":"Which two are correct statements about requirements management tools? (2 answers)","opts":["They support traceability by linking requirements to each other and to other artefacts.","They eliminate the need for stakeholder communication.","They can support version control of individual requirements.","They automatically resolve all requirements conflicts.","They replace the need for a requirements baseline."],"correct":[0,2],"exp":"RM tools link artefacts (traceability) and track versions. They do not replace communication, automatically resolve conflicts, or replace baselines — those are process activities."},{"id":"N6-08","type":"A","pts":1,"q":"A requirement's 'status' attribute is MOST useful for: (1 answer)","opts":["Tracking progress of a requirement through its lifecycle (draft → reviewed → approved → implemented).","Measuring how long it takes to write requirements.","Identifying who will test the requirement.","Calculating the project budget."],"correct":[0],"exp":"Status tracks lifecycle state. It enables teams to know which requirements are approved, under review, or implemented — essential for project control."},{"id":"N6-09","type":"K","pts":2,"q":"Decide true or false about views on requirements.","stmts":["A view filters or presents a subset of requirements relevant to a specific stakeholder group.","Different stakeholders can see different views of the same requirements set.","Views physically duplicate requirements into separate documents.","Grouping related requirements into a view can support review activities."],"correct":[true,true,false,true],"exp":"A and B are correct definitions of views. C False — views are logical filters/presentations, not physical copies. D True."},{"id":"N6-10","type":"A","pts":1,"q":"Why is it important to establish a requirements BASELINE before handing requirements to development? (1 answer)","opts":["A baseline provides a stable, agreed reference point from which changes can be formally managed.","A baseline permanently prevents any future changes to requirements.","A baseline eliminates the need for a glossary.","A baseline is only needed for safety-critical projects."],"correct":[0],"exp":"A baseline is a released, approved snapshot. Future changes are managed against it via change requests. It does not prevent change — it controls it. All projects benefit from baselining."},{"id":"GA-t6-01","type":"A","pts":1,"q":"What is a 'change request' in requirements management?","opts":["An informal request by a developer to add a feature","A formal documented proposal to modify one or more baselined requirements","An automatic update made by the RM tool","A request to delete the requirements specification"],"correct":[1],"exp":"A change request is a formal document proposing a modification to a baselined requirement, including rationale, impact analysis, and approval status. [K1]"},{"id":"GA-t6-02","type":"A","pts":1,"q":"Impact analysis in requirements management is used to:","opts":["Determine the financial impact of a project failure","Identify all system elements affected by a proposed requirement change","Analyze system performance under load","Calculate the number of stakeholders affected"],"correct":[1],"exp":"Impact analysis assesses which requirements, design elements, code modules, and tests are affected when a requirement changes. [K1]"},{"id":"GA-t6-03","type":"A","pts":1,"q":"What is a 'requirements baseline'?","opts":["The first draft of a requirements specification","A formally approved snapshot of requirements at a specific point in time, from which changes are controlled","The minimum set of requirements for the system to function","Requirements written by the baseline team"],"correct":[1],"exp":"A baseline is a fixed, formally approved version of requirements. Any change requires a formal change request process. [K1]"},{"id":"GA-t6-04","type":"A","pts":1,"q":"The Change Control Board (CCB) is responsible for:","opts":["Writing new requirements on behalf of stakeholders","Reviewing, approving, or rejecting proposed changes to baselined requirements","Managing daily development activities","Conducting acceptance testing"],"correct":[1],"exp":"The CCB evaluates change requests, assessing impact and business value before approving or rejecting them. [K2]"},{"id":"GA-t6-05","type":"A","pts":1,"q":"Forward traceability in requirements management links requirements to:","opts":["Their originating stakeholders and business goals","Design documents, code components, and test cases","Previous versions of the same requirement","Other requirements at the same level"],"correct":[1],"exp":"Forward traceability links requirements to downstream artifacts (design, implementation, tests) enabling coverage analysis. [K1]"},{"id":"GA-t6-06","type":"A","pts":1,"q":"Backward traceability links requirements to:","opts":["Future system versions and enhancements","Their sources: stakeholder needs, business goals, regulations","Design patterns and architectural decisions","Project management artifacts like the WBS"],"correct":[1],"exp":"Backward traceability links requirements back to their sources (why this requirement exists), justifying requirements and assessing change impacts. [K1]"},{"id":"GA-t6-07","type":"A","pts":1,"q":"Which is the correct sequence for handling a change request?","opts":["Implement → Assess → Submit → Approve","Submit → Assess impact → Approve/Reject → Implement → Verify","Approve → Submit → Implement → Assess","Submit → Implement → Approve → Verify"],"correct":[1],"exp":"Proper change control: Submit CR → Impact analysis → CCB decision → Implementation → Verification. Implementing before approval bypasses governance. [K2]"},{"id":"GA-t6-08","type":"A","pts":1,"q":"Requirements reuse refers to:","opts":["Using the same test cases for multiple requirements","Applying requirements from previous projects to new projects with similar needs","Rewriting requirements in multiple formats for different audiences","Copying stakeholder feedback verbatim into the requirements document"],"correct":[1],"exp":"Requirements reuse applies previously validated requirements to new projects in similar domains, reducing elicitation and documentation effort. [K2]"},{"id":"GA-t6-09","type":"A","pts":1,"q":"A requirements status of 'verified' means:","opts":["The requirement has been identified but not yet approved","The requirement has been approved, implemented, and testing confirms the implementation is correct","The requirement is waiting for stakeholder review","The requirement has been rejected"],"correct":[1],"exp":"'Verified' status means: proposed → approved → implemented → testing confirmed correct in the system. [K1]"},{"id":"GK-t6-01","type":"K","pts":2,"q":"For each statement about requirements change management, indicate True or False:","stmts":["Baselines prevent any changes from being made to requirements","Impact analysis is performed before approving a change request","The CCB evaluates the business value and risk of proposed changes","Informal verbal change requests are sufficient for formally managed projects"],"correct":[false,true,true,false],"exp":"A) False — baselines control changes through formal process, not prevent them. B) True. C) True. D) False — formal projects require documented CRs. [K2]"},{"id":"GK-t6-02","type":"K","pts":2,"q":"For each statement about requirements traceability, indicate True or False:","stmts":["Traceability supports impact analysis when requirements change","Maintaining traceability is effortless and requires no ongoing investment","A traceability matrix maps requirements to other artifacts like tests","Traceability must always be implemented with a dedicated tool to be valid"],"correct":[true,false,true,false],"exp":"A) True. B) False — maintaining traceability requires significant effort. C) True. D) False — spreadsheets can maintain traceability, though tools help. [K2]"},{"id":"GK-t6-03","type":"K","pts":2,"q":"For each statement about requirements versioning, indicate True or False:","stmts":["Version control enables rollback to previous requirement states","Only the latest version of a requirement should ever be stored","Requirements versioning supports auditing who changed what and when","Configuration management tools can be used to version requirements documents"],"correct":[true,false,true,true],"exp":"A) True. B) False — all versions should be retained for audit and reference. C) True. D) True. [K2]"},{"id":"GK-t6-04","type":"K","pts":2,"q":"For each statement about requirements status, indicate True or False:","stmts":["A requirement with status 'proposed' has been approved for implementation","Requirements can have statuses such as proposed, approved, implemented, and verified","Once approved, a requirement's status can never change again","Tracking requirement status helps the team understand project progress"],"correct":[false,true,false,true],"exp":"A) False — proposed means submitted, not yet approved. B) True. C) False — status changes as the requirement evolves. D) True. [K2]"},{"id":"GK-t6-05","type":"K","pts":2,"q":"For each statement about configuration management in RE, indicate True or False:","stmts":["Configuration management controls which versions of artifacts are current and approved","CM only applies to source code and not to requirements documents","A configuration item can be a requirements document, design document, or test plan","Requirements baselines are a form of configuration management"],"correct":[true,false,true,true],"exp":"A) True. B) False — CM applies to all project artifacts including requirements. C) True. D) True — baselines are a CM concept applied to requirements. [K2]"},{"id":"GP-t6-01","type":"P","pts":1,"need":2,"q":"Which TWO of the following activities are part of requirements change management?","opts":["Impact analysis of proposed changes","Initial elicitation of requirements","Formal change request submission and tracking","Developing the system architecture"],"correct":[0,2],"exp":"Change management involves impact analysis and formal change request process. Elicitation and architecture are separate activities. [K1]"},{"id":"GP-t6-02","type":"P","pts":1,"need":2,"q":"Which TWO of the following describe benefits of requirements traceability?","opts":["Enables impact analysis when requirements change","Automatically implements requirements as code","Supports verification coverage (every requirement has tests)","Replaces the need for requirements documentation"],"correct":[0,2],"exp":"Traceability enables impact analysis and coverage verification. It does not auto-generate code or replace documentation. [K2]"},{"id":"GP-t6-03","type":"P","pts":1,"need":2,"q":"Which TWO of the following are valid requirements status values?","opts":["Proposed","Archived in the cloud","Verified","Forwarded to the vendor"],"correct":[0,2],"exp":"Standard status values: proposed, approved, implemented, verified, rejected, deferred. Cloud archiving and vendor forwarding are not requirement status values. [K1]"},{"id":"GP-t6-04","type":"P","pts":1,"need":2,"q":"Which TWO of the following best describe what a traceability matrix contains?","opts":["Mappings from requirements to test cases","Employee performance ratings","Links from requirements to design elements","Project financial statements"],"correct":[0,2],"exp":"A traceability matrix links requirements to other artifacts: test cases, design elements, code modules. Financial and HR data are not included. [K1]"},{"id":"GP-t6-05","type":"P","pts":1,"need":2,"q":"Which TWO of the following are characteristics of a good change request?","opts":["Describes the proposed change with clear rationale","Is submitted verbally with no written record","Includes an impact assessment on other requirements and project artifacts","Can be implemented immediately without review"],"correct":[0,2],"exp":"Good CRs have: clear change description with rationale, and impact analysis. They require written documentation and formal review before implementation. [K2]"},{"id":"R6-t6-01","type":"A","pts":1,"q":"Before requirements can be prioritized, what must be established FIRST according to IREB? (1 answer)","opts":["The implementation order of design components","The goal of the prioritization and the assessment criteria derived from it","The list of test cases","The development team's vacation plan"],"correct":[1],"exp":"Prioritization needs a defined purpose (e.g. scope for release 1) from which criteria (value, risk, cost...) are derived before assessing requirements."},{"id":"R6-t6-02","type":"K","pts":2,"q":"Decide true or false about prioritization techniques.","stmts":["Simple ranking and top-ten lists are ad-hoc prioritization techniques","The Kano classification can serve as an analytical prioritization input","One single criterion is always sufficient for sound prioritization","Techniques can be combined, e.g. coarse ad-hoc filtering followed by analytical scoring"],"correct":[true,true,false,true],"exp":"Ad-hoc (ranking, top-ten, MoSCoW) and analytical (Kano, cost-value) techniques exist and are often combined; real decisions usually need multiple criteria."},{"id":"R6-t6-03","type":"A","pts":1,"q":"A team scores each requirement by business value and implementation cost, then plots them in a matrix. Requirements with high value and low cost are: (1 answer)","opts":["Discarded","Implemented first","Sent back to elicitation","Automatically converted to constraints"],"correct":[1],"exp":"Value/cost matrices identify \"quick wins\" - maximum benefit per effort - as top candidates."},{"id":"R6-t6-04","type":"P","pts":2,"q":"Which TWO are sensible assessment criteria for prioritizing requirements? (2 answers)","opts":["Business value contributed by the requirement","Implementation risk or cost of the requirement","The alphabetical position of the requirement title","The font colour in the specification","The author's seniority alone"],"need":2,"correct":[0,1],"exp":"Value, cost, risk, urgency, volatility are legitimate criteria; formatting and authorship are not."},{"id":"R6-t6-05","type":"A","pts":1,"q":"Tracing between artifacts of the SAME type and refinement level (e.g. dependencies among system requirements) is called: (1 answer)","opts":["Vertical traceability","Horizontal traceability","Backward traceability","Forward traceability"],"correct":[1],"exp":"Horizontal traceability links peers (same level); vertical links across levels (goal -> requirement -> design -> test)."},{"id":"R6-t6-06","type":"K","pts":2,"q":"Decide true or false about baselines.","stmts":["A baseline is a stable, agreed snapshot of a set of requirements at a point in time","Baselines can serve as the contractual basis for a release","Creating baselines makes versioning of individual requirements unnecessary","Comparing baselines shows how the requirements set evolved"],"correct":[true,true,false,true],"exp":"Baselines complement (not replace) per-requirement versioning; they anchor contracts/releases and support evolution analysis."},{"id":"R6-t6-07","type":"A","pts":1,"q":"What is the role of a Change Control Board (CCB)? (1 answer)","opts":["Writing all requirements personally","Evaluating change requests (impact, cost, benefit) and deciding accept/reject/defer","Designing the database schema","Conducting daily standups"],"correct":[1],"exp":"The CCB is the decision authority of change management: it assesses analysed change requests and rules on them."},{"id":"R6-t6-08","type":"P","pts":2,"q":"Which TWO items belong in an IMPACT ANALYSIS for a change request? (2 answers)","opts":["Affected requirements and other artifacts identified via traceability","Estimated cost/effort and risk of implementing the change","The next marketing slogan","The CV of the requester","A list of unrelated closed defects"],"need":2,"correct":[0,1],"exp":"Impact analysis determines what is affected (via traces) and what the change costs/risks - the basis for the CCB decision."},{"id":"R6-t6-09","type":"A","pts":1,"q":"Which sequence best reflects a requirement's life cycle states? (1 answer)","opts":["Implemented -> Proposed -> Approved -> Verified","Proposed/Draft -> Approved -> Implemented -> Verified","Verified -> Draft -> Rejected -> Approved","Approved -> Draft -> Proposed -> Implemented"],"correct":[1],"exp":"Typical state machines run from creation (draft/proposed) through approval, implementation, and verification."},{"id":"R6-t6-10","type":"K","pts":2,"q":"Decide true or false about designing a requirements attribute schema.","stmts":["The attribute schema should be tailored to the project's actual information needs","Adding as many attributes as possible always improves management","A requirement's unique ID must never be reused for a different requirement","The status attribute enables progress tracking across the requirements set"],"correct":[true,false,true,true],"exp":"Attributes cost maintenance effort - choose deliberately. IDs are stable forever; status powers progress views."},{"id":"R6-t6-11","type":"A","pts":1,"q":"What is the purpose of defining VIEWS on a requirements repository? (1 answer)","opts":["To hide requirements from the project permanently","To give each audience a tailored subset/projection (e.g. all open safety requirements)","To duplicate requirements for each department","To replace prioritization"],"correct":[1],"exp":"Views are selective projections over attributes - tester views, manager dashboards, etc. - without duplicating data."},{"id":"R6-t6-12","type":"P","pts":2,"q":"In which TWO situations does FULL requirements traceability clearly justify its cost? (2 answers)","opts":["Safety-critical systems where regulators demand evidence from requirement to test","Frequent change requests needing reliable impact analysis","A throwaway weekend hackathon prototype","A static one-page website","A system with a single requirement"],"need":2,"correct":[0,1],"exp":"Traceability pays off where evidence obligations or change frequency are high; for trivial/throwaway work it is overhead."},{"id":"R6-t6-13","type":"A","pts":1,"q":"A requirement is deleted from the repository. What should happen to its unique identifier? (1 answer)","opts":["It is recycled for the next new requirement","It is retired permanently and never assigned again","It is given to the requirement with the closest wording","All remaining IDs are renumbered"],"correct":[1],"exp":"Stable identification demands that IDs are never reused or renumbered - old references must stay unambiguous."},{"id":"R6-t6-14","type":"K","pts":2,"q":"Decide true or false about the change management process.","stmts":["Incoming change requests should be classified (e.g. corrective vs adaptive) before deciding","An impact analysis should precede the implementation decision","Urgent (\"hot fix\") changes never need to enter the change process retrospectively","Decisions and their rationale should be documented"],"correct":[true,true,false,true],"exp":"Classify, analyse, decide, document - and even emergency changes must be brought into the process afterwards to keep the spec consistent."},{"id":"R6-t6-15","type":"A","pts":1,"q":"An auditor asks: \"Prove that safety requirement SR-12 is covered by tests.\" Which RM practice answers this directly? (1 answer)","opts":["Prioritization","Forward traceability from requirement to test cases","Brainstorming","A new glossary entry"],"correct":[1],"exp":"Requirement-to-test traces (forward/vertical traceability) provide exactly this coverage evidence."}],"t7":[{"id":"K0910","official":true,"type":"K","pts":2,"q":"As a Requirements Engineer choosing a tool to support the RE process, decide which statements are true and which are false.","stmts":["The tool has to support the artefacts demanded in the RE process applied.","The choice of a tool should be left to the users of the tool.","The tool has to assist users to set up their test cases as part of the RE process to support shift-left testing.","The choice of a tool is influenced by the tool chain (e.g. configuration management tool) the tool is to be applied in."],"correct":[true,false,false,true],"exp":"A True — the tool must support the artefacts the process actually produces. B False — tool selection is a management/process decision; users are consulted but not solely responsible. C False — setting up test cases is a testing activity; it is not a core RE process requirement for the RE tool. D True — integration with the broader tool chain (e.g. ALM, CM tools) is a key selection criterion."},{"id":"A0922","official":true,"type":"A","pts":1,"q":"Which of the following tasks is NOT a capability of a tool that supports the management of requirements in the RE process? (1 answer)","opts":["Tracking logical relationships between requirements.","Modelling of requirements.","Measuring and reporting of the RE process.","Providing support for the prioritisation of requirements."],"correct":[1],"exp":"Modelling (B) — creating UML/SysML diagrams and other graphical models — is primarily a CASE (Computer-Aided Software Engineering) or modelling tool capability, not a core feature of a requirements MANAGEMENT tool. A (traceability), C (reporting), and D (prioritisation support) are standard RM tool capabilities."},{"id":"N7-01","type":"A","pts":1,"q":"A requirements management tool PRIMARILY supports which RE activity? (1 answer)","opts":["Managing: storing, versioning, tracing, and controlling requirements.","Eliciting: running workshops with stakeholders.","Designing: creating system architecture.","Testing: executing automated test scripts."],"correct":[0],"exp":"RM tools support the management activity — storing, versioning, linking, and controlling access to requirements. They are not primarily elicitation, design, or testing tools."},{"id":"N7-02","type":"K","pts":2,"q":"Decide true or false about criteria for selecting a requirements tool.","stmts":["The tool must fit the RE process and the artefact types produced.","Integration with other tools (e.g. test management, ALM) is a relevant selection criterion.","The vendor's office location is a primary selection criterion.","The number of concurrent users and licensing model affect selection."],"correct":[true,true,false,true],"exp":"A and B are standard tool selection criteria per IREB FL3. C is irrelevant. D True — scalability and cost are practical criteria."},{"id":"N7-03","type":"P","pts":2,"need":2,"q":"Which two are standard capabilities of a requirements management tool? (2 answers)","opts":["Storing requirements with attributes (status, priority, ID).","Automatically eliciting requirements from stakeholders.","Supporting traceability links between requirements and other artefacts.","Writing source code from requirements.","Replacing all stakeholder communication."],"correct":[0,2],"exp":"Storage with attributes and traceability are core RM tool capabilities. Automatic elicitation, code generation, and replacing communication are not."},{"id":"N7-04","type":"A","pts":1,"q":"Which statement about tool-supported traceability is CORRECT? (1 answer)","opts":["Tools can automate the recording and navigation of traceability links, reducing manual effort.","Traceability links can only be created manually; tools offer no support.","Traceability is exclusively a testing tool feature.","Tools that support traceability automatically validate that all requirements are correct."],"correct":[0],"exp":"RM tools automate creation, storage, and navigation of traceability links. They do not validate requirement correctness — that is a review/validation activity."},{"id":"N7-05","type":"K","pts":2,"q":"Decide true or false about RE tool capabilities.","stmts":["A requirements management tool can generate reports on requirement status and coverage.","Tools that support RE can facilitate collaborative reviewing and commenting.","A tool selection made solely on vendor recommendation is best practice.","Tool support for baselining helps enforce change management processes."],"correct":[true,true,false,true],"exp":"A, B, and D are genuine tool capabilities. C False — tool selection must be based on process fit, tool chain integration, and organisational needs — not vendor recommendation alone."},{"id":"N7-06","type":"A","pts":1,"q":"Why is it important that a requirements tool supports the specific RE process being used? (1 answer)","opts":["A tool that does not fit the process forces workarounds that undermine process quality.","All RE tools support all RE processes equally.","The tool drives the process; the process is irrelevant.","Tool-process fit only matters for large projects."],"correct":[0],"exp":"Misalignment between tool and process creates workarounds, reduces adoption, and degrades requirement quality. Process defines what artefacts and workflows the tool must support."},{"id":"N7-07","type":"P","pts":2,"need":2,"q":"Which two considerations are most important when evaluating the USABILITY of a requirements tool? (2 answers)","opts":["Ease of use by the intended user roles (RE, stakeholders, developers).","The tool vendor's stock price.","Training effort required to reach productive use.","The colour theme of the UI.","The physical weight of the server hardware."],"correct":[0,2],"exp":"Ease of use and required training effort are the key usability criteria. Stock price, colour themes, and hardware weight are irrelevant to tool usability."},{"id":"N7-08","type":"A","pts":1,"q":"Which tool capability DIRECTLY supports impact analysis during change management? (1 answer)","opts":["Traceability links between requirements and downstream artefacts.","Spell checking in requirement text.","Automatic test execution.","Code deployment pipelines."],"correct":[0],"exp":"Traceability links let the team navigate from a changed requirement to all linked artefacts (test cases, design elements, code), directly enabling impact analysis."},{"id":"GA-t7-01","type":"A","pts":1,"q":"Which type of RE tool provides functionality for defining and tracking requirements across the project lifecycle?","opts":["Modelling tool","Requirements management tool","Prototyping tool","Build automation tool"],"correct":[1],"exp":"Requirements management tools (e.g., DOORS, JAMA, Polarion) capture, organize, trace, and control changes to requirements throughout the lifecycle. [K1]"},{"id":"GA-t7-02","type":"A","pts":1,"q":"What is the primary purpose of a requirements management tool?","opts":["To draw architecture diagrams","To manage and trace requirements throughout the project lifecycle","To generate and run automated test scripts","To implement the software architecture from requirements"],"correct":[1],"exp":"RM tools provide: requirement storage, versioning, traceability linking, change management, and reporting. [K1]"},{"id":"GA-t7-03","type":"A","pts":1,"q":"Which standard defines an XML-based exchange format for requirements data between tools?","opts":["IEEE 29148","ReqIF (Requirements Interchange Format)","UML 2.5","ISO 25010"],"correct":[1],"exp":"ReqIF (Requirements Interchange Format) is an OMG standard that uses XML to enable tool-independent exchange of requirements data between different RE tools. [K1]"},{"id":"GA-t7-04","type":"A","pts":1,"q":"Which is a key benefit of dedicated RE tools over generic office tools like spreadsheets?","opts":["Always lower initial licensing cost","No training required","Built-in traceability and change tracking capabilities","Simpler, more familiar user interface"],"correct":[2],"exp":"Dedicated RE tools provide built-in traceability, versioning, and change management that spreadsheets cannot efficiently support at scale. [K2]"},{"id":"GA-t7-05","type":"A","pts":1,"q":"A team wants to validate requirements by letting stakeholders interact with an early interface model. Which RE tool type supports this best?","opts":["Requirements management tool","Configuration management tool","Prototyping tool","Build automation tool"],"correct":[2],"exp":"Prototyping tools (e.g., Axure, Balsamiq, Figma) create interactive mockups for stakeholders to validate UI requirements before implementation. [K2]"},{"id":"GA-t7-06","type":"A","pts":1,"q":"Which criterion is MOST important when selecting an RE tool for integration with an existing ALM environment?","opts":["The vendor's social media presence","The tool's graphical interface color scheme","The tool's integration capabilities with the existing toolchain","The physical location of the vendor's headquarters"],"correct":[2],"exp":"In an ALM context, a tool's ability to integrate with existing tools (test management, issue tracking, CI/CD) is paramount for seamless lifecycle traceability. [K3]"},{"id":"GA-t7-07","type":"A","pts":1,"q":"What is 'tool lock-in' in the context of RE tool selection?","opts":["The tool prevents multiple users from accessing it simultaneously","The organization becomes dependent on a tool due to proprietary formats, making migration costly","The tool requires hardware security dongles to operate","The tool locks certain requirements to prevent unauthorized modification"],"correct":[1],"exp":"Tool lock-in occurs when a tool uses proprietary data formats, making it difficult and expensive to migrate. ReqIF export capability mitigates this risk. [K2]"},{"id":"GA-t7-08","type":"A","pts":1,"q":"Which type of RE tool allows engineers to create use case diagrams, state machines, and class diagrams?","opts":["Requirements management tool","Modelling tool","Prototyping tool","Quality assurance tool"],"correct":[1],"exp":"Modelling tools (e.g., Enterprise Architect, MagicDraw) support UML and SysML diagrams as part of the RE process. [K1]"},{"id":"GA-t7-09","type":"A","pts":1,"q":"In ALM, requirements management tools are typically integrated with which other tool types?","opts":["Graphic design and image editing software","Test management and issue/defect tracking tools","Word processors and presentation software only","Database administration tools"],"correct":[1],"exp":"ALM integration connects requirements to test cases (test management) and defects (issue tracking), enabling end-to-end lifecycle traceability. [K2]"},{"id":"GA-t7-10","type":"A","pts":1,"q":"Which of the following is NOT a typical feature of a requirements management tool?","opts":["Requirements versioning and baseline management","Traceability matrix generation","Source code compilation and debugging","Change request tracking and workflow"],"correct":[2],"exp":"RM tools handle versioning, traceability, and change tracking. Source code compilation is the domain of IDEs and build tools, not RM tools. [K1]"},{"id":"GA-t7-11","type":"A","pts":1,"q":"What is the main limitation of a document-based approach to requirements management?","opts":["Higher cost compared to dedicated tools in all cases","Inability to write requirements in natural language","Lack of automatic consistency checking, concurrent editing, and traceability support","Smaller storage capacity than database-backed tools"],"correct":[2],"exp":"Document-based approaches lack: concurrent editing, automatic link management, consistency checks, and structured querying — all provided by database-backed RM tools. [K2]"},{"id":"GA-t7-12","type":"A","pts":1,"q":"Which ReqIF feature makes it particularly valuable in multi-tool RE environments?","opts":["It provides built-in review workflows","It allows standardized exchange of requirements data between different vendor tools","It automatically generates test cases from imported requirements","It replaces the requirements management plan"],"correct":[1],"exp":"ReqIF's key value is vendor-neutral interoperability: teams using different RM tools can exchange requirements without data loss. [K2]"},{"id":"GA-t7-13","type":"A","pts":1,"q":"Tool-supported impact analysis helps RE teams primarily by:","opts":["Automatically implementing requirement changes in code","Identifying which requirements, designs, and tests are affected when one requirement changes","Generating new requirements to fill gaps automatically","Visualizing the software architecture in 3D"],"correct":[1],"exp":"Impact analysis powered by traceability links shows cascading effects of requirement changes across design, code, and test artifacts. [K2]"},{"id":"GA-t7-14","type":"A","pts":1,"q":"Which category of RE tool is MOST appropriate for capturing stakeholder goals and context models?","opts":["Version control tool","Test automation tool","Modelling tool","Network monitoring tool"],"correct":[2],"exp":"Modelling tools capture formal and semi-formal models: use cases, context diagrams, domain models, and goal models. [K2]"},{"id":"GA-t7-15","type":"A","pts":1,"q":"When should an organization consider using a dedicated requirements management tool?","opts":["When the project has fewer than 10 requirements and one stakeholder","When requirements are completely stable and will never change","When the project is large, has many stakeholders, and requires formal traceability","When the team is already proficient with generic office tools"],"correct":[2],"exp":"Dedicated RM tools pay off at scale: many requirements, multiple stakeholders, formal change control, and regulatory traceability. [K3]"},{"id":"GA-t7-16","type":"A","pts":1,"q":"What does an ALM tool provide beyond a standalone requirements management tool?","opts":["Better requirement writing templates","Integration across the full development lifecycle: requirements, design, code, testing, deployment","A larger database for storing requirements","More stakeholder communication channels"],"correct":[1],"exp":"ALM tools (IBM ELM, Azure DevOps, Jira+Confluence) integrate requirements with all development artifacts across the lifecycle. [K2]"},{"id":"GA-t7-17","type":"A","pts":1,"q":"A low-fidelity prototype in RE primarily serves which purpose?","opts":["Final user acceptance testing before system delivery","Early validation of concepts and UI requirements at low cost","Performance benchmarking of the system under load","Documenting the final detailed system architecture"],"correct":[1],"exp":"Low-fidelity prototypes (paper sketches, wireframes) enable cheap early validation of UI concepts and requirements before significant investment. [K2]"},{"id":"GA-t7-18","type":"A","pts":1,"q":"What is a key advantage of database-backed RM tools over document-based tools?","opts":["They are always cheaper to license","They support concurrent access, structured querying, version history, and automatic traceability","They require no training to use","They automatically generate requirements from stakeholder interviews"],"correct":[1],"exp":"Database-backed tools enable: concurrent multi-user editing, powerful search/filter, automatic traceability links, and complete version history. [K2]"},{"id":"GA-t7-19","type":"A","pts":1,"q":"Which of the following describes a quality assurance tool in the RE context?","opts":["A tool that generates user interface wireframes","A tool that checks requirements for defects like ambiguity, incompleteness, or inconsistency","A tool that manages project budget and resources","A tool that tracks source code changes"],"correct":[1],"exp":"RE quality tools analyze requirement text for common defects: ambiguous language, missing information, contradictions, and unverifiable statements. [K1]"},{"id":"GA-t7-20","type":"A","pts":1,"q":"The ReqIF standard is maintained by which organization?","opts":["IEEE","ISO","OMG (Object Management Group)","IREB"],"correct":[2],"exp":"ReqIF is an OMG standard, the same organization that maintains UML, BPMN, and other modeling standards. [K1]"},{"id":"GA-t7-21","type":"A","pts":1,"q":"Which of the following is a benefit of using modelling tools in RE?","opts":["They eliminate the need for stakeholder communication","They create formal or semi-formal representations that reduce ambiguity and enable analysis","They automatically generate production-ready code from models","They reduce the total number of requirements"],"correct":[1],"exp":"Models provide structured, precise representations of requirements that are less prone to ambiguity than pure natural language and can be analyzed for consistency. [K2]"},{"id":"GK-t7-01","type":"K","pts":2,"q":"For each statement about RE tool categories, indicate True or False:","stmts":["Prototyping tools are primarily used for managing requirement version histories","Modelling tools can be used to create UML and SysML diagrams as part of RE","Requirements management tools typically provide traceability between requirements","ALM tools integrate requirements with other development lifecycle activities"],"correct":[false,true,true,true],"exp":"A) False — prototyping tools build interactive models for validation, not version management. B) True. C) True. D) True. [K1]"},{"id":"GK-t7-02","type":"K","pts":2,"q":"For each statement about ReqIF, indicate True or False:","stmts":["ReqIF is a proprietary format owned by a single tool vendor","ReqIF enables tool-independent exchange of requirements data","ReqIF is based on XML","ReqIF can only transfer requirement text, not attributes or relationships"],"correct":[false,true,true,false],"exp":"A) False — ReqIF is an OMG standard, open and vendor-neutral. B) True. C) True — XML-based. D) False — ReqIF transfers requirements with full attributes and relationships. [K1]"},{"id":"GK-t7-03","type":"K","pts":2,"q":"For each statement about tool selection criteria, indicate True or False:","stmts":["Integration with existing toolchain is an important tool selection criterion","The vendor's logo and marketing materials are the primary selection criteria","Learning curve and training effort should be considered when selecting an RE tool","Total cost of ownership includes licensing, training, integration, and maintenance"],"correct":[true,false,true,true],"exp":"A) True. B) False — functionality, integration, usability, and cost are key criteria. C) True. D) True — TCO includes all cost dimensions. [K2]"},{"id":"GK-t7-04","type":"K","pts":2,"q":"For each statement about tool support for prototyping, indicate True or False:","stmts":["Prototyping tools let stakeholders experience proposed behaviour before implementation","A prototyping tool removes the need to document the validated requirements","GUI builders can produce cheap throwaway prototypes for validation","Prototypes built with tools can never evolve into the final product"],"correct":[true,false,true,false],"exp":"Prototyping tools support validation by making requirements tangible (A true, C true). Validated findings must still be documented as requirements (B false). Evolutionary prototypes can grow into the product (D false)."},{"id":"GK-t7-05","type":"K","pts":2,"q":"For each statement about tool-supported traceability, indicate True or False:","stmts":["Traceability tools can create links from requirements to test cases","Automatic traceability links never need human review","Tool-supported traceability enables impact analysis when requirements change","Traceability in RE tools must always be bidirectional"],"correct":[true,false,true,false],"exp":"A) True. B) False — automated links should be reviewed; humans validate. C) True. D) False — some projects only require one-directional traceability. [K2]"},{"id":"GK-t7-06","type":"K","pts":2,"q":"For each statement about limitations of RE tools, indicate True or False:","stmts":["RE tools can create a false sense of quality if requirements content is poor","Tool adoption requires training investment that may initially reduce productivity","Tool-generated traceability matrices are always complete and accurate without human review","Proprietary data formats in RM tools can create tool lock-in risk"],"correct":[true,true,false,true],"exp":"A) True — garbage in, garbage out. B) True — learning curve exists. C) False — tools assist but human verification is needed. D) True. [K2]"},{"id":"GK-t7-07","type":"K","pts":2,"q":"For each statement about ALM tool integration, indicate True or False:","stmts":["ALM tools integrate requirements with design, testing, and deployment activities","ALM integration helps trace requirements through to test results and defects","Using separate disconnected tools is equally effective as an integrated ALM environment","ALM tools support end-to-end traceability across the development lifecycle"],"correct":[true,true,false,true],"exp":"A) True. B) True. C) False — disconnected tools create silos and loss of traceability. D) True. [K2]"},{"id":"GP-t7-01","type":"P","pts":1,"need":2,"q":"Which TWO of the following are primary categories of RE tools recognized in IREB?","opts":["Requirements management tools","Payroll management tools","Modelling tools","Building permit management tools"],"correct":[0,2],"exp":"IREB recognizes: requirements management tools, modelling tools, prototyping tools, and quality/review tools. [K1]"},{"id":"GP-t7-02","type":"P","pts":1,"need":2,"q":"Which TWO of the following are typical integration points for an RM tool in an ALM environment?","opts":["Test management tools","Graphic design software","Issue/defect tracking tools","Tax calculation software"],"correct":[0,2],"exp":"In ALM, RM tools integrate with test management (requirements → test cases) and defect tracking (defects linked back to requirements). [K2]"},{"id":"GP-t7-03","type":"P","pts":1,"need":2,"q":"Which TWO best describe benefits of dedicated RM tools over document-based approaches?","opts":["Built-in traceability linking between requirements and other artifacts","Elimination of all requirement defects automatically","Automatic change impact analysis based on traceability links","No need for stakeholder validation of requirements"],"correct":[0,2],"exp":"Dedicated RM tools provide traceability linking and change impact analysis. They do not auto-eliminate defects or replace stakeholder validation. [K2]"},{"id":"GP-t7-04","type":"P","pts":1,"need":2,"q":"Which TWO of the following are valid criteria for RE tool selection?","opts":["Integration with the organization's existing toolchain","The vendor CEO's biography","Total cost of ownership including training and maintenance","The tool's background color options"],"correct":[0,2],"exp":"Key selection criteria: functionality, integration, usability, TCO (licensing + training + maintenance), support, and scalability. [K2]"},{"id":"GP-t7-05","type":"P","pts":1,"need":2,"q":"Which TWO of the following are recognized limitations of using dedicated RE tools?","opts":["Tool lock-in risk from proprietary data formats","Inability to store any form of requirements","Training overhead during initial tool adoption","The tools can never support any form of traceability"],"correct":[0,2],"exp":"Recognized tool limitations: lock-in risk and training overhead. Tools can store requirements and support traceability by definition. [K2]"},{"id":"GP-t7-06","type":"P","pts":1,"need":2,"q":"Which TWO best describe what a dedicated RM tool offers compared to a spreadsheet?","opts":["Structured requirements database with versioning","Simpler interface requiring no learning","Built-in traceability matrix generation","Lower total cost in all use cases"],"correct":[0,2],"exp":"RM tools offer: structured database, versioning, built-in traceability. Spreadsheets may be simpler and cheaper for very small projects but don't scale. [K2]"},{"id":"GP-t7-07","type":"P","pts":1,"need":2,"q":"Which TWO of the following are characteristics of the ReqIF standard?","opts":["It uses XML as its data format","It is maintained by the IEEE standards organization","It enables requirements exchange between different RE tool vendors","It is designed exclusively for automotive projects"],"correct":[0,2],"exp":"ReqIF: XML-based, maintained by OMG (not IEEE), enables cross-vendor tool exchange. It is general-purpose, not automotive-only (though widely used in automotive). [K1]"},{"id":"R6-t7-01","type":"A","pts":1,"q":"What is the recommended way to introduce a new requirements management tool into an organization? (1 answer)","opts":["Buy the market leader and roll it out to everyone on day one","Run a pilot on a representative project, evaluate, then roll out incrementally","Let every team buy a different tool","Introduce it without training to save budget"],"correct":[1],"exp":"Pilot projects expose process fit, migration and training issues cheaply before organization-wide commitment."},{"id":"R6-t7-02","type":"K","pts":2,"q":"Decide true or false about introducing RE tools.","stmts":["The RE process should be defined BEFORE selecting a tool to support it","The tool with the largest feature list is automatically the best choice","Migration of existing requirements data is a real cost factor to plan for","User training and onboarding effort belong in the introduction plan"],"correct":[true,false,true,true],"exp":"Process first, then tool. Feature overload harms adoption; migration and training are major hidden costs."},{"id":"R6-t7-03","type":"A","pts":1,"q":"Which of the following is a legitimate INFORMATION SECURITY criterion when selecting an RE tool? (1 answer)","opts":["The colour scheme of the login page","Fine-grained access control and audit logging for requirement changes","The number of emojis supported in comments","The vendor's office location's weather"],"correct":[1],"exp":"Who may read/change which requirements, and traceable change history, are genuine security/compliance criteria."},{"id":"R6-t7-04","type":"P","pts":2,"q":"Which TWO are recognized RISKS of adopting a heavyweight RM tool? (2 answers)","opts":["The team bends its process to fit the tool instead of the reverse","High licence, customization, and maintenance costs may exceed the benefit","Requirements become automatically correct","Traceability becomes impossible","The tool prevents all future change requests"],"need":2,"correct":[0,1],"exp":"Process distortion and cost explosion are classic adoption risks; tools never guarantee content quality."},{"id":"R6-t7-05","type":"A","pts":1,"q":"A stakeholder asks: \"Show me only the high-priority requirements that are still unapproved.\" Which RM tool capability serves this? (1 answer)","opts":["Filtering and configurable views over requirement attributes","Source code compilation","Photo editing","Hardware provisioning"],"correct":[0],"exp":"Attribute-based filtering/views are a core capability of requirements management tools."},{"id":"R6-t7-06","type":"K","pts":2,"q":"Decide true or false about what RE tools can and cannot do.","stmts":["A tool cannot compensate for an undefined or broken RE process","For small projects, generic tools (e.g. spreadsheets, wikis) can be adequate","Using a certified RM tool guarantees high-quality requirements content","Reporting dashboards help communicate requirements status to management"],"correct":[true,true,false,true],"exp":"Tools amplify a working process; they cannot create one. Content quality stays a human responsibility."},{"id":"R6-t7-07","type":"A","pts":1,"q":"What is a specific advantage of a MODELING tool over a general drawing tool for RE diagrams? (1 answer)","opts":["It enforces notation syntax and keeps model elements consistent across diagrams","It has more clip-art","It produces prettier gradients","It removes the need for textual requirements"],"correct":[0],"exp":"Modeling tools know the metamodel: syntax checking, element reuse, and consistency across views - drawings offer none of that."},{"id":"R6-t7-08","type":"P","pts":2,"q":"Which TWO criteria categories belong in a structured RE tool evaluation? (2 answers)","opts":["Functional fit with the defined RE process and required capabilities","Vendor viability, support quality, and total cost of ownership","The tool's ranking in a random blog post","Number of conference giveaways from the vendor","The default desktop wallpaper"],"need":2,"correct":[0,1],"exp":"Evaluate against your process needs plus vendor/TCO factors - not marketing noise."},{"id":"R6-t7-09","type":"A","pts":1,"q":"In which situation does the ReqIF exchange format provide the MOST value? (1 answer)","opts":["A single developer keeps requirements in one text file","A customer and several suppliers must exchange requirements between different RM tools without data loss","A team wants to render diagrams as PNG","Requirements never leave one tool"],"correct":[1],"exp":"ReqIF exists for lossless, tool-independent requirements interchange across organizations - typical in automotive customer-supplier chains."},{"id":"R6-t7-10","type":"K","pts":2,"q":"Decide true or false about collaboration capabilities of modern RM tools.","stmts":["Concurrent multi-user editing with conflict handling supports distributed teams","Commenting and discussion threads on individual requirements support clarification","Notifications about requirement changes help affected parties react","Collaboration features make requirements validation activities unnecessary"],"correct":[true,true,true,false],"exp":"Collaboration features streamline communication but validation (agreement of the right stakeholders) still has to happen."},{"id":"R6-t7-11","type":"A","pts":1,"q":"A small team keeps a Word specification but mirrors the requirement list with IDs and status in a spreadsheet. This approach is BEST described as: (1 answer)","opts":["Forbidden by IREB","A pragmatic document-based RM approach acceptable when scale and risk are low","A full ALM integration","Model-driven engineering"],"correct":[1],"exp":"IREB acknowledges document-based management for small/low-risk contexts; dedicated tools pay off as scale, change rate, and traceability needs grow."},{"id":"R6-t7-12","type":"P","pts":2,"q":"Which TWO concerns matter MOST when migrating an existing requirements repository into a new tool? (2 answers)","opts":["Preserving requirement IDs, attributes, and traceability links during transfer","Validating that no content was lost or corrupted after migration","Choosing a new font for the tool UI","Renaming all requirements to start with \"REQ-NEW\"","Deleting the old history to save space"],"need":2,"correct":[0,1],"exp":"Identity, attributes, traces, and verified completeness are the substance of a migration; history should be kept, not purged."},{"id":"R6-t7-13","type":"A","pts":1,"q":"Which cost type is EASIEST to overlook when budgeting an RM tool introduction? (1 answer)","opts":["The licence price on the order form","Ongoing costs: administration, customization upkeep, training of new staff, future migrations","The cost of the installation DVD","The price of the vendor logo"],"correct":[1],"exp":"TCO is dominated by recurring operation/adaptation/training costs, not the visible licence fee."},{"id":"R6-t7-14","type":"K","pts":2,"q":"Decide true or false about simulation and prototyping tools in RE.","stmts":["Simulation tools can make requirements for dynamic behaviour experienceable before the system exists","Findings from a simulated model can trigger requirement changes","Such tools are only usable after the system has shipped","They complement, but do not replace, requirements documentation"],"correct":[true,true,false,true],"exp":"Executable models/simulations let stakeholders test behaviour early; insights flow back into the requirements, which still must be documented."},{"id":"R6-t7-15","type":"A","pts":1,"q":"A globally distributed team suffers from conflicting local copies of the specification. Which tool capability addresses the root problem? (1 answer)","opts":["A central repository acting as single source of truth with versioning","Bigger monitors for everyone","Exporting more PDF copies","Disabling all access controls"],"correct":[0],"exp":"One authoritative, versioned repository eliminates divergent copies - the defining benefit of database-backed RM tools."}]};
